/* ================================================================
   TEST PLAYER PAGE (runs inside the sandbox-less iframe)

   buildTestHTML() is used in two ways:
   1) At publish time by the Manual Builder (no `boot`) — the stored
      htmlContent keeps the QUESTIONS / CORRECT_MARK / WRONG_MARK lines
      that getTestDef() reads back.
   2) At runtime by the test engine, ALWAYS regenerated from the parsed
      questions with a `boot` object (mode attempt | practice | review).
      This is why tests published before Phase 1 get the new player,
      resume and review without any migration.

   The player script is a real function (tmsPlayerMain) serialised with
   .toString(), so it is ordinary, lintable code instead of a giant string.
   The iframe never touches Firestore: it talks to the app via postMessage
   ({tms:1, type:'start'|'state'|'submit'} out, 'started'|'startFailed'|
   'submitted'|'submitFailed' in).
   ================================================================ */
/* TMS_PLAYER_CSS, TMS_PLAYER_BODY and tmsPlayerMain (the test player that runs inside the iframe)
   now live in tms-player.js, loaded by a plain <script src> just above this script. buildTestHTML()
   below uses them unchanged. */

function buildTestHTML(meta, questions, boot){
  // Defends against a script-closing tag anywhere in admin-entered
  // text/JSON prematurely closing the <script> tag when the browser's
  // HTML parser scans this generated page — same escaping trick this
  // project already uses for the outer template's own closing tags.
  const jsSafe = v => JSON.stringify(v).replace(/<\/script/gi, '<\\/script');
  const qData = jsSafe(questions);
  const correctMark = meta.correctMark ?? 4;
  const wrongMark = meta.wrongMark ?? -1;
  const layout = meta.answerButtonLayout || 'grid2x2';
  const layoutClass = layout==='horizontal' ? 'layout-h' : layout==='vertical' ? 'layout-v' : 'layout-grid';
  const bootData = jsSafe(boot || { mode:'practice', durationMin: meta.duration||0, fullMarks: 0, perCorrect: correctMark, perWrong: wrongMark, resume: null });
  return `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script>window.MathJax={tex:{inlineMath:[['$','$']],displayMath:[['$$','$$']]}};<\/script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" defer><\/script>
<style>${TMS_PLAYER_CSS}</style></head>
<body oncontextmenu="return false">
${TMS_PLAYER_BODY}
<script>['copy','cut','selectstart','dragstart'].forEach(function(ev){document.addEventListener(ev,function(e){var t=e.target&&e.target.nodeType===3?e.target.parentElement:e.target;if(t&&t.closest&&t.closest('input,textarea'))return;e.preventDefault();},true);});<\/script>
<script>
const QUESTIONS = ${qData};
const CORRECT_MARK = ${correctMark}, WRONG_MARK = ${wrongMark};
const LAYOUT_CLASS = '${layoutClass}';
const TITLE = ${jsSafe(meta.title||'Test')};
const SUBJECT = ${jsSafe(meta.subject||'')};
const DURATION_MIN = ${meta.duration||0};
const BOOT = ${bootData};
<\/script>
<script>(${tmsPlayerMain.toString()})();<\/script>
</body></html>`;
}

/* ================================================================
   11) ADMIN APP — lives in admin.js, fetched on demand (admin sessions only)
   ----------------------------------------------------------------
   renderScreen() is the ONLY place that touches it: when STATE.screen === 'admin' and renderAdminShell() is not
   defined yet, loadAdminCode() appends <script src="admin.js"> once, then renders again. Students never load it.
   admin.js is a plain classic script (global scope shared with this one); service-worker.js serves every same-origin
   .js network-first, so a deploy can never mix a new index.html with a stale admin.js.
   ================================================================ */
function contentActive(x){ return x.active !== false; }   // also used by the student Classes/Notes lists, so it stays here

let ADMIN_CODE_PROMISE = null;
function loadAdminCode(){
  if(typeof renderAdminShell === 'function') return Promise.resolve();
  if(!ADMIN_CODE_PROMISE){
    ADMIN_CODE_PROMISE = new Promise((resolve, reject)=>{
      const s = document.createElement('script');
      s.src = 'admin.js';
      s.onload  = ()=> (typeof renderAdminShell === 'function') ? resolve() : reject(new Error('admin.js loaded but is incomplete'));
      s.onerror = ()=> reject(new Error('Could not download the admin panel'));
      document.head.appendChild(s);
    }).catch(err=>{ ADMIN_CODE_PROMISE = null; throw err; });   // allow a retry after a failure
  }
  return ADMIN_CODE_PROMISE;
}
function adminCodeLoadFailed(err){
  console.error('Admin code load failed:', err);
  if(STATE.screen !== 'admin') return;
  const app = $('#app');
  app.innerHTML = '';
  app.appendChild(el(`
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center">
      <div>
        <div style="font-size:15px;font-weight:700;margin-bottom:8px">Couldn't load the admin panel</div>
        <div style="font-size:12px;color:var(--text-muted);max-width:320px;margin:0 auto">Check your internet connection and try again.</div>
        <button class="btn btn-primary" style="margin-top:16px;width:auto;padding:10px 20px" id="adminRetryBtn">↻ Try again</button>
      </div>
    </div>
  `));
  $('#adminRetryBtn', app).addEventListener('click', ()=> renderScreen());
}

/* ================================================================
   12) PWA — service worker registration + install button
   ================================================================ */
/* Notification tap -> app. service-worker.js' notificationclick handler focuses the installed app/tab and either
   posts {type:'tms-open-announcements'} to it (already open) or opens index.html?open=announcements (closed).
   Both only switch the visible tab — nothing is marked read or written; "Got it" stays the only thing that does.
   This is NOT push: it only runs after the student taps a notification the open-app listener already showed. */
(function setupNotificationClickRouting(){
  try{
    const u = new URL(location.href);
    if(u.searchParams.get('open') === 'announcements'){
      STATE.studentTab = 'announcements';   // used once the student session is up (or right after they sign in)
      u.searchParams.delete('open');
      history.replaceState(history.state, '', u.pathname + u.search + u.hash);
    }
  }catch(e){}
  if(!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.addEventListener('message', ev=>{
    const d = ev && ev.data;
    if(!d || d.type !== 'tms-open-announcements') return;
    if(STATE.screen !== 'student' || CURRENT_ROLE !== 'student') return;   // signed out / admin: leave the app where it is
    if(TMS_ACTIVE) return;                                                  // never pull a student out of a running test
    STATE.studentTab = 'announcements';
    renderScreen();
  });
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(err=>console.error('SW register failed:', err));
  });
}

(function setupInstallButton(){
  const btn = document.getElementById('pwaInstallBtn');
  if(!btn) return;

  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if(isStandalone) return; // already installed / already running as the app — nothing to offer

  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  let deferredPrompt = null;

  window.addEventListener('beforeinstallprompt', (e)=>{
    e.preventDefault();
    deferredPrompt = e;
    btn.style.display = 'block';
  });

  window.addEventListener('appinstalled', ()=>{
    btn.style.display = 'none';
    deferredPrompt = null;
  });

  if(isIOS){
    // iOS Safari has no beforeinstallprompt API — show the button and
    // explain the manual Share-sheet steps instead.
    btn.style.display = 'block';
  }

  btn.addEventListener('click', async ()=>{
    if(deferredPrompt){
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      btn.style.display = 'none';
    } else if(isIOS){
      toast('Tap the Share icon, then "Add to Home Screen"');
    } else {
      toast('Use your browser menu → "Install app" or "Add to Home screen"');
    }
  });
})();
</script>
