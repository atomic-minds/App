<style>
/* ============================================================
   ATOMIC MINDS THEME
   Deep purple / near-black, matching the atom+brain brand mark.
   System font stack on purpose — no webfont download, since many
   students are on slow mobile data (seen in your screenshots).
   ============================================================ */
:root{
  color-scheme: dark;
  --bg:#12081c;
  --surface:#1c1030;
  --surface-2:#241539;
  --border:#3a2a5c;
  --border-soft:#2a1d47;
  --accent:#9b8ce8;
  --accent-bright:#7f77dd;
  --text:#f3f0fa;
  --text-muted:#a89ae0;
  --text-dim:#7a6da8;
  --success:#4ade80; --success-bg:rgba(34,197,94,.15); --success-brd:rgba(34,197,94,.35);
  --danger:#f87171;  --danger-bg:rgba(239,68,68,.15);  --danger-brd:rgba(239,68,68,.35);
  --warning:#fbbf24; --warning-bg:rgba(245,158,11,.15); --warning-brd:rgba(245,158,11,.35);
  --radius:10px;
  --radius-lg:16px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font);
  -webkit-tap-highlight-color:transparent;}
body{min-height:100vh;font-size:15px;line-height:1.5}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
img{max-width:100%}
::selection{background:var(--accent-bright);color:#fff}

#app{min-height:100vh;display:flex;flex-direction:column}

/* -------- shared building blocks -------- */
.container{max-width:480px;margin:0 auto;width:100%;padding:0 16px}
.card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px}
.card-title{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px;color:var(--text)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:5px;font-weight:500}
.field input,.field select,.field textarea{
  width:100%;padding:10px 12px;border-radius:var(--radius);
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:80px;font-family:inherit}
.field .hint{font-size:11px;color:var(--text-dim);margin-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;
  padding:11px;border-radius:var(--radius);border:1px solid transparent;font-size:14px;font-weight:600;}
.btn-primary{background:var(--accent-bright);color:#150a1f}
.btn-primary:hover{opacity:.92}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:var(--surface-2);color:var(--text-muted);border-color:var(--border)}
.btn-danger{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-brd)}
.btn-success{background:var(--success-bg);color:var(--success);border-color:var(--success-brd)}
.btn-sm{width:auto;padding:6px 12px;font-size:12px;font-weight:500;border-radius:8px}

.badge{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.2px}
.badge-free{background:var(--success-bg);color:var(--success)}
.badge-paid{background:var(--warning-bg);color:var(--warning)}
.badge-live{background:var(--danger-bg);color:var(--danger)}
.badge-muted{background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border)}
.badge-accent{background:rgba(155,140,232,.15);color:var(--accent)}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--text);color:var(--bg);padding:9px 18px;border-radius:24px;font-size:13px;font-weight:500;
  opacity:0;pointer-events:none;transition:all .25s;z-index:999;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.empty-state{text-align:center;padding:40px 20px;color:var(--text-dim)}
.empty-state .icon{font-size:30px;margin-bottom:8px;opacity:.6}
.spinner{width:22px;height:22px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;
  animation:spin .7s linear infinite;margin:24px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* -------- logo -------- */
.logo-mark{display:block;margin:0 auto}
.brand-row{display:flex;flex-direction:column;align-items:center;text-align:center}
.brand-name{font-size:21px;font-weight:600;color:#fff;letter-spacing:.2px;margin-top:8px}
.brand-tagline{font-size:12px;color:var(--text-muted);margin-top:2px}

/* -------- auth screens -------- */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.auth-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border-soft);
  border-radius:20px;padding:28px 22px}
.auth-tabs{display:flex;gap:4px;padding:4px;background:var(--bg);border-radius:12px;margin:22px 0 18px}
.auth-tab{flex:1;padding:9px 4px;border:none;background:none;border-radius:9px;font-size:13px;font-weight:600;
  color:var(--text-dim);transition:all .15s}
.auth-tab.active{background:var(--surface-2);color:#fff;border:1px solid var(--border)}
.auth-error{background:var(--danger-bg);border:1px solid var(--danger-brd);color:var(--danger);
  font-size:12px;padding:9px 12px;border-radius:8px;margin-bottom:12px;display:none}
.auth-error.show{display:block}
.auth-link{text-align:center;font-size:12px;color:var(--text-dim);margin-top:14px}
.optional-toggle{text-align:center;font-size:12px;color:var(--accent);margin:6px 0 4px;cursor:pointer;user-select:none}
.optional-fields{display:none;border-top:1px solid var(--border-soft);padding-top:12px;margin-top:4px}
.optional-fields.show{display:block}
.admin-link{position:fixed;bottom:10px;left:0;right:0;text-align:center;font-size:11px;color:var(--text-dim);
  opacity:.6}

/* -------- student shell (bottom tabs) -------- */
.app-shell{display:flex;flex-direction:column;min-height:100vh}
.top-header{position:sticky;top:0;z-index:20;background:rgba(18,8,28,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border-soft);padding:12px 16px;display:flex;align-items:center;gap:10px}
.top-header .logo-mark{margin:0}
.top-header .th-name{font-size:15px;font-weight:600;flex:1}
.content-area{flex:1;padding:16px;padding-bottom:90px;max-width:480px;margin:0 auto;width:100%}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(28,16,48,.97);backdrop-filter:blur(10px);
  border-top:1px solid var(--border-soft);display:flex;z-index:30;max-width:480px;margin:0 auto}
.bottom-nav button{flex:1;background:none;border:none;padding:9px 2px 8px;display:flex;flex-direction:column;
  align-items:center;gap:3px;color:var(--text-dim);font-size:10px;font-weight:500}
.bottom-nav button.active{color:var(--accent)}
.bottom-nav .bn-icon{font-size:19px}

/* -------- admin shell (top tabs) -------- */
.admin-shell{display:flex;flex-direction:column;min-height:100vh}
.admin-header{position:sticky;top:0;z-index:20;background:rgba(18,8,28,.96);border-bottom:1px solid var(--border-soft);
  padding:12px 16px}
.admin-header-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.admin-tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.admin-tab{padding:7px 13px;border:1px solid var(--border);background:var(--surface-2);border-radius:20px;
  font-size:12px;font-weight:600;color:var(--text-dim);white-space:nowrap}
.admin-tab.active{background:rgba(155,140,232,.18);color:var(--accent);border-color:var(--accent)}
.admin-content{flex:1;padding:16px;max-width:560px;margin:0 auto;width:100%}

/* -------- rich content (MathJax / images / svg) -------- */
.rich-content{font-size:14px;line-height:1.7;color:var(--text)}
.rich-content img{border-radius:8px;margin:8px 0;display:block}
.rich-content svg{max-width:100%}
mjx-container{color:var(--text) !important}

/* -------- item lists reused across tabs -------- */
.item-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);
  padding:13px;margin-bottom:9px}
.item-top{display:flex;gap:10px;align-items:flex-start}
.item-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;background:var(--surface-2)}
.item-info{flex:1;min-width:0}
.item-title{font-size:13.5px;font-weight:600}
.item-meta{font-size:11px;color:var(--text-dim);margin-top:2px;line-height:1.6}
.item-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.item-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

/* -------- modal / overlay -------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:flex;align-items:flex-end;
  justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:all}
.sheet{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:92vh;
  overflow-y:auto;padding:16px 16px 28px;transform:translateY(40px);transition:transform .25s;
  border:1px solid var(--border-soft);border-bottom:none}
.overlay.open .sheet{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px}
.sheet-close{position:sticky;top:0;float:right;background:var(--surface-2);border:1px solid var(--border);
  color:var(--text-muted);border-radius:8px;padding:5px 10px;font-size:12px}

.tab-filter{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px}
.tab-filter button{padding:6px 13px;border:1px solid var(--border);background:none;border-radius:20px;
  font-size:11.5px;color:var(--text-dim);white-space:nowrap}
.tab-filter button.active{background:rgba(155,140,232,.15);color:var(--accent);border-color:var(--accent)}

.search-input-wrap{position:relative;margin-bottom:10px}
.search-input-wrap input{padding:10px 12px 10px 34px;width:100%;border-radius:var(--radius);
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);outline:none}
.search-input-wrap input:focus{border-color:var(--accent)}
.search-input-wrap input::placeholder{color:var(--text-dim)}
.search-input-wrap .si{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:14px}

/* -------- hamburger + drawer -------- */
.hamburger-btn{background:none;border:none;color:var(--text);font-size:20px;padding:4px 8px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:8px}
.hamburger-btn:active{background:var(--surface-2)}
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:150;opacity:0;pointer-events:none;
  transition:opacity .2s}
.drawer-overlay.open{opacity:1;pointer-events:all}
.drawer-panel{position:absolute;top:0;left:0;bottom:0;width:78%;max-width:300px;background:var(--surface);
  border-right:1px solid var(--border-soft);transform:translateX(-100%);transition:transform .25s;
  display:flex;flex-direction:column;padding:18px 14px}
.drawer-overlay.open .drawer-panel{transform:translateX(0)}
.drawer-brand{display:flex;align-items:center;gap:10px;padding:6px 6px 16px;border-bottom:1px solid var(--border-soft);margin-bottom:10px}
.drawer-brand .bn{font-size:15px;font-weight:700}
.drawer-item{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:10px;border:none;
  background:none;color:var(--text-muted);font-size:14px;font-weight:500;text-align:left;width:100%}
.drawer-item.active{background:rgba(155,140,232,.15);color:var(--accent)}
.drawer-item .di-icon{font-size:17px;width:22px;text-align:center;flex-shrink:0}
.drawer-item .di-badge{margin-left:auto;background:var(--danger-bg);color:var(--danger);font-size:10px;
  font-weight:700;padding:2px 7px;border-radius:20px}
.drawer-divider{height:1px;background:var(--border-soft);margin:8px 4px}
.drawer-footer{margin-top:auto;padding-top:10px}

/* -------- admin home grid dashboard -------- */
.home-welcome{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);
  padding:18px;margin-bottom:16px}
.home-welcome .hw-title{font-size:18px;font-weight:700}
.home-welcome .hw-sub{font-size:12px;color:var(--text-muted);margin-top:3px}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.home-tile{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);
  padding:20px 14px;display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;
  position:relative;transition:border-color .15s}
.home-tile:active{border-color:var(--accent)}
.home-tile .ht-icon{font-size:26px}
.home-tile .ht-label{font-size:13px;font-weight:600;color:var(--text)}
.home-tile .ht-badge{position:absolute;top:10px;right:10px;background:var(--danger-bg);color:var(--danger);
  font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px}

/* -------- upgrade request UI -------- */
.upgrade-banner{background:linear-gradient(135deg,rgba(155,140,232,.18),rgba(127,119,221,.08));
  border:1px solid var(--accent);border-radius:var(--radius-lg);padding:14px;margin-bottom:12px;text-align:center}
.upgrade-pending{background:var(--warning-bg);border:1px solid var(--warning-brd);color:var(--warning);
  border-radius:var(--radius);padding:10px 12px;font-size:12.5px;text-align:center;margin-bottom:12px}

/* -------- batches & enrollments -------- */
.batch-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);
  padding:14px;margin-bottom:9px;cursor:pointer}
.batch-card:active{border-color:var(--accent)}
.batch-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.batch-name{font-size:14.5px;font-weight:700}
.batch-desc{font-size:11.5px;color:var(--text-dim);margin-top:2px}
.batch-meta-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.expiry-toggle{display:flex;gap:6px;margin-bottom:10px}
.expiry-toggle button{flex:1;padding:8px;border:1px solid var(--border);background:var(--surface-2);
  border-radius:var(--radius);font-size:12px;font-weight:600;color:var(--text-dim)}
.expiry-toggle button.active{background:rgba(155,140,232,.18);color:var(--accent);border-color:var(--accent)}
.enroll-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-soft)}
.enroll-row:last-child{border:none}
.enroll-info{flex:1;min-width:0}
.enroll-name{font-size:13px;font-weight:600}
.enroll-meta{font-size:11px;color:var(--text-dim);margin-top:2px}
.badge-suspended{background:var(--warning-bg);color:var(--warning)}
.badge-expired{background:var(--danger-bg);color:var(--danger)}

@media(min-width:481px){
  .content-area,.bottom-nav{max-width:480px}
}
</style>
</head>

<div class="toast" id="toastEl"></div>

<button id="pwaInstallBtn" style="position:fixed;top:12px;right:12px;z-index:200;display:none;
  background:#7f77dd;color:#150a1f;border:none;border-radius:20px;padding:8px 15px;
  font-size:12px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.45);cursor:pointer;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">

</button>

<script>
/* ================================================================
   1) FIREBASE CONFIG
   ----------------------------------------------------------------
   Paste the config object from Firebase Console → Project settings
   → General → Your apps → SDK setup and configuration.
   This is safe to keep visible here — Firebase is designed for the
   config to be public. Real security comes from firestore.rules
   and storage.rules (separate files provided alongside this one).
   ================================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCBdvPx2RBlDJJI8A52hMfColisKEDD8RI",
  authDomain: "atomic-minds-a3017.firebaseapp.com",
  projectId: "atomic-minds-a3017",
  storageBucket: "atomic-minds-a3017.firebasestorage.app",
  messagingSenderId: "1099120272705",
  appId: "1:1099120272705:web:ab8208f91d1bed12bb6dc0"
};

let auth, db;
try{
  if(typeof firebase === 'undefined'){
    throw new Error('SDK_NOT_LOADED');
  }
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.firestore();
}catch(initErr){
  console.error('Firebase init failed:', initErr);
  const sdkMissing = initErr && initErr.message === 'SDK_NOT_LOADED';
  const heading = sdkMissing ? 'The Firebase library didn\u2019t load' : 'Could not connect to Firebase';
  const detail = sdkMissing
    ? 'This page is being opened somewhere that blocks loading outside scripts (a local file preview, an in-app viewer, or no internet connection) \u2014 not a code problem.'
    : (initErr && initErr.message ? initErr.message : 'Unknown error');
  const hint = sdkMissing
    ? 'Deploy this folder to Netlify (or any real https host) and open that live link \u2014 Firebase needs a real http/https address, not a file opened locally or through a preview app.'
    : 'Check that this page is served over http/https (not opened by double-clicking the file), and that the firebaseConfig values above match your Firebase project exactly.';
  document.getElementById('app').innerHTML =
    '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:sans-serif;color:#f3f0fa;background:#12081c">' +
    '<div><div style="font-size:15px;font-weight:700;margin-bottom:8px">' + heading + '</div>' +
    '<div style="font-size:12px;color:#a89ae0;max-width:320px">' + detail + '</div>' +
    '<div style="font-size:11px;color:#7a6da8;margin-top:14px;max-width:320px">' + hint + '</div>' +
    '</div></div>';
  throw initErr;
}

/* ================================================================
   2) CONSTANTS & SMALL UTILITIES
   ================================================================ */
const COL = {
  students: 'students',
  admins: 'admins',
  videos: 'videos',
  liveClasses: 'liveClasses',
  tests: 'tests',
  testResults: 'testResults',
  notes: 'notes',
  payments: 'payments',
  upgradeRequests: 'upgradeRequests',
  batchJoinRequests: 'batchJoinRequests',
  batches: 'batches',
  enrollments: 'enrollments'
};

const BRAND = { name: 'Atomic Minds', tagline: 'Stop Memorizing. Start realizing.' };

let CURRENT_USER = null;   // firebase auth user
let CURRENT_PROFILE = null; // firestore student/admin doc data
let CURRENT_ROLE = null;   // 'student' | 'admin'

// ---- active-session (one-device-at-a-time) state, see AUTH ACTIONS below ----
let LOGIN_IN_PROGRESS = false;   // true while doLogin()/doAdminLogin() is validating a fresh sign-in
let CURRENT_SESSION_ID = null;   // this tab's claim on students/{uid}.activeSessionId, once logged in as a student
let SESSION_HEARTBEAT_TIMER = null; // setInterval handle that refreshes lastActivityAt while the student app is open

function $(sel, root){ return (root||document).querySelector(sel); }
function $all(sel, root){ return Array.from((root||document).querySelectorAll(sel)); }
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(ts){
  if(!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}
function toast(msg){

/* Shared slide-out nav drawer for both the student and admin shells.
   items: [{ key, icon, label, badge?, onSelect }]  activeKey: current key */
function openDrawer(title, items, activeKey){
  const overlay = el(`<div class="drawer-overlay">
    <div class="drawer-panel">
      <div class="drawer-brand">${buildLogo(28)}<span class="bn">${esc(title)}</span></div>
      <div id="drawerItems"></div>
    </div>
  </div>`);
  const list = $('#drawerItems', overlay);
  items.forEach(it=>{
    if(it.divider){ list.appendChild(el(`<div class="drawer-divider"></div>`)); return; }
    const row = el(`<button class="drawer-item ${it.key===activeKey?'active':''}">
      <span class="di-icon">${it.icon}</span><span>${esc(it.label)}</span>
      ${it.badge ? `<span class="di-badge">${esc(it.badge)}</span>` : ''}
    </button>`);
    row.addEventListener('click', ()=>{ closeDrawer(); it.onSelect && it.onSelect(); });
    list.appendChild(row);
  });
  document.body.appendChild(overlay);
  requestAnimationFrame(()=> overlay.classList.add('open'));
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeDrawer(); });
  window.__amDrawerOverlay = overlay;
}
function closeDrawer(){
  const o = window.__amDrawerOverlay;
  if(!o) return;
  o.classList.remove('open');
  setTimeout(()=> o.remove(), 200);
  window.__amDrawerOverlay = null;
}

/* Renders text that may contain LaTeX ($...$), raw <img>, or raw <svg>.
   Used for every question, solution, note description, admin note, etc.
   A light allow-list strips <script> tags but keeps img/svg/formatting
   so admin can paste chemistry structure images or hand-drawn SVGs. */
function renderRich(container, raw){
  if(!raw){ container.innerHTML=''; return; }
  const cleaned = String(raw).replace(/<script[\s\S]*?<\/script>/gi,'');
  container.innerHTML = cleaned;
  if(window.MathJax && window.MathJax.typesetPromise){
    window.MathJax.typesetPromise([container]).catch(()=>{});
  }
}

/* A random ID generated once per browser/device and stored in localStorage,
   used to identify "this browser" to the active-session system below (see
   AUTH ACTIONS). It is NOT itself a login lock — it's just this device's
   fingerprint; students/{uid}.activeDeviceId is the temporary lock, and it
   is released on logout or after a period of inactivity, not tied
   permanently to any one device.
   Wrapped defensively: some browser contexts (strict private-browsing
   modes, certain in-app browsers) can block localStorage entirely — if
   that happens we fall back to a session-only id instead of crashing. */
function getDeviceId(){
  try{
    let id = localStorage.getItem('am_device_id');
    if(!id){
      id = 'dev_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('am_device_id', id);
    }
    return id;
  }catch(e){
    console.error('[device-lock] localStorage unavailable, using a session-only id:', e);
    if(!window.__amFallbackDeviceId){
      window.__amFallbackDeviceId = 'dev_fallback_' + Math.random().toString(36).slice(2);
    }
    return window.__amFallbackDeviceId;
  }
}

/* ================================================================
   6) AUTH ACTIONS
   ----------------------------------------------------------------
   ACTIVE-SESSION SYSTEM (one student device at a time)
   Replaces the old permanent "deviceId lock" with a temporary claim:
     students/{uid}.activeSessionId   — random id for the current login
     students/{uid}.activeDeviceId    — which browser/device holds it
     students/{uid}.sessionStartedAt  — server timestamp, informational
     students/{uid}.lastActivityAt    — server timestamp, refreshed by a
                                         heartbeat while the app is open
   A session is "stale" (available to claim) once lastActivityAt is older
   than SESSION_STALE_MS — this is what unlocks a forgotten-open browser
   without needing an admin reset. Logging out clears the four fields
   immediately instead of waiting for staleness. The old "deviceId" field
   is left in place for backward compatibility but is no longer read as a
   lock anywhere.
   ================================================================ */
const SESSION_STALE_MS = 20 * 60 * 1000;    // session is claimable again after 20 min of no activity
const SESSION_HEARTBEAT_MS = 5 * 60 * 1000; // refresh lastActivityAt every 5 min while the app is open

function newSessionId(){
  return 'sess_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
}

/* This browser tab's record of which session it currently holds, so a
   page reload can tell "is the lock still mine?" without guessing, and a
   logout can avoid ever clearing a session it doesn't own. Kept in
   sessionStorage (per-tab, cleared when the tab/window closes) rather
   than localStorage, deliberately: it should NOT survive into a brand
   new tab the way the device id does. */
function getLocalSessionId(){
  try{ return sessionStorage.getItem('am_session_id') || null; }
  catch(e){ return CURRENT_SESSION_ID; }
}
function setLocalSessionId(id){
  try{
    if(id) sessionStorage.setItem('am_session_id', id);
    else sessionStorage.removeItem('am_session_id');
  }catch(e){ console.error('[session] sessionStorage unavailable (non-blocking):', e); }
}

/* Attempts to claim (or silently confirm) this device's exclusive active
   session for a student, inside a Firestore transaction so two
   near-simultaneous logins on different devices can't both succeed.
   - If a DIFFERENT device holds a still-live (non-stale) session, throws
     { code:'device-locked', message } — the one real, intended block.
   - If the same device already holds it (another tab, or resuming after
     the browser was fully closed), or the session is stale/absent
     (including old documents that don't have these fields yet), claims a
     session for this device and returns its id.
   Returns the session id this device now holds. */
async function claimStudentSession(uid, myDevice, myKnownSessionId){
  const ref = db.collection(COL.students).doc(uid);
  return db.runTransaction(async (tx) => {
    const snap = await tx.get(ref);
    if(!snap.exists){
      throw { code:'', message:'Student record not found.' };
    }
    const data = snap.data();
    const lastActive = (data.lastActivityAt && data.lastActivityAt.toDate) ? data.lastActivityAt.toDate().getTime() : 0;
    const isStale = !data.activeSessionId || !lastActive || (Date.now() - lastActive) > SESSION_STALE_MS;
    const sameDevice = !!data.activeDeviceId && data.activeDeviceId === myDevice;
    const sameSession = sameDevice && !!myKnownSessionId && data.activeSessionId === myKnownSessionId;

    if(!isStale && !sameDevice){
      throw { code:'device-locked', message:'This account is currently logged in on another device. Please log out from that device first, or ask your teacher to reset your device.' };
    }
    if(sameSession && !isStale){
      // Already our own confirmed session — just refresh activity.
      tx.update(ref, { lastActivityAt: firebase.firestore.FieldValue.serverTimestamp() });
      return myKnownSessionId;
    }
    // No live session, it's gone stale, or it's this same device reclaiming
    // (a second tab, or resuming after being fully closed) — issue a fresh
    // session for this device. This also auto-migrates old student
    // documents that never had these fields.
    const sid = newSessionId();
    tx.update(ref, {
      activeSessionId: sid,
      activeDeviceId: myDevice,
      sessionStartedAt: firebase.firestore.FieldValue.serverTimestamp(),
      lastActivityAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    return sid;
  });
}

/* Clears the active-session fields ONLY if they still belong to this
   browser/session — never another device's, and never a different tab's
   newer claim on the same device. Never throws (logout must always be
   able to proceed even if this fails). */
async function releaseStudentSession(uid, myKnownSessionId){
  if(!myKnownSessionId) return;
  try{
    await db.runTransaction(async (tx) => {
      const ref = db.collection(COL.students).doc(uid);
      const snap = await tx.get(ref);
      if(!snap.exists) return;
      const data = snap.data();
      if(data.activeSessionId && data.activeSessionId === myKnownSessionId){
        tx.update(ref, {
          activeSessionId: '', activeDeviceId: '',
          sessionStartedAt: null, lastActivityAt: null
        });
      }
      // else: a different device/tab now owns the session — leave it alone.
    });
  }catch(e){
    console.error('[session] failed to release session on logout (non-blocking):', e);
  }
}

function startSessionHeartbeat(){
  stopSessionHeartbeat();
  SESSION_HEARTBEAT_TIMER = setInterval(()=>{
    if(!CURRENT_USER || CURRENT_ROLE !== 'student' || !CURRENT_SESSION_ID) return;
    db.collection(COL.students).doc(CURRENT_USER.uid)
      .update({ lastActivityAt: firebase.firestore.FieldValue.serverTimestamp() })
      .catch(e=> console.error('[session] heartbeat update failed (non-blocking):', e));
  }, SESSION_HEARTBEAT_MS);
}
function stopSessionHeartbeat(){
  if(SESSION_HEARTBEAT_TIMER){ clearInterval(SESSION_HEARTBEAT_TIMER); SESSION_HEARTBEAT_TIMER = null; }
}

async function doRegister(data){
  const cred = await auth.createUserWithEmailAndPassword(data.email, data.password);
  const uid = cred.user.uid;
  await db.collection(COL.students).doc(uid).set({
    fullName: data.fullName,
    email: data.email,
    phone: data.phone,
    class: data.class || '',
    batch: data.batch || '',
    location: data.location || '',
    school: data.school || '',
    dob: data.dob || '',
    guardianName: data.guardianName || '',
    guardianPhone: data.guardianPhone || '',
    membership: 'free',
    membershipExpiry: null,
    active: true,
    deviceId: getDeviceId(),
    watchMinutes: 0,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  // Sign back out immediately rather than silently auto-logging them in —
  // show a clear success message and send them to the Log in tab instead.
  // (Flags are set *before* signOut() because the auth-state listener's
  // re-render can fire while signOut() is still resolving.)
  STATE.authMode = 'login';
  STATE.justRegistered = true;
  await auth.signOut();
}

async function doLogin(email, password){
  LOGIN_IN_PROGRESS = true;
  try{
    const cred = await auth.signInWithEmailAndPassword(email, password);
    const uid = cred.user.uid;
    let doc;
    try{
      doc = await db.collection(COL.students).doc(uid).get();
    }catch(fetchErr){
      console.error('[login] could not load student record:', fetchErr);
      await auth.signOut();
      throw { code:'', message:'Could not reach the server. Check your connection and try again.' };
    }
    if(!doc.exists){
      console.error('[login] signed in OK but no students/'+uid+' document exists.');
      await auth.signOut();
      throw { code:'', message:'No student account found for this login. Are you trying the admin login instead?' };
    }
    const data = doc.data();
    if(data.active === false){
      await auth.signOut();
      throw { code:'', message:'Your account has been deactivated. Please contact your teacher.' };
    }
    // Active-session (one-device) check — hardened the same way the old
    // device-lock check was: only a CONFIRMED conflicting session on
    // another device blocks login. A problem with the check itself
    // (offline, a failed transaction) must never lock a legitimate
    // student out, so it's logged and the login is allowed through.
    const myDevice = getDeviceId();
    try{
      const sid = await claimStudentSession(uid, myDevice, null);
      CURRENT_SESSION_ID = sid;
      setLocalSessionId(sid);
    }catch(sessionErr){
      if(sessionErr && sessionErr.code === 'device-locked'){
        await auth.signOut();
        throw { code:'', message: sessionErr.message };
      }
      console.error('[session] claim failed unexpectedly, allowing login anyway:', sessionErr);
      CURRENT_SESSION_ID = null;
      setLocalSessionId(null);
    }
    // Route straight to the dashboard ourselves, rather than waiting on
    // onAuthStateChanged, so a deactivated or device-locked account can
    // never flash the dashboard for an instant before being signed back out.
    CURRENT_USER = cred.user;
    CURRENT_ROLE = 'student';
    CURRENT_PROFILE = data;
    STATE.screen = 'student';
    renderScreen();
    if(CURRENT_SESSION_ID) startSessionHeartbeat();
  } finally {
    LOGIN_IN_PROGRESS = false;
  }
}

async function doAdminLogin(email, password){
  const cred = await auth.signInWithEmailAndPassword(email, password);
  const uid = cred.user.uid;
  const doc = await db.collection(COL.admins).doc(uid).get();
  if(!doc.exists){
    await auth.signOut();
    throw { code:'', message:'This account is not authorized as admin.' };
  }
  // onAuthStateChanged will pick this up and route to the admin app.
}

async function doLogout(){
  const user = auth.currentUser;
  if(user && CURRENT_ROLE === 'student'){
    await releaseStudentSession(user.uid, CURRENT_SESSION_ID || getLocalSessionId());
  }
  stopSessionHeartbeat();
  CURRENT_SESSION_ID = null;
  setLocalSessionId(null);
  auth.signOut();
}

/* ================================================================
   7) AUTH STATE LISTENER — decides which screen to show
   ================================================================ */
auth.onAuthStateChanged(async (user) => {
  CURRENT_USER = user;
  if(!user){
    CURRENT_PROFILE = null; CURRENT_ROLE = null;
    stopSessionHeartbeat();
    CURRENT_SESSION_ID = null;
    STATE.screen = 'auth';
    renderScreen();
    return;
  }
  if(LOGIN_IN_PROGRESS){
    // doLogin() is actively validating this exact sign-in and will route
    // to the right screen itself once it finishes — skip here so a
    // not-yet-approved login can never flash the dashboard before being
    // signed back out (see doLogin above).
    return;
  }
  try{
    const adminDoc = await db.collection(COL.admins).doc(user.uid).get();
    if(adminDoc.exists){
      CURRENT_ROLE = 'admin';
      CURRENT_PROFILE = adminDoc.data();
      STATE.screen = 'admin';
      renderScreen();
      return;
    }
    const studentDoc = await db.collection(COL.students).doc(user.uid).get();
    if(studentDoc.exists && studentDoc.data().active !== false){
      const data = studentDoc.data();
      // A resumed session (page load/reload, or the PWA waking back up,
      // not a fresh password login — doLogin already handled that case
      // above). Confirm this device still legitimately holds the active
      // session before letting it back into the dashboard, and restart
      // the activity heartbeat — a plain reload loses the old interval.
      const myDevice = getDeviceId();
      const knownSession = getLocalSessionId();
      try{
        const sid = await claimStudentSession(user.uid, myDevice, knownSession);
        CURRENT_SESSION_ID = sid;
        setLocalSessionId(sid);
        CURRENT_ROLE = 'student';
        CURRENT_PROFILE = data;
        STATE.screen = 'student';
        renderScreen();
        startSessionHeartbeat();
      }catch(sessionErr){
        if(sessionErr && sessionErr.code === 'device-locked'){
          CURRENT_SESSION_ID = null; setLocalSessionId(null);
          toast('Logged out — this account signed in on another device.');
          await auth.signOut();
        }else{
          console.error('[session] resume check failed, allowing session anyway:', sessionErr);
          CURRENT_ROLE = 'student';
          CURRENT_PROFILE = data;
          STATE.screen = 'student';
          renderScreen();
          startSessionHeartbeat();
        }
      }
      return;
    }
    // Neither admin nor active student — bounce back to login.
    await auth.signOut();
  }catch(e){
    console.error(e);
    await auth.signOut();
  }
});

/* ================================================================
   8) LIVE-LISTENER CLEANUP
   ----------------------------------------------------------------
   Every onSnapshot() started while building a screen is registered
   here, and cleared right before the next full re-render — so
   switching tabs never leaves old Firestore listeners running.
   ================================================================ */
STATE.unsubs = [];
function trackUnsub(fn){ STATE.unsubs.push(fn); }
function clearUnsubs(){ STATE.unsubs.forEach(u=>{ try{ u(); }catch(e){} }); STATE.unsubs = []; }

/* Shown on the Dashboard whenever the student has no active batch.
   Lists active batches matching the student's registered class (falling
   back to all active batches if no class was set, or none match), each
   with a "Request to join" action — this only ever creates a request;
   an admin still has to approve it before an enrollment is created. */
function renderAvailableBatches(box){
  const p = CURRENT_PROFILE;
  box.innerHTML = '<div class="spinner"></div>';
  Promise.all([
    db.collection(COL.batches).where('status','==','active').get(),
    db.collection(COL.batchJoinRequests).where('studentId','==',CURRENT_USER.uid).get()
  ]).then(([batchSnap, reqSnap])=>{
    let batches = []; batchSnap.forEach(d=> batches.push({id:d.id, ...d.data()}));
    const pendingBatchIds = new Set();
    reqSnap.forEach(d=>{ const r=d.data(); if(r.status==='pending') pendingBatchIds.add(r.batchId); });

    const studentClass = (p.class||'').trim();
    let shown = batches;
    let note = 'All available batches';
    if(studentClass){
      const matched = batches.filter(b=> (b.class||'').trim() === studentClass);
      if(matched.length){ shown = matched; note = 'Batches for Class ' + esc(studentClass); }
    }

    box.innerHTML = '';
    if(!shown.length){ return; } // nothing to show — stay quiet rather than an empty card
    const card = el(`<div class="card">
      <div class="card-title">📚 ${note}</div>
      <div id="availBatchList"></div>
    </div>`);
    box.appendChild(card);
    const list = $('#availBatchList', card);
    shown.forEach(b=>{
      const pending = pendingBatchIds.has(b.id);
      const row = el(`<div class="enroll-row">
        <div class="enroll-info"><div class="enroll-name">${esc(b.name)}</div>${b.description?`<div class="enroll-meta">${esc(b.description)}</div>`:''}</div>
        ${pending ? '<span class="badge badge-accent">⏳ Requested</span>' : '<button class="btn-sm btn-success">Request to join</button>'}
      </div>`);
      if(!pending){
        $('button', row).addEventListener('click', ()=> requestBatchJoin(b, box));
      }
      list.appendChild(row);
    });
  }).catch(err=>{ console.error(err); box.innerHTML=''; });
}

async function requestBatchJoin(batch, box){
  try{
    await db.collection(COL.batchJoinRequests).add({
      studentId: CURRENT_USER.uid, studentName: CURRENT_PROFILE.fullName||'',
      batchId: batch.id, batchName: batch.name,
      status:'pending', requestedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    toast('Request sent for ' + batch.name);
    renderAvailableBatches(box);
  }catch(e){
    console.error(e);
    toast('Could not send request — check your connection.');
  }
}

/* Pulls the file ID out of any common Google Drive share-link format:
   .../file/d/ID/view   or   ...?id=ID   or   .../open?id=ID */
function driveIdFromUrl(url){
  url = (url||'').trim();
  let m = url.match(/\/file\/d\/([A-Za-z0-9_-]+)/);
  if(m) return m[1];
  m = url.match(/[?&]id=([A-Za-z0-9_-]+)/);
  if(m) return m[1];
  return url; // maybe they already pasted just the raw ID
}

/* ================================================================
   10) TEST HTML GENERATOR
   ----------------------------------------------------------------
   Turns structured question data from the admin's manual builder
   into one self-contained HTML test file (with its own timer,
   MathJax, palette and submit logic). Saved as a string in
   Firestore and rendered for students via an iframe srcdoc.
   ================================================================ */
function buildTestHTML(meta, questions){
  const qData = JSON.stringify(questions);
  const correctMark = meta.correctMark ?? 4;
  const wrongMark = meta.wrongMark ?? -1;
  const durationSec = (meta.duration||0) * 60;
  return `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script>window.MathJax={tex:{inlineMath:[['$','$']],displayMath:[['$$','$$']]}};<\/script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" defer><\/script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0d1117;color:#e6edf3;padding:12px;font-size:14px}
.header{background:#161b22;border-radius:10px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
.title{font-weight:700;font-size:14px}
.timer{color:#ef4444;font-weight:700;font-family:monospace;font-size:16px}
.palette{display:flex;flex-wrap:wrap;gap:5px;padding:10px 12px;background:#161b22;border-radius:10px;margin-bottom:10px}
.pb{width:28px;height:28px;border-radius:6px;border:none;font-size:11px;font-weight:700;cursor:pointer;background:#1c2333;color:#8b949e}
.pb.done{background:rgba(34,197,94,.3);color:#4ade80}
.pb.cur{background:#7f77dd;color:#fff}
.q-card{background:#161b22;border-radius:10px;padding:14px;margin-bottom:10px}
.q-num{font-size:11px;color:#8b949e;margin-bottom:6px}
.q-text{font-size:14px;margin-bottom:10px;line-height:1.6}
.q-text img{max-width:100%;border-radius:6px;margin:6px 0}
.opt{display:flex;gap:8px;align-items:center;padding:9px 10px;border:1px solid #30363d;border-radius:8px;margin-bottom:6px;cursor:pointer}
.opt.sel{border-color:#7f77dd;background:rgba(127,119,221,.15)}
.key{width:20px;height:20px;border-radius:50%;background:#0d1117;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.navrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.nb{padding:10px;border-radius:8px;border:none;font-weight:700;font-size:13px;cursor:pointer;background:#1c2333;color:#e6edf3}
.submit{width:100%;padding:12px;background:#ef4444;color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer}
.result{background:#161b22;border-radius:10px;padding:16px;text-align:center}
.score{font-size:32px;font-weight:700;color:#7f77dd;margin:8px 0}
.sol{background:#161b22;border-radius:10px;padding:12px;margin-top:10px}
.sol.correct{border-left:3px solid #22c55e}
.sol.wrong{border-left:3px solid #ef4444}
.sol.skip{border-left:3px solid #6b7280}
</style></head>
<body oncontextmenu="return false">
<div class="header"><div class="title">${meta.title?String(meta.title).replace(/</g,'&lt;'):'Test'}</div><div class="timer" id="tm">--:--</div></div>
<div class="palette" id="palette"></div>
<div id="quizArea"></div>
<div class="navrow"><button class="nb" id="prevB">← Prev</button><button class="nb" id="nextB">Next →</button></div>
<button class="submit" id="submitB">Submit Test</button>
<div id="resultArea" style="display:none"></div>
<script>
const QUESTIONS = ${qData};
const CORRECT_MARK = ${correctMark}, WRONG_MARK = ${wrongMark};
let cur = 0;
let answers = new Array(QUESTIONS.length).fill(-1);
let secondsLeft = ${durationSec};
let submitted = false;
let timerHandle = null;

function renderQ(){
  const q = QUESTIONS[cur];
  const keys=['A','B','C','D'];
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card"><div class="q-num">Question '+(cur+1)+' of '+QUESTIONS.length+'</div>'+
    '<div class="q-text">'+q.text+'</div>'+
    q.opts.map((o,i)=>'<div class="opt '+(answers[cur]===i?'sel':'')+'" onclick="selectOpt('+i+')"><div class="key">'+keys[i]+'</div><div>'+o+'</div></div>').join('')+
    '</div>';
  if(window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([document.getElementById('quizArea')]);
  renderPalette();
}
function selectOpt(i){ answers[cur]=i; renderQ(); }
function renderPalette(){
  document.getElementById('palette').innerHTML = QUESTIONS.map(function(_,i){
    var cls = i===cur ? 'cur' : (answers[i]!==-1 ? 'done' : '');
    return '<button class="pb '+cls+'" onclick="jump('+i+')">'+(i+1)+'</button>';
  }).join('');
}
function jump(i){ cur=i; renderQ(); }
document.getElementById('prevB').onclick=function(){ if(cur>0){cur--;renderQ();} };
document.getElementById('nextB').onclick=function(){ if(cur<QUESTIONS.length-1){cur++;renderQ();} };
document.getElementById('submitB').onclick=submitTest;

function submitTest(){
  if(submitted) return; submitted = true;
  if(timerHandle) clearInterval(timerHandle);
  var correct=0, wrong=0, skipped=0;
  QUESTIONS.forEach(function(q,i){
    if(answers[i]===-1) skipped++;
    else if(answers[i]===q.correct) correct++;
    else wrong++;
  });
  var score = correct*CORRECT_MARK + wrong*WRONG_MARK;
  var total = QUESTIONS.length*CORRECT_MARK;
  document.getElementById('quizArea').style.display='none';
  document.querySelector('.palette').style.display='none';
  document.querySelector('.navrow').style.display='none';
  document.getElementById('submitB').style.display='none';
  var keys=['A','B','C','D'];
  var solHtml = QUESTIONS.map(function(q,i){
    var a = answers[i];
    var cls = a===-1?'skip':(a===q.correct?'correct':'wrong');
    var statusText = a===-1?'Skipped':(a===q.correct?('Correct — '+keys[a]):('Your answer: '+keys[a]+' · Correct: '+keys[q.correct]));
    return '<div class="sol '+cls+'"><div class="q-text">'+(i+1)+'. '+q.text+'</div><div style="font-size:12px;margin:6px 0;font-weight:700">'+statusText+'</div>'+(q.explain?'<div style="font-size:12px;color:#8b949e">'+q.explain+'</div>':'')+'</div>';
  }).join('');
  document.getElementById('resultArea').style.display='block';
  document.getElementById('resultArea').innerHTML =
    '<div class="result"><div style="font-size:13px;color:#8b949e">Your score</div><div class="score">'+score+'</div><div style="font-size:12px;color:#8b949e">out of '+total+' · '+correct+' correct, '+wrong+' wrong, '+skipped+' skipped</div></div>'+solHtml;
  if(window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([document.getElementById('resultArea')]);
  window.parent.postMessage({ type:'submit_test', score:score, total:total }, '*');
}

if(secondsLeft > 0){
  timerHandle = setInterval(function(){
    secondsLeft--;
    var m = Math.floor(secondsLeft/60).toString().padStart(2,'0');
    var s = (secondsLeft%60).toString().padStart(2,'0');
    var t = document.getElementById('tm'); if(t) t.textContent = m+':'+s;
    if(secondsLeft<=0){ submitTest(); }
  }, 1000);
} else {
  document.getElementById('tm').textContent = 'No limit';
}
renderQ();
<\/script>
</body></html>`;
}

/* One-time, safely re-runnable migration: for every distinct free-text
   `batch` value already on student profiles, create a matching batch
   document (if one doesn't already exist) and enroll that student into
   it with lifetime expiry, so nobody currently active loses access. */
async function runBatchMigration(){
  toast('Running migration…');
  try{
    const studentsSnap = await db.collection(COL.students).get();
    const students = []; studentsSnap.forEach(d=> students.push({id:d.id, ...d.data()}));
    const batchesSnap = await db.collection(COL.batches).get();
    const existingByName = {};
    batchesSnap.forEach(d=>{ existingByName[d.data().name] = d.id; });

    let created = 0, enrolled = 0;
    for(const s of students){
      const name = (s.batch||'').trim();
      if(!name) continue;
      let batchId = existingByName[name];
      if(!batchId){
        const ref = await db.collection(COL.batches).add({
          name, description:'', status:'active', defaultExpiryType:'lifetime', defaultExpiresAt:null,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        batchId = ref.id;
        existingByName[name] = batchId;
        created++;
      }
      const already = await db.collection(COL.enrollments).where('studentId','==',s.id).get();
      let hasIt = false;
      already.forEach(d=>{ if(d.data().batchId===batchId) hasIt = true; });
      if(hasIt) continue;
      await db.collection(COL.enrollments).add({
        studentId: s.id, batchId, batchName: name,
        status:'active', expiryType:'lifetime', expiresAt:null,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      enrolled++;
    }
    toast(`Migration done — ${created} batch(es) created, ${enrolled} student(s) enrolled.`);
  }catch(e){
    console.error(e);
    toast('Migration failed — check console.');
  }
}

function ytIdFromUrl(url){
  const m = (url||'').match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/)([A-Za-z0-9_-]{6,})/);
  return m ? m[1] : (url||'').trim();
}

      </div>

    </div>
    <button class="btn btn-primary" id="publishManual">🚀 Generate &amp; publish test</button>
  </div>`));

  function refreshQList(){
    $('#qCountLbl',body).textContent = '('+questions.length+' added)';
    const box = $('#mQList',body); box.innerHTML='';
    questions.forEach((q,i)=>{
      const row = el(`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border-soft);font-size:12px">
        <span>Q${i+1}. ${esc(q.text.slice(0,40))}${q.text.length>40?'…':''}</span><button class="btn-sm btn-danger">🗑</button></div>`);
      $('button',row).addEventListener('click', ()=>{ questions.splice(i,1); refreshQList(); });
      box.appendChild(row);
    });
  }
  $('#addQ',body).addEventListener('click', ()=>{
    const text = $('#mQText',body).value.trim();
    const opts = [$('#mOptA',body).value.trim(), $('#mOptB',body).value.trim(), $('#mOptC',body).value.trim(), $('#mOptD',body).value.trim()];
    if(!text || opts.some(o=>!o)){ toast('Fill question text and all 4 options'); return; }
    questions.push({ text, opts, correct: parseInt($('#mCorrectOpt',body).value), explain: $('#mExplain',body).value.trim() });
    $('#mQText',body).value=''; $('#mOptA',body).value=''; $('#mOptB',body).value=''; $('#mOptC',body).value=''; $('#mOptD',body).value=''; $('#mExplain',body).value='';
    refreshQList(); toast('Question added');
  });
  $('#publishManual',body).addEventListener('click', async ()=>{
    const title = $('#mTitle',body).value.trim();
    if(!title){ toast('Enter a test title'); return; }
    if(!questions.length){ toast('Add at least one question'); return; }
    const meta = { title, correctMark: parseFloat($('#mCorrect',body).value)||0, wrongMark: parseFloat($('#mWrong',body).value)||0, duration: parseInt($('#mDuration',body).value)||0 };
    const html = buildTestHTML(meta, questions);
    await db.collection(COL.tests).add({
      title, subject: $('#mSubject',body).value.trim(), batch: $('#mBatch',body).value.trim(),
      type: $('#mType',body).value, access: $('#mAccess',body).value,
      duration: meta.duration, questionCount: questions.length, htmlContent: html, source: 'manual',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    toast('✅ Test published to Firebase!');
    questions = []; refreshQList(); $('#mTitle',body).value='';
  });
}

      $('button',card).addEventListener('click', async ()=>{ await db.collection(COL.notes).doc(n.id).delete(); toast('Deleted'); });
      listBox.appendChild(card);
    });
  });
  trackUnsub(unsub);
}

/* ================================================================
   12) PWA — service worker registration + install button
   ================================================================ */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(err=>console.error('SW register failed:', err));
  });
}

(function setupInstallButton(){
  const btn = document.getElementById('pwaInstallBtn');
  if(!btn) return;

  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if(isStandalone) return; // already installed / already running as the app — nothing to offer

  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  let deferredPrompt = null;

  window.addEventListener('beforeinstallprompt', (e)=>{
    e.preventDefault();
    deferredPrompt = e;
    btn.style.display = 'block';
  });

  window.addEventListener('appinstalled', ()=>{
    btn.style.display = 'none';
    deferredPrompt = null;
  });

  if(isIOS){
    // iOS Safari has no beforeinstallprompt API — show the button and
    // explain the manual Share-sheet steps instead.
    btn.style.display = 'block';
  }

  btn.addEventListener('click', async ()=>{
    if(deferredPrompt){
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      btn.style.display = 'none';
    } else if(isIOS){
      toast('Tap the Share icon, then "Add to Home Screen"');
    } else {
      toast('Use your browser menu → "Install app" or "Add to Home screen"');
    }
  });
})();
</script>
