<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Atomic Minds</title>
<meta name="description" content="Atomic Minds — Stop Memorizing. Start realizing.">
<meta name="theme-color" content="#12081c">
<meta name="color-scheme" content="dark">

<!-- PWA: installable on Android/desktop Chrome via manifest, and on iOS
     via the apple-* meta tags below (iOS ignores manifest.json for
     install purposes and needs its own tags). -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atomic Minds">
<meta name="mobile-web-app-capable" content="yes">

<!-- ============================================================
     MATHJAX — renders LaTeX like $F=ma$ or $$\int_0^1 x\,dx$$
     anywhere question / note / solution text is shown.
     ============================================================ -->
<script>
  window.MathJax = {
    tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
    svg: { fontCache: 'global' },
    options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" defer></script>

<!-- ============================================================
     FIREBASE — compat SDK (simplest to use from one plain HTML
     file with no build step). Auth + Firestore only — Storage is
     intentionally not used (see README: Google now requires a
     paid Blaze billing account for Storage; notes/assignments
     use Google Drive links instead, completely free).
     ============================================================ -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<style>
/* ============================================================
   ATOMIC MINDS THEME
   Deep purple / near-black, matching the atom+brain brand mark.
   System font stack on purpose — no webfont download, since many
   students are on slow mobile data (seen in your screenshots).
   ============================================================ */
:root{
  color-scheme: dark;
  --bg:#12081c;
  --surface:#1c1030;
  --surface-2:#241539;
  --border:#3a2a5c;
  --border-soft:#2a1d47;
  --accent:#9b8ce8;
  --accent-bright:#7f77dd;
  --text:#f3f0fa;
  --text-muted:#a89ae0;
  --text-dim:#7a6da8;
  --success:#4ade80; --success-bg:rgba(34,197,94,.15); --success-brd:rgba(34,197,94,.35);
  --danger:#f87171;  --danger-bg:rgba(239,68,68,.15);  --danger-brd:rgba(239,68,68,.35);
  --warning:#fbbf24; --warning-bg:rgba(245,158,11,.15); --warning-brd:rgba(245,158,11,.35);
  --radius:10px;
  --radius-lg:16px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font);
  -webkit-tap-highlight-color:transparent;}
body{min-height:100vh;font-size:16px;line-height:1.5}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;appearance:none;-webkit-appearance:none;background-image:none;box-shadow:none;line-height:1.2}
svg{vertical-align:middle;flex-shrink:0}
a{color:var(--accent)}
img{max-width:100%}
::selection{background:var(--accent-bright);color:#fff}

#app{min-height:100vh;display:flex;flex-direction:column}

/* -------- shared building blocks -------- */
.container{max-width:480px;margin:0 auto;width:100%;padding:0 16px}
.card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px;color:var(--text)}
.card-title svg{width:18px;height:18px;flex-shrink:0;color:var(--accent)}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--text-muted);margin-bottom:5px;font-weight:500}
.field input,.field select,.field textarea{
  width:100%;padding:10px 12px;border-radius:var(--radius);
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:80px;font-family:inherit}
.field .hint{font-size:12px;color:var(--text-dim);margin-top:4px}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;
  padding:11px;border-radius:var(--radius);border:1px solid transparent;font-size:15px;font-weight:600;}
.btn-sm{width:auto;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:1px solid transparent;padding:6px 12px;font-size:13px;font-weight:500;border-radius:8px}
.btn-primary{background:var(--accent-bright);color:#150a1f}
.btn-primary:hover{opacity:.92}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:var(--surface-2);color:var(--text-muted);border-color:var(--border)}
.btn-danger{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-brd)}
.btn-success{background:var(--success-bg);color:var(--success);border-color:var(--success-brd)}

.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.2px}
.badge-free{background:var(--success-bg);color:var(--success)}
.badge-paid{background:var(--warning-bg);color:var(--warning)}
.badge-live{background:var(--danger-bg);color:var(--danger)}
.badge-muted{background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border)}
.badge-accent{background:rgba(155,140,232,.15);color:var(--accent)}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--text);color:var(--bg);padding:9px 18px;border-radius:24px;font-size:14px;font-weight:500;
  opacity:0;pointer-events:none;transition:all .25s;z-index:999;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.empty-state{text-align:center;padding:40px 20px;color:var(--text-dim)}
.empty-state .icon{font-size:30px;margin-bottom:8px;opacity:.6}
.spinner{width:22px;height:22px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;
  animation:spin .7s linear infinite;margin:24px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* -------- logo -------- */
.logo-mark{display:block;margin:0 auto}
.brand-row{display:flex;flex-direction:column;align-items:center;text-align:center}
.brand-name{font-size:22px;font-weight:600;color:#fff;letter-spacing:.2px;margin-top:8px}
.brand-tagline{font-size:13px;color:var(--text-muted);margin-top:2px}

/* -------- auth screens -------- */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.auth-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border-soft);
  border-radius:20px;padding:28px 22px}
.auth-tabs{display:flex;gap:4px;padding:4px;background:var(--bg);border-radius:12px;margin:22px 0 18px}
.auth-tab{flex:1;padding:9px 4px;border:none;background:none;border-radius:9px;font-size:14px;font-weight:600;
  color:var(--text-dim);transition:all .15s}
.auth-tab.active{background:var(--surface-2);color:#fff;border:1px solid var(--border)}
.auth-error{background:var(--danger-bg);border:1px solid var(--danger-brd);color:var(--danger);
  font-size:13px;padding:9px 12px;border-radius:8px;margin-bottom:12px;display:none}
.auth-error.show{display:block}
.auth-link{text-align:center;font-size:13px;color:var(--text-dim);margin-top:14px}
.optional-toggle{text-align:center;font-size:13px;color:var(--accent);margin:6px 0 4px;cursor:pointer;user-select:none}
.optional-fields{display:none;border-top:1px solid var(--border-soft);padding-top:12px;margin-top:4px}
.optional-fields.show{display:block}
.admin-link{position:fixed;bottom:10px;left:0;right:0;text-align:center;font-size:12px;color:var(--text-dim);
  opacity:.6}

/* -------- student shell (bottom tabs) -------- */
.app-shell{display:flex;flex-direction:column;min-height:100vh}
.top-header{position:sticky;top:0;z-index:20;background:rgba(18,8,28,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border-soft);padding:12px 16px;display:flex;align-items:center;gap:10px}
.top-header .logo-mark{margin:0}
.top-header .th-name{font-size:16px;font-weight:600;flex:1}
.content-area{flex:1;padding:16px;padding-bottom:90px;max-width:480px;margin:0 auto;width:100%}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(28,16,48,.97);backdrop-filter:blur(10px);
  border-top:1px solid var(--border-soft);display:flex;z-index:30;max-width:480px;margin:0 auto}
.bottom-nav button{flex:1;background:none;border:none;padding:9px 2px 8px;display:flex;flex-direction:column;
  align-items:center;gap:3px;color:var(--text-dim);font-size:11px;font-weight:500}
.bottom-nav button.active{color:var(--accent)}
.bottom-nav .bn-icon{display:flex;align-items:center;justify-content:center}
.bottom-nav .bn-icon svg{width:20px;height:20px}

/* -------- admin shell (top tabs) -------- */
.admin-shell{display:flex;flex-direction:column;min-height:100vh}
.admin-header{position:sticky;top:0;z-index:20;background:rgba(18,8,28,.96);border-bottom:1px solid var(--border-soft);
  padding:12px 16px}
.admin-header-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.admin-tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.admin-tab{padding:7px 13px;border:1px solid var(--border);background:var(--surface-2);border-radius:20px;
  font-size:13px;font-weight:600;color:var(--text-dim);white-space:nowrap}
.admin-tab.active{background:rgba(155,140,232,.18);color:var(--accent);border-color:var(--accent)}
.admin-content{flex:1;padding:16px;max-width:560px;margin:0 auto;width:100%}

/* -------- rich content (MathJax / images / svg) -------- */
.rich-content{font-size:15px;line-height:1.7;color:var(--text)}
.rich-content img{border-radius:8px;margin:8px 0;display:block}
.rich-content svg{max-width:100%}
mjx-container{color:var(--text) !important}

/* -------- item lists reused across tabs -------- */
.item-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);
  padding:13px;margin-bottom:9px}
.item-top{display:flex;gap:10px;align-items:flex-start}
.item-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;background:var(--surface-2)}
.item-info{flex:1;min-width:0}
.item-title{font-size:15px;font-weight:600}
.item-meta{font-size:12.5px;color:var(--text-dim);margin-top:2px;line-height:1.6}
.item-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-title{font-size:15.5px;font-weight:700}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11.5px;color:var(--text-dim);margin-bottom:4px}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.cal-day{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  border-radius:10px;font-size:13.5px;background:var(--surface);border:1px solid var(--border-soft);cursor:pointer}
.cal-day.empty{background:none;border:none;cursor:default}
.cal-day.cal-today{border-color:var(--accent)}
.cal-day.cal-selected{background:var(--accent);color:#fff;border-color:var(--accent)}
.cal-dot{position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--accent-bright)}
.cal-day.cal-selected .cal-dot{background:#fff}
.item-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

/* -------- modal / overlay -------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:flex;align-items:flex-end;
  justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:all}
.sheet{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:92vh;
  overflow-y:auto;padding:16px 16px 28px;transform:translateY(40px);transition:transform .25s;
  border:1px solid var(--border-soft);border-bottom:none}
.overlay.open .sheet{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px}
.sheet-close{position:sticky;top:0;float:right;background:var(--surface-2);border:1px solid var(--border);
  color:var(--text-muted);border-radius:8px;padding:6px;font-size:13px;display:flex;align-items:center;justify-content:center}
.sheet-close svg{width:15px;height:15px}

.tab-filter{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px}
.tab-filter button{padding:6px 13px;border:1px solid var(--border);background:none;border-radius:20px;
  font-size:13px;color:var(--text-dim);white-space:nowrap}
.tab-filter button.active{background:rgba(155,140,232,.15);color:var(--accent);border-color:var(--accent)}

.search-input-wrap{position:relative;margin-bottom:10px}
.search-input-wrap input{padding:10px 12px 10px 34px;width:100%;border-radius:var(--radius);
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);outline:none}
.search-input-wrap input:focus{border-color:var(--accent)}
.search-input-wrap input::placeholder{color:var(--text-dim)}
.search-input-wrap .si{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-dim);display:flex}
.search-input-wrap .si svg{width:15px;height:15px}

/* -------- hamburger + drawer -------- */
.hamburger-btn{background:none;border:none;color:var(--text);padding:9px;min-width:40px;min-height:40px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:8px}
.hamburger-btn:active{background:var(--surface-2)}

/* -------- reusable "back to dashboard" control (section 3) -------- */
.back-btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);
  border:1px solid var(--border);color:var(--text-muted);font-size:13px;font-weight:600;
  padding:8px 14px 8px 10px;border-radius:20px;margin-bottom:14px}
.back-btn:active{border-color:var(--accent);color:var(--text)}
.back-btn svg{width:16px;height:16px;flex-shrink:0}
/* Phase 1.1 — active test mode + persistent red warning */
.overlay.tms-active{z-index:990}
.tms-warn{position:absolute;inset:0;z-index:2000;background:rgba(70,0,0,.9);display:flex;align-items:center;justify-content:center;padding:20px}
.tms-warn-card{background:#b91c1c;border:3px solid #fecaca;border-radius:16px;padding:22px 18px 18px;max-width:360px;width:100%;text-align:center;color:#fff;
  box-shadow:0 0 0 6px rgba(239,68,68,.35),0 14px 44px rgba(0,0,0,.65)}
.tms-warn-title{font-size:19px;font-weight:800;line-height:1.3;margin-bottom:12px;letter-spacing:.2px}
.tms-warn-card p{font-size:15px;line-height:1.5;margin:0 0 8px}
.tms-warn-ok{margin-top:12px;width:100%;padding:14px;border:none;border-radius:10px;background:#fff;color:#991b1b;font-size:16px;font-weight:800;cursor:pointer}
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:150;opacity:0;pointer-events:none;
  transition:opacity .2s}
.drawer-overlay.open{opacity:1;pointer-events:all}
.drawer-panel{position:absolute;top:0;left:0;bottom:0;width:78%;max-width:300px;background:var(--surface);
  border-right:1px solid var(--border-soft);transform:translateX(-100%);transition:transform .25s;
  display:flex;flex-direction:column;padding:18px 14px}
.drawer-overlay.open .drawer-panel{transform:translateX(0)}
.drawer-brand{display:flex;align-items:center;gap:10px;padding:6px 6px 16px;border-bottom:1px solid var(--border-soft);margin-bottom:10px}
.drawer-brand .bn{font-size:16px;font-weight:700}
.drawer-item{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:10px;border:none;
  background:none;color:var(--text-muted);font-size:15px;font-weight:500;text-align:left;width:100%}
.drawer-item.active{background:rgba(155,140,232,.15);color:var(--accent)}
.drawer-item .di-icon{width:22px;text-align:center;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}
.drawer-item .di-icon svg{width:18px;height:18px}
.drawer-item .di-badge{margin-left:auto;background:var(--danger-bg);color:var(--danger);font-size:11px;
  font-weight:700;padding:2px 7px;border-radius:20px}
.drawer-divider{height:1px;background:var(--border-soft);margin:8px 4px}
.drawer-footer{margin-top:auto;padding-top:10px}

/* -------- admin home grid dashboard -------- */
.home-welcome{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);
  padding:18px;margin-bottom:16px}
.home-welcome .hw-title{font-size:19px;font-weight:700}
.home-welcome .hw-sub{font-size:13px;color:var(--text-muted);margin-top:3px}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.home-tile{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);
  padding:20px 14px;display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;
  position:relative;transition:border-color .15s}
.home-tile:active{border-color:var(--accent)}
.home-tile .ht-icon{width:44px;height:44px;border-radius:12px;background:rgba(155,140,232,.14);
  color:var(--accent);display:flex;align-items:center;justify-content:center}
.home-tile .ht-icon svg{width:22px;height:22px}
.home-tile .ht-label{font-size:14px;font-weight:600;color:var(--text)}
.home-tile .ht-badge{position:absolute;top:10px;right:10px;background:var(--danger-bg);color:var(--danger);
  font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px}

/* -------- upgrade request UI -------- */
.upgrade-banner{background:linear-gradient(135deg,rgba(155,140,232,.18),rgba(127,119,221,.08));
  border:1px solid var(--accent);border-radius:var(--radius-lg);padding:14px;margin-bottom:12px;text-align:center}
.upgrade-pending{background:var(--warning-bg);border:1px solid var(--warning-brd);color:var(--warning);
  border-radius:var(--radius);padding:10px 12px;font-size:13.5px;text-align:center;margin-bottom:12px}

/* -------- batches & enrollments -------- */
.batch-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);
  padding:14px;margin-bottom:9px;cursor:pointer}
.batch-card:active{border-color:var(--accent)}
.batch-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.batch-name{font-size:15.5px;font-weight:700}
.batch-desc{font-size:13px;color:var(--text-dim);margin-top:2px}
.batch-meta-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.expiry-toggle{display:flex;gap:6px;margin-bottom:10px}
.expiry-toggle button{flex:1;padding:8px;border:1px solid var(--border);background:var(--surface-2);
  border-radius:var(--radius);font-size:13px;font-weight:600;color:var(--text-dim)}
.expiry-toggle button.active{background:rgba(155,140,232,.18);color:var(--accent);border-color:var(--accent)}
.enroll-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-soft)}
.enroll-row:last-child{border:none}
.enroll-info{flex:1;min-width:0}
.enroll-name{font-size:14px;font-weight:600}
.enroll-meta{font-size:12.5px;color:var(--text-dim);margin-top:2px}
.badge-suspended{background:var(--warning-bg);color:var(--warning)}
.badge-expired{background:var(--danger-bg);color:var(--danger)}

/* -------- dashboard promotional banner carousel -------- */
.banner-carousel-wrap{margin:0 0 12px}
.banner-track{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;padding:2px 3px 6px;scrollbar-width:none}
.banner-track::-webkit-scrollbar{display:none}
.banner-slide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:16/9;border-radius:16px;
  overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.35);background:var(--surface-2)}
.banner-slide img{width:100%;height:100%;object-fit:cover;display:block}
.banner-dots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.banner-dot{width:6px;height:6px;border-radius:50%;background:var(--border);transition:background .2s,width .2s}
.banner-dot.active{background:var(--accent);width:16px;border-radius:4px}

@media(min-width:481px){
  .content-area,.bottom-nav{max-width:480px}
}
</style>
</head>
<body>

<div id="app">
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center">
    <div class="spinner"></div>
  </div>
</div>

/* Shared slide-out nav drawer for both the student and admin shells.
   items: [{ key, icon, label, badge?, onSelect }]  activeKey: current key */
function openDrawer(title, items, activeKey){
  const overlay = el(`<div class="drawer-overlay">
    <div class="drawer-panel">
      <div class="drawer-brand">${buildLogo(28)}<span class="bn">${esc(title)}</span></div>
      <div id="drawerItems"></div>
    </div>
  </div>`);
  const list = $('#drawerItems', overlay);
  items.forEach(it=>{
    if(it.divider){ list.appendChild(el(`<div class="drawer-divider"></div>`)); return; }
    const row = el(`<button class="drawer-item ${it.key===activeKey?'active':''}">
      <span class="di-icon">${it.icon}</span><span>${esc(it.label)}</span>
      ${it.badge ? `<span class="di-badge">${esc(it.badge)}</span>` : ''}
    </button>`);
    row.addEventListener('click', ()=>{ closeDrawer(); it.onSelect && it.onSelect(); });
    list.appendChild(row);
  });
  document.body.appendChild(overlay);
  requestAnimationFrame(()=> overlay.classList.add('open'));
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeDrawer(); });
  window.__amDrawerOverlay = overlay;
}
function closeDrawer(){
  const o = window.__amDrawerOverlay;
  if(!o) return;
  o.classList.remove('open');
  setTimeout(()=> o.remove(), 200);
  window.__amDrawerOverlay = null;
}

/* Renders text that may contain LaTeX ($...$), raw <img>, or raw <svg>.
   Used for every question, solution, note description, admin note, etc.
   A light allow-list strips <script> tags but keeps img/svg/formatting
   so admin can paste chemistry structure images or hand-drawn SVGs. */
function renderRich(container, raw){
  if(!raw){ container.innerHTML=''; return; }
  const cleaned = String(raw).replace(/<script[\s\S]*?<\/script>/gi,'');
  container.innerHTML = cleaned;
  if(window.MathJax && window.MathJax.typesetPromise){
    window.MathJax.typesetPromise([container]).catch(()=>{});
  }
}

/* A random ID generated once per browser/device and stored in localStorage,
   used to identify "this browser" to the active-session system below (see
   AUTH ACTIONS). It is NOT itself a login lock — it's just this device's
   fingerprint; students/{uid}.activeDeviceId is the temporary lock, and it
   is released on logout or after a period of inactivity, not tied
   permanently to any one device.
   Wrapped defensively: some browser contexts (strict private-browsing
   modes, certain in-app browsers) can block localStorage entirely — if
   that happens we fall back to a session-only id instead of crashing. */
function getDeviceId(){
  try{
    let id = localStorage.getItem('am_device_id');
    if(!id){
      id = 'dev_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('am_device_id', id);
    }
    return id;
  }catch(e){
    console.error('[device-lock] localStorage unavailable, using a session-only id:', e);
    if(!window.__amFallbackDeviceId){
      window.__amFallbackDeviceId = 'dev_fallback_' + Math.random().toString(36).slice(2);
    }
    return window.__amFallbackDeviceId;
  }
}

function renderScreen(){
  if(typeof clearUnsubs === 'function') clearUnsubs();
  const app = $('#app');
  app.innerHTML = '';
  try{
    if(STATE.screen === 'loading'){
      app.appendChild(el(`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center"><div class="spinner"></div></div>`));
    } else if(STATE.screen === 'auth'){
      app.appendChild(renderAuthScreen());
    } else if(STATE.screen === 'adminLogin'){
      app.appendChild(renderAdminLoginScreen());
    } else if(STATE.screen === 'student'){
      app.appendChild(renderStudentShell());
      tmsAfterLogin();   // Phase 1.2 — only a genuine page reload of an active test goes straight back into it
    } else if(STATE.screen === 'admin'){
      app.appendChild(renderAdminShell());
    }
  }catch(renderErr){
    console.error('Render failed:', renderErr);
    app.innerHTML = '';
    app.appendChild(el(`
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center">
        <div>
          <div style="font-size:15px;font-weight:700;margin-bottom:8px">Something went wrong on this screen</div>
          <div style="font-size:12px;color:var(--text-muted);max-width:320px;margin:0 auto">${esc(renderErr && renderErr.message ? renderErr.message : 'Unknown error')}</div>
          <button class="btn btn-primary" style="margin-top:16px;width:auto;padding:10px 20px" id="recoverReloadBtn">↻ Reload app</button>
        </div>
      </div>
    `));
    const rb = $('#recoverReloadBtn', app);
    if(rb) rb.addEventListener('click', ()=> location.reload());

}

/* ================================================================
   5) AUTH SCREENS
   ================================================================ */
function renderAuthScreen(){
  const wrap = el(`<div class="auth-wrap"><div class="auth-card"></div></div>`);
  const card = $('.auth-card', wrap);

  card.appendChild(el(`
    <div class="brand-row">
      ${buildLogo(64)}
      <div class="brand-name">${BRAND.name}</div>
      <div class="brand-tagline">${BRAND.tagline}</div>
    </div>
  `));

  const tabs = el(`
    <div class="auth-tabs">
      <button class="auth-tab ${STATE.authMode==='login'?'active':''}" data-mode="login">Log in</button>
      <button class="auth-tab ${STATE.authMode==='register'?'active':''}" data-mode="register">Register</button>
    </div>
  `);
  tabs.addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    STATE.authMode = b.dataset.mode;
    renderScreen();
  });
  card.appendChild(tabs);

  if(STATE.justRegistered && STATE.authMode === 'login'){
    card.appendChild(el(`<div style="background:var(--success-bg);border:1px solid var(--success-brd);color:var(--success);font-size:12.5px;padding:10px 12px;border-radius:8px;margin-bottom:12px">✅ Registration successful! Please log in below.</div>`));
    STATE.justRegistered = false;
  }

  const errBox = el(`<div class="auth-error"></div>`);
  card.appendChild(errBox);
  if(STATE.authError && STATE.authError.screen === 'auth' && STATE.authMode === 'login'){
    errBox.innerHTML = `<strong>${esc(STATE.authError.title)}</strong><br>${esc(STATE.authError.body)}`;
    errBox.classList.add('show');
  }
  if(STATE.authNotice && STATE.authNotice.screen === 'auth' && STATE.authMode === 'login'){
    card.appendChild(el(`<div style="background:var(--success-bg);border:1px solid var(--success-brd);color:var(--success);font-size:12.5px;padding:10px 12px;border-radius:8px;margin-bottom:12px">✅ <strong>${esc(STATE.authNotice.title)}</strong><br>${esc(STATE.authNotice.body)}</div>`));
    STATE.authNotice = null;
  }

  if(STATE.authMode === 'login'){
    const form = el(`
      <form id="loginForm">
        <div class="field"><label>Email</label><input type="email" id="liEmail" autocomplete="username" required placeholder="you@example.com"></div>
        <div class="field"><label>Password</label><input type="password" id="liPass" autocomplete="current-password" required placeholder="••••••••"></div>
        <button class="btn btn-primary" type="submit" id="liBtn">Log in</button>
      </form>
    `);
    form.addEventListener('submit', async e=>{
      e.preventDefault();
      STATE.authError = null;
      STATE.authNotice = null;
      errBox.classList.remove('show');
      const btn = $('#liBtn', form); btn.disabled = true; btn.textContent = 'Logging in…';
      try{
        await doLogin($('#liEmail',form).value.trim(), $('#liPass',form).value);
      }catch(err){
        const d = authErrorDisplay(err);
        STATE.authError = { screen:'auth', title:d.title, body:d.body };
        // Re-render explicitly rather than trusting the direct errBox update
        // below: a rejected login that also had to sign out (deactivated /
        // device-locked / not-found) triggers the auth-state listener's own
        // re-render too, and whichever of the two runs last would otherwise
        // win. STATE.authError is sticky, so however many renders happen,
        // the message stays visible until the next attempt.
        renderScreen();
        return;
      }
      btn.disabled = false; btn.textContent = 'Log in';
    });
    card.appendChild(form);

    const forgotLink = el(`<div class="auth-link" id="forgotPwLink" style="cursor:pointer">Forgot password?</div>`);
    let resetInFlight = false;
    forgotLink.addEventListener('click', async ()=>{
      if(resetInFlight) return;
      STATE.authError = null;
      STATE.authNotice = null;
      const email = $('#liEmail', form).value.trim();

function friendlyAuthError(err){
  const code = err && err.code || '';
  const map = {
    'auth/email-already-in-use':'This email is already registered — try logging in instead.',
    'auth/invalid-email':'Enter a valid email address.',
    'auth/weak-password':'Password must be at least 6 characters.',
    'auth/user-not-found':'No account found with this email.',
    'auth/wrong-password':'Incorrect password.',
    'auth/invalid-credential':'Incorrect email or password.',
    'auth/too-many-requests':'Too many attempts. Please wait a bit and try again.',
    'permission-denied':'Your account doesn\u2019t have permission for this yet \u2014 if you just set this up, make sure firestore.rules has been published in the Firebase console.'
  };
  return map[code] || (err && err.message) || 'Something went wrong. Please try again.';
}

/* Title+body version used by the login forms (student + admin), so a
   failure reads as a clear two-line message ("Login failed" / "Incorrect
   email or password.") inside the app's own error box — never a bare
   browser alert(), and never something a Chrome password-manager popup
   can be mistaken for. Our own hand-thrown errors (deactivated, device
   locked, account not found, etc.) already carry a ready-to-show
   err.title; anything else is matched by Firebase's auth/* error code. */
function authErrorDisplay(err){
  if(err && err.title){
    return { title: err.title, body: (err.message || '') };
  }
  const code = err && err.code || '';
  const map = {
    'auth/wrong-password':         { title:'Login failed', body:'Incorrect email or password.' },
    'auth/invalid-credential':     { title:'Login failed', body:'Incorrect email or password.' },
    'auth/user-not-found':         { title:'Account not found', body:'No account found with this email.' },
    'auth/invalid-email':          { title:'Login failed', body:'Enter a valid email address.' },
    'auth/user-disabled':          { title:'Account deactivated', body:'Your account has been deactivated. Please contact your teacher.' },
    'auth/too-many-requests':      { title:'Too many attempts', body:'Please wait a bit and try again.' },
    'auth/network-request-failed': { title:'Login temporarily unavailable', body:'Please check your internet connection and try again.' },
    'permission-denied':           { title:'Permission error', body:'Your account doesn\u2019t have permission for this yet \u2014 if you just set this up, make sure firestore.rules has been published in the Firebase console.' }
  };
  if(map[code]) return map[code];
  return { title:'Login failed', body:(err && err.message) || 'Something went wrong. Please try again.' };
}

/* ================================================================
   6) AUTH ACTIONS
   ----------------------------------------------------------------
   ACTIVE-SESSION SYSTEM (one student device at a time)
   Replaces the old permanent "deviceId lock" with an explicit claim:
     students/{uid}.activeSessionId   — random id for the current login
     students/{uid}.activeDeviceId    — which browser/device holds it
     students/{uid}.sessionStartedAt  — server timestamp, informational
   The session stays active until the student explicitly logs out, or an
   admin uses Reset Device — there is NO stale-session timeout and NO
   heartbeat. A forgotten-open browser is only ever freed up by Reset
   Device, by design. The old "deviceId" field is left in place for
   backward compatibility but is no longer read as a lock anywhere.
   ================================================================ */
function newSessionId(){
  return 'sess_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
}

/* This browser tab's record of which session it currently holds, so a
   page reload can tell "is the lock still mine?" without guessing, and a
   logout can avoid ever clearing a session it doesn't own. Kept in
   sessionStorage (per-tab, cleared when the tab/window closes) rather
   than localStorage, deliberately: it should NOT survive into a brand
   new tab the way the device id does. */
function getLocalSessionId(){
  try{ return sessionStorage.getItem('am_session_id') || null; }
  catch(e){ return CURRENT_SESSION_ID; }
}
function setLocalSessionId(id){
  try{
    if(id) sessionStorage.setItem('am_session_id', id);
    else sessionStorage.removeItem('am_session_id');
  }catch(e){ console.error('[session] sessionStorage unavailable (non-blocking):', e); }
}

/* Attempts to claim (or silently confirm) this device's exclusive active
   session for a student, inside a Firestore transaction so two
   near-simultaneous logins on different devices can't both succeed.
   - If a DIFFERENT device already holds the session, throws
     { code:'device-locked', message } — the one real, intended block.
     There is no staleness check — only an explicit logout or an admin
     Reset Device ever frees this up.
   - If the same device already holds it (another tab, or resuming after
     the browser was fully closed), or there's no active session at all
     (including old documents that don't have these fields yet), claims
     it for this device and returns its id.
   Returns the session id this device now holds. */
async function claimStudentSession(uid, myDevice){
  const ref = db.collection(COL.students).doc(uid);
  return db.runTransaction(async (tx) => {
    const snap = await tx.get(ref);
    if(!snap.exists){
      throw { code:'', title:'Account not found', message:'Student record not found.' };
    }
    const data = snap.data();
    const sameDevice = !!data.activeDeviceId && data.activeDeviceId === myDevice;

    if(data.activeSessionId && !sameDevice){
      throw { code:'device-locked', title:'Already logged in on another device', message:'This account is currently logged in on another device. Please log out from that device first, or ask your teacher to reset your device.' };
    }
    if(sameDevice && data.activeSessionId){
      // Already this device's session (a second tab, or resuming after a
      // reload) — nothing to change.
      return data.activeSessionId;
    }
    // No active session at all — claim it fresh. This also auto-migrates
    // old student documents that never had these fields.
    const sid = newSessionId();
    tx.update(ref, {
      activeSessionId: sid,
      activeDeviceId: myDevice,
      sessionStartedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    return sid;
  });
}

/* Clears the active-session fields ONLY if they still belong to this
   browser/session — never another device's, and never a different tab's
   newer claim on the same device. Never throws (logout must always be
   able to proceed even if this fails). */
async function releaseStudentSession(uid, myKnownSessionId){
  if(!myKnownSessionId) return;
  try{
    await db.runTransaction(async (tx) => {
      const ref = db.collection(COL.students).doc(uid);
      const snap = await tx.get(ref);
      if(!snap.exists) return;
      const data = snap.data();
      if(data.activeSessionId && data.activeSessionId === myKnownSessionId){
        tx.update(ref, {
          activeSessionId: '', activeDeviceId: '', sessionStartedAt: null
        });
      }
      // else: a different device/tab now owns the session — leave it alone.
    });
  }catch(e){
    console.error('[session] failed to release session on logout (non-blocking):', e);
  }
}

async function doRegister(data){
  const cred = await auth.createUserWithEmailAndPassword(data.email, data.password);
  const uid = cred.user.uid;
  await db.collection(COL.students).doc(uid).set({
    fullName: data.fullName,
    email: data.email,
    phone: data.phone,
    class: data.class || '',
    batch: data.batch || '',
    location: data.location || '',
    school: data.school || '',
    dob: data.dob || '',
    guardianName: data.guardianName || '',
    guardianPhone: data.guardianPhone || '',
    membership: 'free',
    membershipExpiry: null,
    active: true,
    deviceId: getDeviceId(),
    activeBatchIds: [GENERAL_BATCH_ID],
    watchMinutes: 0,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  // Sign back out immediately rather than silently auto-logging them in —
  // show a clear success message and send them to the Log in tab instead.
  // (Flags are set *before* signOut() because the auth-state listener's
  // re-render can fire while signOut() is still resolving.)
  STATE.authMode = 'login';
  STATE.justRegistered = true;
  await auth.signOut();
}

async function doLogin(email, password){
  LOGIN_IN_PROGRESS = true;
  try{
    const cred = await auth.signInWithEmailAndPassword(email, password);
    const uid = cred.user.uid;
    let doc;
    try{
      doc = await db.collection(COL.students).doc(uid).get();
    }catch(fetchErr){
      console.error('[login] could not load student record:', fetchErr);
      await auth.signOut();
      throw { code:'', title:'Login temporarily unavailable', message:'Please check your internet connection and try again.' };
    }
    if(!doc.exists){
      console.error('[login] signed in OK but no students/'+uid+' document exists.');
      await auth.signOut();
      throw { code:'', title:'Account not found', message:'No student account was found for this login. Are you trying the admin login instead?' };
    }
    const data = doc.data();
    if(data.active === false){
      await auth.signOut();
      const reasonSuffix = data.deactivationReason ? ` Reason: ${data.deactivationReason}` : '';
      throw { code:'', title:'Account deactivated', message:`Your account has been deactivated.${reasonSuffix} Please contact your teacher.` };
    }
    // Active-session (one-device) check — hardened the same way the old
    // device-lock check was: only a CONFIRMED conflicting session on
    // another device blocks login. A problem with the check itself
    // (offline, a failed transaction) must never lock a legitimate
    // student out, so it's logged and the login is allowed through.
    const myDevice = getDeviceId();
    try{
      const sid = await claimStudentSession(uid, myDevice);
      CURRENT_SESSION_ID = sid;
      setLocalSessionId(sid);
    }catch(sessionErr){
      if(sessionErr && sessionErr.code === 'device-locked'){
        await auth.signOut();
        throw { code:'', title:'Already logged in on another device', message: sessionErr.message };
      }
      console.error('[session] claim failed unexpectedly, allowing login anyway:', sessionErr);
      CURRENT_SESSION_ID = null;
      setLocalSessionId(null);
    }
    // Route straight to the dashboard ourselves, rather than waiting on
    // onAuthStateChanged, so a deactivated or device-locked account can
    // never flash the dashboard for an instant before being signed back out.
    CURRENT_USER = cred.user;
    CURRENT_ROLE = 'student';
    CURRENT_PROFILE = data;
    STATE.screen = 'student';
    renderScreen();
    startAnnouncementNotifications();
  } finally {
    LOGIN_IN_PROGRESS = false;
  }
}

async function doAdminLogin(email, password){
  const cred = await auth.signInWithEmailAndPassword(email, password);
  const uid = cred.user.uid;
  const doc = await db.collection(COL.admins).doc(uid).get();
  if(!doc.exists){
    await auth.signOut();
    throw { code:'', title:'Not authorized', message:'This account is not authorized as admin.' };
  }
  // onAuthStateChanged will pick this up and route to the admin app.
}

async function doLogout(){
  const user = auth.currentUser;
  if(user && CURRENT_ROLE === 'student'){
    await releaseStudentSession(user.uid, CURRENT_SESSION_ID || getLocalSessionId());
  }
  CURRENT_SESSION_ID = null;
  setLocalSessionId(null);
  stopAnnouncementNotifications();
  auth.signOut();
}

/* ================================================================
   BROWSER NOTIFICATIONS (Phase H)
   ----------------------------------------------------------------
   Foreground-only, Firestore-listener-driven browser notifications.
   No FCM, no push server, no service worker involved — deliberately:
   this only ever fires while the TMS tab is open and this listener is
   live (same lifetime as every other real-time feature in this app),
   so a plain page-level Notification works for both showing and
   click-handling (its own onclick just focuses this window — see
   showAnnouncementNotification()). This app has no URL router, so
   "focus the TMS" is the full extent of the click destination, which
   is explicitly an acceptable outcome for a single-page app like this
   one. (service-worker.js itself was not part of this change — see
   the phase report for why extending it wasn't necessary here.)

   Lifecycle: started once per login (doLogin() and the resumed-session
   branches of onAuthStateChanged() below both call
   startAnnouncementNotifications(), which is idempotent), stopped on
   doLogout() and on the top-level "signed out" branch of
   onAuthStateChanged() — so it also stops for every OTHER sign-out
   path (deactivated, device-locked, deleted student), without having
   to duplicate the stop call in each of those branches individually.
   Deliberately NOT registered via trackUnsub()/clearUnsubs(): those
   are torn down and rebuilt on every single tab switch (see
   renderScreen()), which would otherwise silently kill this listener
   the moment a student opened, say, the Classes tab.
   ================================================================ */
let NOTIF_UNSUB = null;

function notificationSupport(){ return 'Notification' in window; }

/* Only ever called from the explicit "Enable Notifications" button in
   Settings (Part C) — never on page load / login, so a student is
   never prompted just for opening the app. Never re-prompts once
   denied — the browser wouldn't show a popup for that anyway, but this
   also skips the pointless call entirely and just reports the state. */
async function requestNotificationPermission(){
  if(!notificationSupport()) return 'unsupported';
  if(Notification.permission === 'granted') return 'granted';
  if(Notification.permission === 'denied') return 'denied';
  try{ return await Notification.requestPermission(); }
  catch(e){ console.error('[notifications] permission request failed:', e); return Notification.permission; }
}

/* Shows one native browser notification for a newly-received
   announcement — never for the initial/already-seen backlog, see
   startAnnouncementNotifications(). Suppressed while the tab is the
   one the student is actively looking at (Part J): the in-app
   announcement UI already covers that case, so a browser notification
   on top would just be a redundant duplicate, not a missed one.

   Displays via the existing Service Worker registration's
   registration.showNotification() rather than the page-level
   `new Notification(...)` constructor — Android Chrome / an installed
   Android PWA rejects that constructor outright ("Illegal constructor").
   service-worker.js itself is untouched — this only calls the standard
   showNotification() API on the registration index.html already
   creates via navigator.serviceWorker.register('service-worker.js').
   Click handling is not wired up (would need a notificationclick
   listener inside service-worker.js) — clicking a shown notification
   currently does nothing.

   Known limitation (confirmed via diagnostic testing, not a bug in
   this function): Android may freeze a backgrounded tab's JavaScript
   after a period, which pauses the Firestore listener below along with
   everything else on the page. Without FCM/server-side push — out of
   scope for this Spark-plan, no-backend project — there is no way to
   keep that listener alive or wake it from here while the tab is
   frozen; it resumes and catches up once the tab is foregrounded again. */
function showAnnouncementNotification(a){
  if(!notificationSupport() || Notification.permission !== 'granted') return;
  if(document.visibilityState === 'visible') return;
  if(!('serviceWorker' in navigator)){
    // Same fallback shape as the existing SW-registration guard elsewhere
    // in this file — a browser with Notification support but no Service
    // Worker support is effectively theoretical for this app's targets,
    // but bail cleanly rather than let navigator.serviceWorker throw.
    return;
  }
  const title = a.title || 'Atomic Minds';
  const body = a.message || ('New announcement' + (a.batchName ? (' for ' + a.batchName) : ''));
  navigator.serviceWorker.ready
    .then(registration => registration.showNotification(title, {
      body,
      tag: 'ann-' + a.id // same id -> same OS notification slot; belt-and-suspenders against a duplicate ever stacking
    }))
    .catch(error => console.error('[notifications] could not show notification:', error));
}

/* Idempotent — safe to call from both doLogin() and a resumed session
   without double-attaching (NOTIF_UNSUB already set = already running).
   Runs regardless of current Notification.permission: the listener
   itself is just the same Firestore read every other tab already does,
   and showAnnouncementNotification() is what actually gates on
   permission — kept this way so a student who enables notifications
   mid-session (Settings tab) starts getting them immediately, with
   nothing here needing to notice that change or restart anything. */
function startAnnouncementNotifications(){
  if(NOTIF_UNSUB) return;
  let seenIds = null; // null = first snapshot not processed yet
  syncAndGetMyBatchIds().then(ids=>{
    if(!ids.length || NOTIF_UNSUB) return; // logged out (or already started elsewhere) while this was resolving
    NOTIF_UNSUB = listenContentByBatchIds(COL.announcements, ids, {field:'active', value:true}, items=>{
      if(seenIds === null){
        // First delivery after (re)attaching is the existing backlog, not
        // "new" — mark it all seen and never notify for it (Part G).
        seenIds = new Set(items.map(a=>a.id));
        return;
      }
      items.forEach(a=>{
        if(seenIds.has(a.id)) return; // already-known doc re-delivered — reconnect/metadata-only change/etc. (Part F)
        seenIds.add(a.id);
        showAnnouncementNotification(a);
      });
    }, err=> console.error('[notifications] announcement listener failed:', err));
  });
}

function stopAnnouncementNotifications(){
  if(NOTIF_UNSUB){ try{ NOTIF_UNSUB(); }catch(e){} NOTIF_UNSUB = null; }
}

/* ================================================================
   7) AUTH STATE LISTENER — decides which screen to show
   ================================================================ */
auth.onAuthStateChanged(async (user) => {
  CURRENT_USER = user;
  if(!user){
    CURRENT_PROFILE = null; CURRENT_ROLE = null;
    CURRENT_SESSION_ID = null;
    STUDENT_SELECTED_BATCH_ID = null; // Phase I: never let one student's view-filter selection leak into the next login on this device
    stopAnnouncementNotifications();
    STATE.screen = 'auth';
    renderScreen();
    return;
  }
  if(LOGIN_IN_PROGRESS){
    // doLogin() is actively validating this exact sign-in and will route
    // to the right screen itself once it finishes — skip here so a
    // not-yet-approved login can never flash the dashboard before being
    // signed back out (see doLogin above).
    return;
  }
  try{
    const adminDoc = await db.collection(COL.admins).doc(user.uid).get();
    if(adminDoc.exists){
      CURRENT_ROLE = 'admin';
      CURRENT_PROFILE = adminDoc.data();
      STATE.screen = 'admin';
      renderScreen();
      return;
    }
    const studentDoc = await db.collection(COL.students).doc(user.uid).get();
    if(studentDoc.exists && studentDoc.data().active !== false){
      const data = studentDoc.data();
      // A resumed session (page load/reload, or the PWA waking back up,
      // not a fresh password login — doLogin already handled that case
      // above). Confirm this device still legitimately holds the active
      // session before letting it back into the dashboard.
      const myDevice = getDeviceId();
      try{
        const sid = await claimStudentSession(user.uid, myDevice);
        CURRENT_SESSION_ID = sid;
        setLocalSessionId(sid);
        CURRENT_ROLE = 'student';
        CURRENT_PROFILE = data;
        STATE.screen = 'student';
        renderScreen();
        startAnnouncementNotifications();
      }catch(sessionErr){
        if(sessionErr && sessionErr.code === 'device-locked'){
          CURRENT_SESSION_ID = null; setLocalSessionId(null);
          toast('Logged out — this account signed in on another device.');
          await auth.signOut();
        }else{
          console.error('[session] resume check failed, allowing session anyway:', sessionErr);
          CURRENT_ROLE = 'student';
          CURRENT_PROFILE = data;
          STATE.screen = 'student';
          renderScreen();
          startAnnouncementNotifications();
        }
      }
      return;
    }
    // Neither admin nor active student — bounce back to login.
    if(!studentDoc.exists){
      // Permanent Delete case: the Firebase Auth account still works, but
      // its students/{uid} profile is gone. Never auto-recreate it —
      // just reject and tell them why, same as a fresh doLogin() attempt
      // against a missing doc already does.
      toast('This student account is no longer registered. Please contact the administrator.');
    }
    await auth.signOut();
  }catch(e){
    console.error(e);
    await auth.signOut();
  }
});

/* ================================================================
   8) LIVE-LISTENER CLEANUP
   ----------------------------------------------------------------
   Every onSnapshot() started while building a screen is registered
   here, and cleared right before the next full re-render — so
   switching tabs never leaves old Firestore listeners running.
   ================================================================ */
STATE.unsubs = [];
function trackUnsub(fn){ STATE.unsubs.push(fn); }
function clearUnsubs(){ STATE.unsubs.forEach(u=>{ try{ u(); }catch(e){} }); STATE.unsubs = []; }

/* Google Drive "share" links (drive.google.com/file/d/ID/view) are an
   HTML viewer page, not raw image bytes — a plain <img src> pointing at
   one simply never loads, which is exactly what was happening here even
   though the link itself opens fine in a browser tab. Converts a Drive
   share link (or a bare Drive file ID) to Drive's actual image-serving
   host; anything that isn't a Drive link passes through unchanged, so
   any other already-working direct image URL is untouched. Reuses
   driveIdFromUrl() (already used for Notes' Drive links below) rather
   than a second ID-parsing implementation. Called at render time, not
   save time, so it applies retroactively to banners already saved with
   a raw share link — no need to re-save existing banners. */
function resolveImageUrl(url){
  url = (url||'').trim();
  if(!url) return url;
  if(/drive\.google\.com/i.test(url)){
    const id = driveIdFromUrl(url);
    if(id) return 'https://lh3.googleusercontent.com/d/' + id;
  }
  return url;
}

/* ================================================================
   DASHBOARD PROMOTIONAL BANNER CAROUSEL
   ----------------------------------------------------------------
   Purely decorative — greetings, special-occasion messages, new-batch
   promos, etc. Deliberately kept SEPARATE from the Announcements
   system: no Phase H notification listener, no browser notification,
   no dedup/baseline logic — none of that machinery is touched by or
   even aware of this feature. General/everyone only, no batch
   targeting, so there's no syncAndGetMyBatchIds() dependency here —
   the Firestore Rule's isActiveStudent() check is the entire
   authorization, same shape as every other student-only read.

   Sorting by `order` happens client-side, not via a Firestore
   orderBy() — specifically so this query (a plain
   where('active','==',true)) never needs a composite index, the same
   lesson this project already learned the hard way with classSchedules.
   Auto-advance is a plain client-side setInterval driving scrollTo() —
   not a Firestore poll and not a session heartbeat; nothing here reads
   or writes Firestore on a timer, and the interval is torn down via
   trackUnsub() exactly like every other per-screen resource in this
   app, so it never survives a tab switch. */
function renderBannerCarousel(container){
  const wrap = el(`<div class="banner-carousel-wrap" style="display:none">
    <div class="banner-track"></div>
    <div class="banner-dots"></div>
  </div>`);
  container.appendChild(wrap);
  const track = $('.banner-track', wrap);
  const dotsBox = $('.banner-dots', wrap);

  let autoTimer = null;
  let userInteracting = false;
  let interactionResetTimer = null;
  function clearAuto(){ if(autoTimer){ clearInterval(autoTimer); autoTimer = null; } }
  trackUnsub(clearAuto);

  function slideStep(){
    return track.firstElementChild ? track.firstElementChild.getBoundingClientRect().width + 12 : 0; // +gap
  }
  function goTo(i){ track.scrollTo({left: i*slideStep(), behavior:'smooth'}); }

  const unsub = db.collection(COL.banners).where('active','==',true).onSnapshot(snap=>{
    const items = []; snap.forEach(d=> items.push({id:d.id, ...d.data()}));
    items.sort((a,b)=> (a.order||0) - (b.order||0));
    clearAuto();
    track.innerHTML = ''; dotsBox.innerHTML = '';
    if(!items.length){ wrap.style.display = 'none'; return; } // nothing to show — stay hidden rather than showing an empty frame
    wrap.style.display = '';
    items.forEach(b=>{
      track.appendChild(el(`<div class="banner-slide"><img src="${esc(resolveImageUrl(b.imageUrl))}" alt="" loading="lazy"></div>`));
    });
    if(items.length > 1){
      items.forEach((b,i)=> dotsBox.appendChild(el(`<span class="banner-dot${i===0?' active':''}" data-i="${i}"></span>`)));
      function updateDots(){
        const idx = Math.round(track.scrollLeft / slideStep());
        $all('.banner-dot', dotsBox).forEach((d,i)=> d.classList.toggle('active', i===idx));
      }
      track.addEventListener('scroll', ()=>{
        updateDots();
        clearTimeout(interactionResetTimer);
        userInteracting = true;
        interactionResetTimer = setTimeout(()=>{ userInteracting = false; }, 2500); // resume auto-advance a bit after the swipe settles
      });
      autoTimer = setInterval(()=>{
        if(userInteracting) return;
        const idx = Math.round(track.scrollLeft / slideStep());
        goTo((idx + 1) % items.length);
      }, 4500);
    }
  }, err=> console.error('[banners] listener failed:', err));
  trackUnsub(unsub);
}

/* ================================================================
   BATCH-AWARE CONTENT ACCESS (Phase D)
   ----------------------------------------------------------------
   The source of truth for "what batches is this student in" is their
   ACTIVE, non-expired enrollments — but Firestore Security Rules cannot
   run a where() query against `enrollments` to check this for a list
   read (rules can only get() ONE deterministic document, not query a
   collection). So students/{uid}.activeBatchIds is maintained as a
   plain array — the one thing a security rule CAN check with a single
   get() — and every content query is constrained to it with
   where('batchId','in',[...]) so Firestore itself, not just this
   JavaScript, refuses to return anything outside it. See
   firestore.rules for the enforcement side of this.
   ================================================================ */
const GENERAL_BATCH_ID = '__general__'; // sentinel batchId: content visible to every active student

/* ================================================================
   STUDENT DASHBOARD BATCH SELECTOR (Phase I)
   ----------------------------------------------------------------
   A student who is actively enrolled in more than one real batch can
   now pick which ONE batch's Classes/Notes/Tests/Calendar they want to
   view, instead of always seeing everything merged together.

   selectedBatchId is a VIEW/FILTER state, never an authorization
   field — it is never written to Firestore, never read by any
   Security Rule, and lives only as this in-memory variable, reset on
   every login/logout (see doLogin()/doLogout()/onAuthStateChanged()).
   The actual authorization source remains exactly what it always
   was: students/{uid}.activeBatchIds, resolved fresh via
   syncAndGetMyBatchIds() (self-healing trim included, unchanged) and
   re-checked by Firestore Rules against every document regardless of
   what a query asks for. If this variable were tampered with in
   DevTools to some batch the student isn't actually in,
   selectedContentIds() below would still only ever narrow the REAL,
   rule-verified id list down — it can never add an id that wasn't
   already in it, so nothing changes about what a student can actually
   read; Rules are, as always, the true enforcement.

   Announcements and Browser Notifications intentionally do NOT use
   any of this — both keep calling syncAndGetMyBatchIds() directly and
   are completely unaffected by which batch is selected here, exactly
   as the spec requires. */
let STUDENT_SELECTED_BATCH_ID = null;

/* Narrows the real, rule-verified batch id list down to just the
   currently selected batch for content queries (Classes/Notes/Tests/
   Calendar). General Demo is always layered on top of a real batch
   selection, same as it implicitly always was before this phase — the
   one exception is General Demo selected on its own, which shows only
   itself, never merged with a real batch. Falls back to the full
   `realIds` list (the exact pre-Phase-I behavior) whenever nothing
   valid is selected yet, e.g. a student who opens Classes before ever
   visiting the Dashboard — so content is never blank because of this
   feature, only ever narrowed once there's something to narrow to. */
function selectedContentIds(realIds){
  if(!realIds || !realIds.length) return realIds || [];
  if(STUDENT_SELECTED_BATCH_ID && realIds.includes(STUDENT_SELECTED_BATCH_ID)){
    return STUDENT_SELECTED_BATCH_ID === GENERAL_BATCH_ID
      ? [GENERAL_BATCH_ID]
      : Array.from(new Set([STUDENT_SELECTED_BATCH_ID, GENERAL_BATCH_ID]));
  }
  return realIds;
}
                                          // (must exactly match the literal used in firestore.rules)

/* Given a student's enrollment documents, returns the Set of batchIds
   they currently have valid access to (status active, and — for a fixed
   expiry — not yet expired), always including the general marker. */
function computeValidBatchIds(enrollmentDocs){
  const ids = new Set([GENERAL_BATCH_ID]);
  const now = Date.now();
  enrollmentDocs.forEach(e=>{
    if(e.status !== 'active') return; // suspended, or any other non-active status
    if(e.expiryType === 'fixed' && e.expiresAt){
      const expMs = e.expiresAt.toDate ? e.expiresAt.toDate().getTime() : new Date(e.expiresAt).getTime();
      if(expMs <= now) return; // expired
    }
    if(e.batchId) ids.add(e.batchId);
  });
  return ids;
}

/* ADMIN-PRIVILEGED. Recomputes and overwrites one student's
   activeBatchIds from their current enrollments. Firestore rules only
   let a student SHRINK their own array (see firestore.rules), so
   granting access — a new enrollment, reactivating a suspended one —
   can only be written by an admin. Call this after every enrollment
   create/suspend/reactivate/delete and after deleting a batch, so the
   authorization map never drifts from the real enrollment data. */
async function syncStudentActiveBatchIds(studentId){
  try{
    const snap = await db.collection(COL.enrollments).where('studentId','==',studentId).get();
    const docs = []; snap.forEach(d=> docs.push(d.data()));
    const ids = Array.from(computeValidBatchIds(docs));
    await db.collection(COL.students).doc(studentId).update({ activeBatchIds: ids });
  }catch(e){
    console.error('[batch-access] could not sync activeBatchIds for', studentId, e);
  }
}

/* STUDENT-SIDE. Re-reads this student's own activeBatchIds (fresh from
   Firestore, not the possibly-stale in-memory CURRENT_PROFILE) and their
   current enrollments, then trims any id that's no longer valid — a
   fixed-term enrollment that just expired shouldn't have to wait for an
   admin to notice. This can only ever SHRINK the array (rules enforce
   that), never grant anything new; a freshly-approved enrollment an
   admin hasn't synced yet simply isn't visible until they do, or until
   the student's next login after that sync — fail-closed by design.
   Returns the ids that are SAFE to query content with right now (i.e.
   already present in the server-side record), or [] if none. */
async function syncAndGetMyBatchIds(){
  let current = [];
  try{
    const selfDoc = await db.collection(COL.students).doc(CURRENT_USER.uid).get();
    current = (selfDoc.exists && Array.isArray(selfDoc.data().activeBatchIds)) ? selfDoc.data().activeBatchIds : [];
  }catch(e){
    console.error('[batch-access] could not read own activeBatchIds, failing closed:', e);
    return [];
  }
  if(!current.length) return [];
  let validIds;
  try{
    const snap = await db.collection(COL.enrollments).where('studentId','==',CURRENT_USER.uid).get();
    const docs = []; snap.forEach(d=> docs.push(d.data()));
    validIds = computeValidBatchIds(docs);
  }catch(e){
    console.error('[batch-access] could not load enrollments, using last-known access only:', e);
    return current; // a transient read failure shouldn't punish already-granted access
  }
  const shrunk = current.filter(id => validIds.has(id));
  if(shrunk.length !== current.length){
    db.collection(COL.students).doc(CURRENT_USER.uid).update({ activeBatchIds: shrunk })
      .catch(e=> console.error('[batch-access] self-shrink write failed (non-blocking):', e));
  }
  return shrunk;
}

/* Firestore's `in` operator accepts at most 30 values. Sets up one
   real-time listener per chunk of batchIds — for this app's scale a
   student almost never has more than a couple of batches, so this is
   normally a single listener, but it stays correct if that changes —
   and calls onChange with the merged, de-duplicated result set whenever
   any chunk updates, preserving the app's existing live-update behavior
   instead of downgrading content tabs to a one-time fetch. Returns an
   unsubscribe function that stops all of them; register it with
   trackUnsub() same as any other listener.

   extraWhere is an optional {field, value} always applied on top of the
   batchId filter (e.g. {field:'active', value:true} for announcements) —
   whatever the matching firestore.rules rule checks beyond batch
   authorization, the query must constrain the same way, or Firestore
   rejects the whole query as unprovable (see firestore.rules' comments). */
function listenContentByBatchIds(collectionName, batchIds, extraWhere, onChange, onError){
  if(!batchIds.length){ onChange([]); return ()=>{}; }
  const chunks = [];
  for(let i=0;i<batchIds.length;i+=30) chunks.push(batchIds.slice(i,i+30));
  const chunkResults = chunks.map(()=> []);
  function emit(){
    const seen = new Set(), merged = [];
    chunkResults.forEach(list=> list.forEach(item=>{
      if(seen.has(item.id)) return; seen.add(item.id); merged.push(item);
    }));
    onChange(merged);
  }
  const unsubs = chunks.map((chunk, i) => {
    let q = db.collection(collectionName).where('batchId','in',chunk);
    if(extraWhere) q = q.where(extraWhere.field,'==',extraWhere.value);
    return q.onSnapshot(snap=>{
      chunkResults[i] = []; snap.forEach(d=> chunkResults[i].push({id:d.id, ...d.data()}));
      emit();
    }, err=>{ console.error(err); if(onError) onError(err); });
  });
  return ()=> unsubs.forEach(u=>u());
}

/* ================================================================
   CALENDAR / CLASS SCHEDULE (Phase F)
   ----------------------------------------------------------------
   New students/{uid}.activeBatchIds + GENERAL_BATCH_ID authorization
   model — same as Classes/Tests/Notes/Announcements, nothing new. Kept
   as a separate collection (classSchedules) from liveClasses: liveClasses
   is specifically "join this live video call" (single time, meetLink,
   upcoming/live/ended status); the Calendar is the broader "what's
   happening when" schedule (start+end time, topic, cancel/reschedule).
   Merging them would have meant reworking liveClasses' existing status
   model and risking its working join-link flow for no real benefit —
   they can both describe the same real class if an admin wants, but
   nothing here links or syncs them automatically.

   listenScheduleByBatchIds() is intentionally separate from
   listenContentByBatchIds() rather than extending it: a monthly
   calendar needs an additional date-range constraint that helper was
   never built for, and changing its signature would mean touching five
   already-working call sites (videos/liveClasses/tests/notes/
   announcements) for the sake of one new one. Requires a composite
   Firestore index on classSchedules (batchId, date) — see the summary
   for the one-time setup step. */
function pad2(n){ return String(n).padStart(2,'0'); }
function ymd(y,m,d){ return `${y}-${pad2(m+1)}-${pad2(d)}`; }
function todayYMD(){ const t=new Date(); return ymd(t.getFullYear(), t.getMonth(), t.getDate()); }

function listenScheduleByBatchIds(batchIds, firstDay, lastDay, onChange, onError){
  if(!batchIds.length){ onChange([]); return ()=>{}; }
  const chunks = [];
  for(let i=0;i<batchIds.length;i+=30) chunks.push(batchIds.slice(i,i+30));
  const chunkResults = chunks.map(()=> []);
  function emit(){
    const seen = new Set(), merged = [];
    chunkResults.forEach(list=> list.forEach(item=>{
      if(seen.has(item.id)) return; seen.add(item.id); merged.push(item);
    }));
    onChange(merged);
  }
  const unsubs = chunks.map((chunk, i) =>
    db.collection(COL.classSchedules)
      .where('batchId','in',chunk)
      .where('date','>=',firstDay)
      .where('date','<=',lastDay)
      .onSnapshot(snap=>{
        chunkResults[i] = []; snap.forEach(d=> chunkResults[i].push({id:d.id, ...d.data()}));
        emit();
      }, err=>{ console.error(err); if(onError) onError(err); })
  );
  return ()=> unsubs.forEach(u=>u());
}

/* ================================================================
   RECURRING WEEKLY SCHEDULES (Phase F.2)
   ----------------------------------------------------------------
   Stored as a SEPARATE collection, classScheduleRules — one document
   per recurring series (e.g. "every Tue+Sun, 1 Oct - 31 Dec"), never
   as individual generated classSchedules documents. The Student
   Calendar expands each rule into virtual per-day occurrences,
   client-side, only for the month currently being viewed — see
   expandRuleOccurrences() below. Nothing is ever written to Firestore
   for an individual occurrence; the only writes are to the rule
   itself (create/edit/pause/delete) and to its `overrides` map for a
   one-off cancel/reschedule (see makeRuleOccurrence()).

   Read access follows the EXACT same batchId/activeBatchIds shape as
   classSchedules (see firestore.rules) — reusing listenContentByBatchIds()
   with extraWhere {field:'status', value:'active'} is deliberate: that's
   an equality filter on top of the existing batchId 'in' filter, same
   shape as the already-working announcements query, so it doesn't need
   the kind of composite index classSchedules needed for its date RANGE
   filter. If Firestore's console says otherwise when this is first
   exercised, the calendar's error handler below will show the direct
   "create it here" link — same as it did for the original index issue.

   Day-of-week convention (must match firestore.rules comments and the
   admin picker): 0=Sunday .. 6=Saturday, i.e. plain JS Date#getDay().
   ================================================================ */

function daysOfWeekLabel(daysArr){
  const names = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const sorted = (daysArr||[]).slice().sort((a,b)=>a-b);
  if(!sorted.length) return '';
  return 'Every ' + sorted.map(i=>names[i]||'?').join(' & ');
}

/* Turns ONE recurring rule document into virtual occurrence objects,
   shaped exactly like a classSchedules document (same fields
   renderCalendarGrid()/renderDaySchedule() already read), for every
   date in [firstDay,lastDay] the rule actually falls on. All date math
   uses local Date(year,monthIndex,day) components — never parses a
   "YYYY-MM-DD" string straight into `new Date(...)`, which can shift
   the date by the viewer's timezone offset — so a class stays on the
   day it says regardless of the student's browser timezone. */
function expandRuleOccurrences(rule, firstDay, lastDay){
  const out = [];
  if(!rule.startDate || !rule.endDate || !Array.isArray(rule.daysOfWeek)) return out;
  const overrides = rule.overrides || {};
  const start = rule.startDate > firstDay ? rule.startDate : firstDay;
  const end = rule.endDate < lastDay ? rule.endDate : lastDay;

  if(start <= end){
    const [sy,sm,sd] = start.split('-').map(Number);
    const [ey,em,ed] = end.split('-').map(Number);
    let cur = new Date(sy, sm-1, sd);
    const endDate = new Date(ey, em-1, ed);
    while(cur <= endDate){
      if(rule.daysOfWeek.includes(cur.getDay())){
        const dateStr = ymd(cur.getFullYear(), cur.getMonth(), cur.getDate());
        const ov = overrides[dateStr];
        if(!ov){
          out.push(makeRuleOccurrence(rule, dateStr, dateStr, 'scheduled', null));
        } else if(ov.status === 'cancelled'){
          out.push(makeRuleOccurrence(rule, dateStr, dateStr, 'cancelled', null));
        }
        // ov.status === 'rescheduled': nothing shows on the original date —
        // the moved occurrence is injected below, keyed by its NEW date.
      }
      cur.setDate(cur.getDate()+1);
    }
  }

  // Rescheduled occurrences are checked against the visible range by their
  // NEW date, independently of the day-of-week loop above — this is what
  // makes a class moved across a month boundary show up in the month it
  // was moved TO (and correctly disappear from the month it was moved FROM).
  Object.keys(overrides).forEach(origDate=>{
    const ov = overrides[origDate];
    if(ov && ov.status === 'rescheduled' && ov.newDate >= firstDay && ov.newDate <= lastDay){
      out.push(makeRuleOccurrence(rule, ov.newDate, origDate, 'scheduled', ov));
    }
  });

  return out;
}

function makeRuleOccurrence(rule, displayDate, originalDate, status, ov){
  return {
    id: 'rule_'+rule.id+'_'+originalDate, // stable ruleId+occurrenceDate identity
    ruleId: rule.id,
    isRecurring: true,
    originalDate: originalDate,
    batchId: rule.batchId,
    batchName: rule.batchName,
    date: displayDate,
    startTime: (ov && ov.startTime) || rule.startTime,
    endTime: (ov && ov.endTime) || rule.endTime,
    title: rule.title,
    topic: rule.topic,
    classType: rule.classType,
    teacher: rule.teacher,
    status: status,
    rescheduled: !!ov
  };
}

    const scopedIds = selectedContentIds(ids); // Phase I: narrow to the Dashboard's currently selected batch (+ General)

    // Phase F.2: the calendar now merges TWO live sources — one-time
    // classSchedules (unchanged) and recurring classScheduleRules, expanded
    // client-side into virtual occurrences for just this visible month
    // (expandRuleOccurrences() above). Both are independent onSnapshot
    // listeners; either one updating re-renders the merged result. Neither
    // waits forever on the other — each starts from `[]`, so if one
    // collection is simply empty (e.g. no recurring rules yet) the other
    // still renders normally instead of hanging on a spinner.
    let oneTimeItems = [], ruleDocs = [], loadError = null;

    function showLoadError(err){
      // Same diagnostic error surfacing as the original one-time-only
      // calendar fix — see comment history above expandRuleOccurrences().
      const code = err && err.code;
      let msg = 'Could not load — check your connection.';
      if(code === 'failed-precondition'){
        msg = 'Calendar setup incomplete — a database index is missing. Open the browser console for a link to create it.';
      } else if(code === 'permission-denied'){
        msg = 'Could not load your schedule — your batch access may be out of date. Try logging out and back in.';
      }
      grid.innerHTML = '';
      dayList.innerHTML = `<div class="empty-state">${esc(msg)}</div>`;
    }

    function renderMerged(){
      if(loadError){ showLoadError(loadError); return; }
      const recurringOccurrences = [];
      ruleDocs.forEach(rule=> recurringOccurrences.push(...expandRuleOccurrences(rule, firstDay, lastDay)));
      const merged = oneTimeItems.concat(recurringOccurrences);
      renderCalendarGrid(grid, y, m, merged);
      renderDaySchedule(dayList, merged);
    }

    const unsub1 = listenScheduleByBatchIds(scopedIds, firstDay, lastDay, items=>{
      oneTimeItems = items; renderMerged();
    }, (err)=>{ loadError = err; renderMerged(); });
    trackUnsub(unsub1);

    const unsub2 = listenContentByBatchIds(COL.classScheduleRules, scopedIds, {field:'status', value:'active'}, items=>{
      ruleDocs = items; renderMerged();
    }, (err)=>{ loadError = err; renderMerged(); });
    trackUnsub(unsub2);
  });
}

function renderCalendarGrid(grid, y, m, items){
  const datesWithClasses = new Set(items.map(i=>i.date));
  const firstWeekday = (new Date(y,m,1).getDay()+6)%7; // 0=Mon .. 6=Sun
  const daysInMonth = new Date(y,m+1,0).getDate();
  const today = todayYMD();

  let html = `<div class="cal-dow">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div>${d}</div>`).join('')}</div><div class="cal-days">`;
  for(let i=0;i<firstWeekday;i++) html += `<div class="cal-day empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = ymd(y,m,d);
    const has = datesWithClasses.has(dateStr);
    const isToday = dateStr===today;
    const isSelected = dateStr===STATE.calendarSelectedDate;
    html += `<div class="cal-day${isToday?' cal-today':''}${isSelected?' cal-selected':''}" data-date="${dateStr}">
      <span>${d}</span>${has?'<span class="cal-dot"></span>':''}
    </div>`;
  }
  html += `</div>`;
  grid.innerHTML = html;
  $all('.cal-day[data-date]', grid).forEach(cell=> cell.addEventListener('click', ()=>{
    STATE.calendarSelectedDate = cell.dataset.date;
    renderScreen();
  }));
}
