<div id="tmsSplash" aria-hidden="true">

      </defs>

      <circle id="spHead" r="10" fill="#f1ecff" opacity="0"/>

<script>
/* Runs before first paint. Standalone (installed PWA) launch => Android already showed its splash icon, so the web splash starts
   from that icon's size. The OS icon canvas is 288 dp and the emblem fills 56.5% of it (162.6 dp wide); ours is stage*84.3% wide. */
(function(){
  var sp = document.getElementById('tmsSplash'), img = sp && sp.querySelector('.sp-img'); if(!sp) return;
  var pwa = false; try{ pwa = window.navigator.standalone === true || ['standalone','fullscreen','minimal-ui'].some(function(m){ return window.matchMedia('(display-mode: ' + m + ')').matches; }); }catch(e){}
  if(pwa){
    var stageW = Math.min(0.7 * (document.documentElement.clientWidth || window.innerWidth || 360), 380);
    sp.style.setProperty('--sp-from', Math.max(0.4, Math.min(0.95, 192.9 / stageW)).toFixed(3));
    sp.classList.add('sp-pwa');
  }
  function ready(){ img.classList.add('sp-ready'); }
  if(img){ if(img.complete && img.naturalWidth) ready(); else { img.addEventListener('load', ready); img.addEventListener('error', ready); } }
})();
</script>

<script>
/* Startup splash controller. Pure UI: no Firebase, no auth, no storage writes, nothing the app reads.
   The spark lap is driven by ACCUMULATED frame time (each frame counts for at most 50 ms), and it only starts once the
   app's big boot script has finished running (see __tmsSplashBoot at the end of the page). That way a busy phone can
   stall the main thread without the lap being skipped or teleporting: it simply plays out in full, then the splash fades
   once the app has drawn its first real screen (login or dashboard). It also plays when the phone reports
   "reduce motion" (the lap is a small glow moving ~1.5 s; only the scale-in and halo pulse are dropped then).
   A browser refresh (navigation type "reload") skips it, so a student reloading mid-test is never delayed. */
(function(){
  var sp = document.getElementById('tmsSplash'); if(!sp) return;
  var nav = ''; try{ nav = (performance.getEntriesByType('navigation')[0] || {}).type || ''; }catch(e){}
  if(nav === 'reload'){ sp.parentNode.removeChild(sp); return; }
  var app = document.getElementById('app'), img = sp.querySelector('.sp-img');
  var theme = document.querySelector('meta[name="theme-color"]'), themeWas = theme ? theme.getAttribute('content') : null;
  if(theme) theme.setAttribute('content', '#0e011d');   // status bar matches the splash while it is up; restored on close
  var LAP_DELAY = 450, LAP_MS = 1500, SETTLE = 750, FALLBACK_ARM = 2200, MAX = 9000;
  var pageT0 = performance.now(), started = false, armed = false, closing = false, raf = 0, last = 0, clock = 0, lapDone = false, doneAt = 0;
  /* middle orbit of the supplied artwork, in the artwork's own pixel space (fitted from the PNG) */
  var CX = 624.1, CY = 678.3, A = 339.7, B = 85.4, T_START = Math.atan2((730 - CY) / B, (362 - CX) / A), TAIL = 9;
  var head = document.getElementById('spHead'), glow = document.getElementById('spHeadGlow'), trail = document.getElementById('spTrail'), dots = [];
  for(var i = 0; i < TAIL; i++){
    var c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('fill', '#b9a4ff'); c.setAttribute('opacity', '0'); trail.appendChild(c); dots.push(c);
  }
  function ease(x){ return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; }
  function pos(t){ return [CX + A * Math.cos(t), CY + B * Math.sin(t)]; }
  function place(el, p, r, o){ el.setAttribute('cx', p[0].toFixed(1)); el.setAttribute('cy', p[1].toFixed(1)); if(r) el.setAttribute('r', r); el.setAttribute('opacity', o); }
  function frame(now){
    raf = requestAnimationFrame(frame);
    var dt = last ? Math.min(now - last, 50) : 16; last = now;
    if(!armed || lapDone) return;
    clock += dt;
    var k = (clock - LAP_DELAY) / LAP_MS;
    if(k < 0) return;
    if(k >= 1){
      [head, glow].forEach(function(n){ n.setAttribute('opacity', 0); }); dots.forEach(function(d){ d.setAttribute('opacity', 0); });
      sp.classList.add('sp-merge'); lapDone = true; doneAt = performance.now(); return;   // ends exactly on the logo's own electron
    }
    var fade = k < .12 ? k / .12 : k > .88 ? (1 - k) / .12 : 1;
    var p = pos(T_START + ease(k) * 2 * Math.PI);
    place(glow, p, 46, .9 * fade); place(head, p, 10, fade);
    for(var j = 0; j < TAIL; j++){
      var kk = Math.max(0, k - (j + 1) * .018);
      place(dots[j], pos(T_START + ease(kk) * 2 * Math.PI), 8 - j * .7, (.5 - j * .05) * fade);
    }
  }
  function isReady(){
    var f = app && app.firstElementChild;
    return !!f && !(f.firstElementChild && f.firstElementChild.classList.contains('spinner') && f.children.length === 1);
  }
  function close(){
    if(closing) return; closing = true; if(raf) cancelAnimationFrame(raf);
    if(theme && themeWas !== null) theme.setAttribute('content', themeWas);
    sp.classList.add('sp-out'); setTimeout(function(){ if(sp.parentNode) sp.parentNode.removeChild(sp); }, 700);
  }
  function check(){
    if(closing) return;
    var now = performance.now();
    if(lapDone && now - doneAt >= SETTLE && isReady()) close();
    else if(now - pageT0 >= MAX) close();
  }
  function arm(){ if(armed) return; armed = true; }
  window.__tmsSplashBoot = arm;   // called by a one-line script after the app's boot script has finished executing
  function go(){
    if(started) return; started = true; sp.classList.add('sp-go');
    raf = requestAnimationFrame(frame);
    setTimeout(arm, FALLBACK_ARM);   // never depend on the boot signal alone
  }
  if(app && window.MutationObserver) new MutationObserver(check).observe(app, { childList: true });
  setInterval(check, 300);
  if(img && !img.complete){ img.addEventListener('load', go); img.addEventListener('error', go); setTimeout(go, 1500); } else go();
})();
</script>

/* ---- shared input validation (registration + profile editing) ----
   One place decides what counts as a valid full name / Indian mobile
   number / email, so registration and profile-edit never drift apart
   or duplicate slightly-different regexes. Each returns
   {ok:true, value} with the value normalized for storage, or
   {ok:false, error} with a user-facing message. */
function validateFullName(name){
  // Trim outer whitespace and collapse repeated internal spaces — this
  // is the one automatic modification allowed; nothing else about the
  // name is invented or altered. Requires at least two space-separated
  // words; each word may contain internal hyphens/apostrophes (e.g.
  // "Anne-Marie", "O'Brien") so legitimate names aren't rejected, but a
  // single hyphenated token with no space (e.g. "Ayan-Paul") still isn't
  // a two-word name and is still rejected.
  const normalized = (name||'').trim().replace(/\s+/g,' ');
  const WORD = "[A-Za-z]+(?:['-][A-Za-z]+)*";
  const re = new RegExp('^' + WORD + '(?:\\s' + WORD + ')+$');
  if(!re.test(normalized)){
    return { ok:false, error:'Enter a full name — first and last name (e.g. "Virat Kohli").' };
  }
  return { ok:true, value:normalized };
}
function validateIndianMobile(phone, opts){
  const trimmed = (phone||'').trim();
  if(!trimmed) return (opts && opts.optional) ? { ok:true, value:'' } : { ok:false, error:'Enter a valid 10-digit phone number.' };
  if(!/^\d{10}$/.test(trimmed)) return { ok:false, error:'Enter a valid 10-digit phone number.' };
  return { ok:true, value:trimmed };
}
function validateEmail(email){
  const trimmed = (email||'').trim();
  // Deliberately simple, standard check — not a full RFC 5322 parser.
  // Firebase Authentication performs its own authoritative validation
  // on top of this at account-creation time.
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(trimmed)) return { ok:false, error:'Enter a valid email address.' };
  return { ok:true, value:trimmed };
}

  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove('show'), 2400);
}

/* A random ID generated once per browser/device and stored in localStorage,
   used to identify "this browser" to the active-session system below (see
   AUTH ACTIONS). It is NOT itself a login lock — it's just this device's
   fingerprint; students/{uid}.activeDeviceId is the temporary lock, and it
   is released on logout or after a period of inactivity, not tied
   permanently to any one device.
   Wrapped defensively: some browser contexts (strict private-browsing
   modes, certain in-app browsers) can block localStorage entirely — if
   that happens we fall back to a session-only id instead of crashing. */
function getDeviceId(){
  try{
    let id = localStorage.getItem('am_device_id');
    if(!id){
      id = 'dev_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('am_device_id', id);
    }
    return id;
  }catch(e){
    console.error('[device-lock] localStorage unavailable, using a session-only id:', e);
    if(!window.__amFallbackDeviceId){
      window.__amFallbackDeviceId = 'dev_fallback_' + Math.random().toString(36).slice(2);
    }
    return window.__amFallbackDeviceId;
  }
}

/* ================================================================
   APP-LIKE BEHAVIOUR — copy lock + Android/browser Back button
   ----------------------------------------------------------------
   (1) Copy lock: text can't be selected or copied anywhere a student/guest sees (inputs and textareas still work).
       The lock is the `app-lock` class on <html>; it is lifted only on the admin screens, where copying phone numbers,
       links and IDs is part of the job. This is a UX lock, not security — a determined user can still screenshot or retype.
   (2) Back button: ONE layered model drives history. A history entry is kept for "the app" (1), for an open non-home tab (+1)
       and for every open overlay / sheet / drawer / player (+1 each). Back therefore closes the top layer, else leaves the tab
       for the Dashboard / admin home, else asks "press back again to exit". It reconciles to that model instead of tracking
       individual pushes, so overlapping open/close calls cannot desynchronise it. While a test attempt is running, the test
       runner's own guard (TMS_ACTIVE) keeps full control and this module stays out of the way.
   ================================================================ */
(function(){
  const root = document.documentElement;
  const isEditable = t => { const e = t && t.nodeType === 3 ? t.parentElement : t; return !!(e && e.closest && e.closest('input,textarea,select,[contenteditable=""],[contenteditable="true"]')); };
  const locked = () => root.classList.contains('app-lock');
  ['copy', 'cut'].forEach(ev => document.addEventListener(ev, e => {
    if(locked() && !isEditable(e.target)){ e.preventDefault(); try{ e.clipboardData && e.clipboardData.setData('text/plain', ''); }catch(_){} }
  }, true));
  document.addEventListener('selectstart', e => { if(locked() && !isEditable(e.target)) e.preventDefault(); }, true);
  document.addEventListener('dragstart', e => { if(locked() && !isEditable(e.target)) e.preventDefault(); }, true);
})();

const TMS_NAV = (function(){
  const layers = [];                 // body-level overlays currently attached, oldest first
  let inTab = false, busy = false, busyTimer = 0, sched = false, tries = 0, exitUntil = 0, exiting = false;
  const isLayer = n => !!n && n.nodeType === 1 && (n.classList.contains('overlay') || n.classList.contains('drawer-overlay'));
  const stateN = () => { const s = history.state; return (s && s.tms === 1 && typeof s.n === 'number') ? s.n : null; };
  const want = () => 1 + (inTab ? 1 : 0) + layers.length;
  const userActive = () => { try{ return navigator.userActivation ? navigator.userActivation.hasBeenActive : true; }catch(e){ return true; } };
  const blocked = () => !!TMS_ACTIVE || !!(history.state && history.state.tmsGuard) || exiting || busy;

  function schedule(){ if(sched) return; sched = true; setTimeout(reconcile, 0); }
  function retry(){ if(tries++ < 25) setTimeout(()=>{ sched = false; schedule(); }, 150); }

  function reconcile(){
    sched = false;
    if(blocked()){ retry(); return; }
    tries = 0;
    let cur = stateN();
    if(cur === null){ try{ history.replaceState({ tms:1, n:0 }, '', location.href); cur = 0; }catch(e){ return; } }   // adopt the current entry as the base
    const w = want();
    if(cur < w){
      if(!userActive()) return;      // Chrome ignores history entries a page adds before any tap; wait for the first touch
      try{ for(let k = cur + 1; k <= w; k++) history.pushState({ tms:1, n:k }, '', location.href); }catch(e){}
    } else if(cur > w){
      busy = true; clearTimeout(busyTimer); busyTimer = setTimeout(()=>{ busy = false; schedule(); }, 600);
      try{ history.go(-(cur - w)); }catch(e){ busy = false; }
    }
  }

  function closeLayer(node){
    if(node.classList.contains('drawer-overlay')){ try{ closeDrawer(); }catch(e){} return; }
    if(node.classList.contains('tms-active')) return;
    const btn = node.querySelector('[data-no],[data-close],.sheet-close,#closePlayer,#closeTest,#closePdf,#closeRes,#eClose,#closeBatch,#closeDetail,#hubClose');
    if(btn && !btn.disabled){ btn.click(); return; }
    node.dispatchEvent(new MouseEvent('click', { bubbles:true }));     // backdrop-style close
    setTimeout(()=>{ if(document.body.contains(node)) node.remove(); }, 250);   // sheets with no close control at all
  }

  function onBack(){
    if(layers.length){ closeLayer(layers[layers.length - 1]); return; }
    if(inTab){
      if(STATE.screen === 'student') STATE.studentTab = 'dashboard'; else if(STATE.screen === 'admin') STATE.adminTab = 'home';
      renderScreen(); return;
    }
    const now = Date.now();
    if(now < exitUntil){                         // second Back within 2 s → really leave
      exiting = true; setTimeout(()=>{ exiting = false; schedule(); }, 800);
      try{ history.back(); }catch(e){}
      return;
    }
    exitUntil = now + 2000; toast('Press back again to exit');
  }

  window.addEventListener('popstate', ()=>{
    if(busy){ busy = false; clearTimeout(busyTimer); schedule(); return; }   // our own traversal landed
    if(TMS_ACTIVE) return;                                                  // a running test owns Back
    const n = stateN(); if(n === null) return;                              // not one of ours (e.g. the test guard)
    if(n < want()) onBack();
    schedule();
  });

  new MutationObserver(muts => {
    let changed = false;
    muts.forEach(m => {
      m.addedNodes.forEach(n => { if(isLayer(n) && layers.indexOf(n) < 0){ layers.push(n); changed = true; } });
      m.removedNodes.forEach(n => { const i = layers.indexOf(n); if(i >= 0){ layers.splice(i, 1); changed = true; } });
    });
    if(changed) schedule();
  }).observe(document.body, { childList:true });
  document.querySelectorAll('body > .overlay, body > .drawer-overlay').forEach(n => layers.push(n));
  document.addEventListener('pointerdown', ()=> schedule(), { capture:true, once:true });   // first tap unlocks history entries
  schedule();

  return { setTab(v){ if(inTab !== v){ inTab = v; schedule(); } } };
})();

/* Called at the end of every renderScreen(): keeps the history model and the copy lock in step with what is on screen. */
function tmsNavSync(){
  const s = STATE.screen;
  TMS_NAV.setTab(s === 'student' ? STATE.studentTab !== 'dashboard' : s === 'admin' ? STATE.adminTab !== 'home' : false);
  document.documentElement.classList.toggle('app-lock', s !== 'admin');
}

function renderScreen(){
  if(typeof clearUnsubs === 'function') clearUnsubs();
  const app = $('#app');
  app.innerHTML = '';
  try{
    if(STATE.screen === 'loading'){
      app.appendChild(el(`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center"><div class="spinner"></div></div>`));
    } else if(STATE.screen === 'auth'){
      app.appendChild(renderAuthScreen());
    } else if(STATE.screen === 'adminLogin'){
      app.appendChild(renderAdminLoginScreen());
    } else if(STATE.screen === 'student'){
      app.appendChild(renderStudentShell());
      tmsAfterLogin();   // Phase 1.2 — only a genuine page reload of an active test goes straight back into it
    } else if(STATE.screen === 'admin'){
      if(typeof renderAdminShell === 'function'){
        app.appendChild(renderAdminShell());
      } else {
        // First admin render of this page load: fetch admin.js once (students never do), then render again.
        app.appendChild(el(`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center"><div class="spinner"></div></div>`));
        loadAdminCode().then(()=>{ if(STATE.screen === 'admin') renderScreen(); }, adminCodeLoadFailed);
      }
    }
  }catch(renderErr){
    console.error('Render failed:', renderErr);
    app.innerHTML = '';
    app.appendChild(el(`
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center">
        <div>
          <div style="font-size:15px;font-weight:700;margin-bottom:8px">Something went wrong on this screen</div>
          <div style="font-size:12px;color:var(--text-muted);max-width:320px;margin:0 auto">${esc(renderErr && renderErr.message ? renderErr.message : 'Unknown error')}</div>
          <button class="btn btn-primary" style="margin-top:16px;width:auto;padding:10px 20px" id="recoverReloadBtn">↻ Reload app</button>
        </div>
      </div>
    `));
    const rb = $('#recoverReloadBtn', app);
    if(rb) rb.addEventListener('click', ()=> location.reload());
  }
  tmsNavSync();
}

  if(STATE.authMode === 'login'){
    const form = el(`
      <form id="loginForm">
        <div class="field"><label>Email</label><input type="email" id="liEmail" autocomplete="username" required placeholder="you@example.com"></div>

    `);
    form.addEventListener('submit', async e=>{
      e.preventDefault();
      STATE.authError = null;
      STATE.authNotice = null;
      errBox.classList.remove('show');

      try{
        await doLogin($('#liEmail',form).value.trim(), $('#liPass',form).value);
      }catch(err){
        const d = authErrorDisplay(err);
        STATE.authError = { screen:'auth', title:d.title, body:d.body };
        // Re-render explicitly rather than trusting the direct errBox update
        // below: a rejected login that also had to sign out (deactivated /
        // device-locked / not-found) triggers the auth-state listener's own
        // re-render too, and whichever of the two runs last would otherwise
        // win. STATE.authError is sticky, so however many renders happen,
        // the message stays visible until the next attempt.
        renderScreen();
        return;
      }
      btn.disabled = false; btn.textContent = 'Log in';
    });
    card.appendChild(form);

    const forgotLink = el(`<div class="auth-link" id="forgotPwLink" style="cursor:pointer">Forgot password?</div>`);
    let resetInFlight = false;
    forgotLink.addEventListener('click', async ()=>{
      if(resetInFlight) return;
      STATE.authError = null;
      STATE.authNotice = null;

      }

      forgotLink.textContent = 'Sending…';

      // never touches Firestore, so it can't affect the active device/session
      // lock in any way.

        await auth.sendPasswordResetEmail(email);
        STATE.authNotice = { screen:'auth', title:'Check your email', body:`We\u2019ve sent a password reset link to ${email}. Check your inbox (and spam folder).` };
      }catch(err){
        const d = authErrorDisplay(err);
        STATE.authError = { screen:'auth', title:d.title, body:d.body };
      }

    card.appendChild(el(`<div class="auth-link">New here? Tap Register above to create a free account.</div>`));
  } else {
    const form = el(`

        <div class="field"><label>Email *</label><input type="email" id="rEmail" required placeholder="you@example.com"></div>

          <div class="row2">
            <div class="field"><label>School</label><input type="text" id="rSchool" placeholder="School name"></div>
            <div class="field"><label>Date of birth</label><input type="date" id="rDob"></div>
          </div>
          <div class="row2">
            <div class="field"><label>Guardian name</label><input type="text" id="rGName" placeholder="Parent/guardian name"></div>
            <div class="field"><label>Guardian phone</label><input type="tel" id="rGPhone" placeholder="Guardian's number"></div>
          </div>
        </div>
        <button class="btn btn-primary" type="submit" id="regBtn" style="margin-top:4px">Create free account</button>
      </form>
    `);
    $('#optToggle', form).addEventListener('click', ()=>{
      $('#optFields', form).classList.toggle('show');
    });
    form.addEventListener('submit', async e=>{
      e.preventDefault();
      errBox.classList.remove('show');
      const nameCheck = validateFullName($('#rName',form).value);
      if(!nameCheck.ok){ errBox.textContent = nameCheck.error; errBox.classList.add('show'); return; }
      const emailCheck = validateEmail($('#rEmail',form).value);
      if(!emailCheck.ok){ errBox.textContent = emailCheck.error; errBox.classList.add('show'); return; }
      const phoneCheck = validateIndianMobile($('#rPhone',form).value);

      const name = nameCheck.value;

  }

  wrap.appendChild(el(`<div class="admin-link" id="adminLinkBtn">© 2026 Atomic Minds. All rights reserved.</div>`));
  wrap.querySelector('#adminLinkBtn').addEventListener('click', ()=>{
    STATE.screen = 'adminLogin';

function friendlyAuthError(err){
  const code = err && err.code || '';
  const map = {
    'auth/email-already-in-use':'This email is already registered — try logging in instead.',
    'auth/invalid-email':'Enter a valid email address.',
    'auth/weak-password':'Password must be at least 6 characters.',
    'auth/user-not-found':'No account found with this email.',
    'auth/wrong-password':'Incorrect password.',
    'auth/invalid-credential':'Incorrect email or password.',
    'auth/too-many-requests':'Too many attempts. Please wait a bit and try again.',
    'permission-denied':'Your account doesn\u2019t have permission for this yet \u2014 if you just set this up, make sure firestore.rules has been published in the Firebase console.'
  };
  return map[code] || (err && err.message) || 'Something went wrong. Please try again.';
}

/* Title+body version used by the login forms (student + admin), so a
   failure reads as a clear two-line message ("Login failed" / "Incorrect
   email or password.") inside the app's own error box — never a bare
   browser alert(), and never something a Chrome password-manager popup
   can be mistaken for. Our own hand-thrown errors (deactivated, device
   locked, account not found, etc.) already carry a ready-to-show
   err.title; anything else is matched by Firebase's auth/* error code. */
function authErrorDisplay(err){
  if(err && err.title){
    return { title: err.title, body: (err.message || '') };
  }
  const code = err && err.code || '';
  const map = {
    'auth/wrong-password':         { title:'Login failed', body:'Incorrect email or password.' },
    'auth/invalid-credential':     { title:'Login failed', body:'Incorrect email or password.' },
    'auth/user-not-found':         { title:'Account not found', body:'No account found with this email.' },
    'auth/invalid-email':          { title:'Login failed', body:'Enter a valid email address.' },
    'auth/user-disabled':          { title:'Account deactivated', body:'Your account has been deactivated. Please contact your teacher.' },
    'auth/too-many-requests':      { title:'Too many attempts', body:'Please wait a bit and try again.' },
    'auth/network-request-failed': { title:'Login temporarily unavailable', body:'Please check your internet connection and try again.' },
    'permission-denied':           { title:'Permission error', body:'Your account doesn\u2019t have permission for this yet \u2014 if you just set this up, make sure firestore.rules has been published in the Firebase console.' }
  };
  if(map[code]) return map[code];
  return { title:'Login failed', body:(err && err.message) || 'Something went wrong. Please try again.' };
}

/* ================================================================
   6) AUTH ACTIONS
   ----------------------------------------------------------------
   ACTIVE-SESSION SYSTEM (one student device at a time)
   Replaces the old permanent "deviceId lock" with an explicit claim:
     students/{uid}.activeSessionId   — random id for the current login
     students/{uid}.activeDeviceId    — which browser/device holds it
     students/{uid}.sessionStartedAt  — server timestamp, informational
   The session stays active until the student explicitly logs out, or an
   admin uses Reset Device — there is NO stale-session timeout and NO
   heartbeat. A forgotten-open browser is only ever freed up by Reset
   Device, by design. The old "deviceId" field is left in place for
   backward compatibility but is no longer read as a lock anywhere.
   ================================================================ */
function newSessionId(){
  return 'sess_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
}

/* This browser tab's record of which session it currently holds, so a
   page reload can tell "is the lock still mine?" without guessing, and a
   logout can avoid ever clearing a session it doesn't own. Kept in
   sessionStorage (per-tab, cleared when the tab/window closes) rather
   than localStorage, deliberately: it should NOT survive into a brand
   new tab the way the device id does. */
function getLocalSessionId(){
  try{ return sessionStorage.getItem('am_session_id') || null; }
  catch(e){ return CURRENT_SESSION_ID; }
}
function setLocalSessionId(id){
  try{
    if(id) sessionStorage.setItem('am_session_id', id);
    else sessionStorage.removeItem('am_session_id');
  }catch(e){ console.error('[session] sessionStorage unavailable (non-blocking):', e); }
}

/* Attempts to claim (or silently confirm) this device's exclusive active
   session for a student, inside a Firestore transaction so two
   near-simultaneous logins on different devices can't both succeed.
   - If a DIFFERENT device already holds the session, throws
     { code:'device-locked', message } — the one real, intended block.
     There is no staleness check — only an explicit logout or an admin
     Reset Device ever frees this up.
   - If the same device already holds it (another tab, or resuming after
     the browser was fully closed), or there's no active session at all
     (including old documents that don't have these fields yet), claims
     it for this device and returns its id.
   Returns the session id this device now holds. */
async function claimStudentSession(uid, myDevice){
  const ref = db.collection(COL.students).doc(uid);
  return db.runTransaction(async (tx) => {
    const snap = await tx.get(ref);
    if(!snap.exists){
      throw { code:'', title:'Account not found', message:'Student record not found.' };
    }
    const data = snap.data();
    const sameDevice = !!data.activeDeviceId && data.activeDeviceId === myDevice;

    if(data.activeSessionId && !sameDevice){
      throw { code:'device-locked', title:'Already logged in on another device', message:'This account is currently logged in on another device. Please log out from that device first, or ask your teacher to reset your device.' };
    }
    if(sameDevice && data.activeSessionId){
      // Already this device's session (a second tab, or resuming after a
      // reload) — nothing to change.
      return data.activeSessionId;
    }
    // No active session at all — claim it fresh. This also auto-migrates
    // old student documents that never had these fields.
    const sid = newSessionId();
    tx.update(ref, {
      activeSessionId: sid,
      activeDeviceId: myDevice,
      sessionStartedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    return sid;
  });
}

/* Clears the active-session fields ONLY if they still belong to this
   browser/session — never another device's, and never a different tab's
   newer claim on the same device. Never throws (logout must always be
   able to proceed even if this fails). */
async function releaseStudentSession(uid, myKnownSessionId){
  if(!myKnownSessionId) return;
  try{
    await db.runTransaction(async (tx) => {
      const ref = db.collection(COL.students).doc(uid);
      const snap = await tx.get(ref);
      if(!snap.exists) return;
      const data = snap.data();
      if(data.activeSessionId && data.activeSessionId === myKnownSessionId){
        tx.update(ref, {
          activeSessionId: '', activeDeviceId: '', sessionStartedAt: null
        });
      }
      // else: a different device/tab now owns the session — leave it alone.
    });
  }catch(e){
    console.error('[session] failed to release session on logout (non-blocking):', e);
  }
}

async function doRegister(data){
  const cred = await auth.createUserWithEmailAndPassword(data.email, data.password);
  const uid = cred.user.uid;
  await db.collection(COL.students).doc(uid).set({
    fullName: data.fullName,
    email: data.email,
    phone: data.phone,
    class: data.class || '',
    batch: data.batch || '',
    address: data.address || '',
    school: data.school || '',
    dob: data.dob || '',
    guardianName: data.guardianName || '',
    guardianPhone: data.guardianPhone || '',
    membership: 'free',
    membershipExpiry: null,
    active: true,
    deviceId: getDeviceId(),
    activeBatchIds: [GENERAL_BATCH_ID],
    watchMinutes: 0,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  // Sign back out immediately rather than silently auto-logging them in —
  // show a clear success message and send them to the Log in tab instead.
  // (Flags are set *before* signOut() because the auth-state listener's
  // re-render can fire while signOut() is still resolving.)
  STATE.authMode = 'login';
  STATE.justRegistered = true;
  await auth.signOut();
}

async function doLogin(email, password){
  LOGIN_IN_PROGRESS = true;
  try{
    const cred = await auth.signInWithEmailAndPassword(email, password);
    const uid = cred.user.uid;
    let doc;
    try{
      doc = await db.collection(COL.students).doc(uid).get();
    }catch(fetchErr){
      console.error('[login] could not load student record:', fetchErr);
      await auth.signOut();
      throw { code:'', title:'Login temporarily unavailable', message:'Please check your internet connection and try again.' };
    }
    if(!doc.exists){
      console.error('[login] signed in OK but no students/'+uid+' document exists.');
      await auth.signOut();
      throw { code:'', title:'Account not found', message:'No student account was found for this login. Are you trying the admin login instead?' };
    }
    const data = doc.data();
    if(data.active === false){
      await auth.signOut();
      const reasonSuffix = data.deactivationReason ? ` Reason: ${data.deactivationReason}` : '';
      throw { code:'', title:'Account deactivated', message:`Your account has been deactivated.${reasonSuffix} Please contact your teacher.` };
    }
    // Active-session (one-device) check — hardened the same way the old
    // device-lock check was: only a CONFIRMED conflicting session on
    // another device blocks login. A problem with the check itself
    // (offline, a failed transaction) must never lock a legitimate
    // student out, so it's logged and the login is allowed through.
    const myDevice = getDeviceId();
    try{
      const sid = await claimStudentSession(uid, myDevice);
      CURRENT_SESSION_ID = sid;
      setLocalSessionId(sid);
    }catch(sessionErr){
      if(sessionErr && sessionErr.code === 'device-locked'){
        await auth.signOut();
        throw { code:'', title:'Already logged in on another device', message: sessionErr.message };
      }
      console.error('[session] claim failed unexpectedly, allowing login anyway:', sessionErr);
      CURRENT_SESSION_ID = null;
      setLocalSessionId(null);
    }
    // Route straight to the dashboard ourselves, rather than waiting on
    // onAuthStateChanged, so a deactivated or device-locked account can
    // never flash the dashboard for an instant before being signed back out.
    CURRENT_USER = cred.user;
    CURRENT_ROLE = 'student';
    CURRENT_PROFILE = data;
    STATE.screen = 'student';
    renderScreen();
    startAnnouncementNotifications();
  } finally {
    LOGIN_IN_PROGRESS = false;
  }
}

async function doAdminLogin(email, password){
  const cred = await auth.signInWithEmailAndPassword(email, password);
  const uid = cred.user.uid;
  const doc = await db.collection(COL.admins).doc(uid).get();
  if(!doc.exists){
    await auth.signOut();
    throw { code:'', title:'Not authorized', message:'This account is not authorized as admin.' };
  }
  // onAuthStateChanged will pick this up and route to the admin app.
}

async function doLogout(){
  const user = auth.currentUser;
  if(user && CURRENT_ROLE === 'student'){
    await releaseStudentSession(user.uid, CURRENT_SESSION_ID || getLocalSessionId());
  }
  CURRENT_SESSION_ID = null;
  setLocalSessionId(null);
  stopAnnouncementNotifications();
  auth.signOut();
}

/* ================================================================
   BROWSER NOTIFICATIONS (Phase H)
   ----------------------------------------------------------------
   Foreground-only, Firestore-listener-driven browser notifications.
   No FCM, no push server, no service worker involved — deliberately:
   this only ever fires while the TMS tab is open and this listener is
   live (same lifetime as every other real-time feature in this app),
   so a plain page-level Notification works for both showing and
   click-handling (its own onclick just focuses this window — see
   showAnnouncementNotification()). This app has no URL router, so
   "focus the TMS" is the full extent of the click destination, which
   is explicitly an acceptable outcome for a single-page app like this
   one. (service-worker.js itself was not part of this change — see
   the phase report for why extending it wasn't necessary here.)

   Lifecycle: started once per login (doLogin() and the resumed-session
   branches of onAuthStateChanged() below both call
   startAnnouncementNotifications(), which is idempotent), stopped on
   doLogout() and on the top-level "signed out" branch of
   onAuthStateChanged() — so it also stops for every OTHER sign-out
   path (deactivated, device-locked, deleted student), without having
   to duplicate the stop call in each of those branches individually.
   Deliberately NOT registered via trackUnsub()/clearUnsubs(): those
   are torn down and rebuilt on every single tab switch (see
   renderScreen()), which would otherwise silently kill this listener
   the moment a student opened, say, the Classes tab.
   ================================================================ */
let NOTIF_UNSUB = null;

function notificationSupport(){ return 'Notification' in window; }

/* Only ever called from the explicit "Enable Notifications" button in
   Settings (Part C) — never on page load / login, so a student is
   never prompted just for opening the app. Never re-prompts once
   denied — the browser wouldn't show a popup for that anyway, but this
   also skips the pointless call entirely and just reports the state. */
async function requestNotificationPermission(){
  if(!notificationSupport()) return 'unsupported';
  if(Notification.permission === 'granted') return 'granted';
  if(Notification.permission === 'denied') return 'denied';
  try{ return await Notification.requestPermission(); }
  catch(e){ console.error('[notifications] permission request failed:', e); return Notification.permission; }
}

/* Shows one native browser notification for a newly-received
   announcement — never for the initial/already-seen backlog, see
   startAnnouncementNotifications(). Suppressed while the tab is the
   one the student is actively looking at (Part J): the in-app
   announcement UI already covers that case, so a browser notification
   on top would just be a redundant duplicate, not a missed one.

   Displays via the existing Service Worker registration's
   registration.showNotification() rather than the page-level
   `new Notification(...)` constructor — Android Chrome / an installed
   Android PWA rejects that constructor outright ("Illegal constructor").
   service-worker.js itself is untouched — this only calls the standard
   showNotification() API on the registration index.html already
   creates via navigator.serviceWorker.register('service-worker.js').
   Click handling is not wired up (would need a notificationclick
   listener inside service-worker.js) — clicking a shown notification
   currently does nothing.

   Known limitation (confirmed via diagnostic testing, not a bug in
   this function): Android may freeze a backgrounded tab's JavaScript
   after a period, which pauses the Firestore listener below along with
   everything else on the page. Without FCM/server-side push — out of
   scope for this Spark-plan, no-backend project — there is no way to
   keep that listener alive or wake it from here while the tab is
   frozen; it resumes and catches up once the tab is foregrounded again. */
function showAnnouncementNotification(a){
  if(!notificationSupport() || Notification.permission !== 'granted') return;
  if(document.visibilityState === 'visible') return;
  if(!('serviceWorker' in navigator)){
    // Same fallback shape as the existing SW-registration guard elsewhere
    // in this file — a browser with Notification support but no Service
    // Worker support is effectively theoretical for this app's targets,
    // but bail cleanly rather than let navigator.serviceWorker throw.
    return;
  }
  // Concise, non-personal content: fixed app title + a short one-line preview of the announcement.
  const raw = String(a.message || a.title || '').replace(/\s+/g,' ').trim();
  const clipped = raw.length > 110 ? (raw.slice(0,107) + '\u2026') : raw;
  const title = 'Atomic Minds';
  const body = 'New announcement' + (clipped ? (': ' + clipped) : '');
  navigator.serviceWorker.ready
    .then(registration => registration.showNotification(title, {
      body,
      icon: 'icon-192.png',                 // same cached static asset the app already ships
      data: { announcementId: a.id },       // read by the service worker's notificationclick handler
      tag: 'ann-' + a.id // same id -> same OS notification slot; belt-and-suspenders against a duplicate ever stacking
    }))
    .catch(error => console.error('[notifications] could not show notification:', error));
}

/* Idempotent — safe to call from both doLogin() and a resumed session
   without double-attaching (NOTIF_UNSUB already set = already running).
   Runs regardless of current Notification.permission: the listener
   itself is just the same Firestore read every other tab already does,
   and showAnnouncementNotification() is what actually gates on
   permission — kept this way so a student who enables notifications
   mid-session (Settings tab) starts getting them immediately, with
   nothing here needing to notice that change or restart anything. */
/* ----------------------------------------------------------------
   HOME DATA HUB (Dashboard "What's Next" + Calendar "Upcoming Class")
   ----------------------------------------------------------------
   One session-scoped set of listeners, started/stopped together with the
   announcement listener below (same lifetime, same reason for NOT using
   trackUnsub(): renderScreen() tears those down on every tab switch, which
   would re-read everything each time the student returns to the Dashboard).
   - announcements: NOT a second listener — HOME.ann is fed by the existing
     announcement listener in startAnnouncementNotifications().
   - oneTime / rules: classSchedules (today .. +HOME_LOOKAHEAD_DAYS, same
     query shape + index as the Calendar) and active classScheduleRules
     (expanded client-side by expandRuleOccurrences(), never stored).
   - liveTests: tests of type 'live' only (equality filter on top of the
     batchId 'in' filter — same shape as announcements/rules, no new index).
   Every query is constrained to the rule-verified id list from
   syncAndGetMyBatchIds(); firestore.rules re-checks it server-side. The
   Dashboard batch selector only NARROWS what is shown (client-side, via
   selectedContentIds()) — it never widens or authorizes anything. */
const HOME_LOOKAHEAD_DAYS = 60;
const WN_CLASS_WINDOW_MS = 36*3600*1000;   // "What's Next" surfaces a class starting within 36h (or already running)
const WN_TEST_WINDOW_MS  = 72*3600*1000;   // ...and a Live test starting within 72h
const HOME = { batchIds:[], ann:null, oneTime:null, rules:null, liveTests:null, unsubs:[], subs:new Set() };
const ANN_READ_SUBS = new Set();
function homeEmit(){ Array.from(HOME.subs).forEach(fn=>{ try{ fn(); }catch(e){ console.error('[home] subscriber failed:', e); } }); }
function homeSubscribe(fn){ HOME.subs.add(fn); return ()=>{ HOME.subs.delete(fn); }; }
function annReadEmit(){ Array.from(ANN_READ_SUBS).forEach(fn=>{ try{ fn(); }catch(e){ console.error('[announcements] read subscriber failed:', e); } }); }
function annReadSubscribe(fn){ ANN_READ_SUBS.add(fn); return ()=>{ ANN_READ_SUBS.delete(fn); }; }
function homeReady(){ return HOME.ann !== null && HOME.oneTime !== null && HOME.rules !== null && HOME.liveTests !== null; }

function startHomeDataListeners(ids){
  stopHomeDataListeners();
  HOME.batchIds = ids.slice();
  const t = new Date();
  const today = todayYMD();
  const h = new Date(t.getFullYear(), t.getMonth(), t.getDate() + HOME_LOOKAHEAD_DAYS);
  const horizon = ymd(h.getFullYear(), h.getMonth(), h.getDate());
  // A failed listener must not leave the Dashboard spinning forever: treat it as "nothing to show".
  const fail = key => err => { console.error('[home] ' + key + ' listener failed:', err); if(HOME[key] === null) HOME[key] = []; homeEmit(); };
  HOME.unsubs.push(listenScheduleByBatchIds(ids, today, horizon, items=>{ HOME.oneTime = items; homeEmit(); }, fail('oneTime')));
  HOME.unsubs.push(listenContentByBatchIds(COL.classScheduleRules, ids, {field:'status', value:'active'}, items=>{ HOME.rules = items; homeEmit(); }, fail('rules')));
  HOME.unsubs.push(listenContentByBatchIds(COL.tests, ids, {field:'type', value:'live'}, items=>{ HOME.liveTests = items; homeEmit(); }, fail('liveTests')));
}
function stopHomeDataListeners(){
  HOME.unsubs.forEach(u=>{ try{ u(); }catch(e){} });
  HOME.unsubs = [];
  HOME.batchIds = []; HOME.ann = null; HOME.oneTime = null; HOME.rules = null; HOME.liveTests = null;
}

function schedMs(dateStr, hhmm, fallback){
  const d = String(dateStr||'').split('-').map(Number);
  const t = String(hhmm || fallback || '').split(':').map(Number);
  if(d.length !== 3 || d.some(isNaN) || t.length < 2 || t.some(isNaN)) return NaN;
  return new Date(d[0], d[1]-1, d[2], t[0], t[1]).getTime();
}
function fmtClock12(hhmm){
  const m = /^(\d{1,2}):(\d{2})/.exec(hhmm || '');
  if(!m) return '';
  let hh = Number(m[1]); const ap = hh >= 12 ? 'PM' : 'AM'; hh = hh % 12 || 12;
  return hh + ':' + m[2] + ' ' + ap;
}
function homeDayLabel(dateStr){
  const t = new Date();
  if(dateStr === todayYMD()) return 'Today';
  const tm = new Date(t.getFullYear(), t.getMonth(), t.getDate()+1);
  if(dateStr === ymd(tm.getFullYear(), tm.getMonth(), tm.getDate())) return 'Tomorrow';
  const d = String(dateStr||'').split('-').map(Number);
  if(d.length !== 3 || d.some(isNaN)) return String(dateStr||'');
  return new Date(d[0], d[1]-1, d[2]).toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'});
}
function homeWhenLabel(ms){
  const d = new Date(ms);
  return homeDayLabel(ymd(d.getFullYear(), d.getMonth(), d.getDate())) + ' \u00b7 ' + fmtClock12(pad2(d.getHours()) + ':' + pad2(d.getMinutes()));
}
// Client-side VIEW scope only (selected batch + General Demo) over data the rules already authorized.
function homeScopeSet(){ return new Set(selectedContentIds(HOME.batchIds)); }

// One-time classes + expanded recurring occurrences (cancelled ones dropped; reschedules/overrides are
// already resolved by expandRuleOccurrences()) with real start/end timestamps.
function homeClassOccurrences(){
  const t = new Date(), today = todayYMD();
  const h = new Date(t.getFullYear(), t.getMonth(), t.getDate() + HOME_LOOKAHEAD_DAYS);
  const horizon = ymd(h.getFullYear(), h.getMonth(), h.getDate());
  const scope = homeScopeSet();
  const out = [];
  (HOME.oneTime || []).forEach(c=>{
    if(scope.has(c.batchId) && c.status !== 'cancelled' && c.date >= today && c.date <= horizon) out.push(c);
  });
  (HOME.rules || []).forEach(r=>{
    if(!scope.has(r.batchId)) return;
    expandRuleOccurrences(r, today, horizon).forEach(o=>{ if(o.status !== 'cancelled') out.push(o); });
  });
  return out
    .map(c=>({ c, startMs: schedMs(c.date, c.startTime, '00:00'), endMs: schedMs(c.date, c.endTime, '23:59') }))
    .filter(x=> !isNaN(x.startMs) && !isNaN(x.endMs));
}
// includeOngoing: also count a class that has started but not ended yet. withinMs: optional start-time horizon.
function homeNextClass(opts){
  opts = opts || {};
  const now = Date.now();
  let best = null;
  homeClassOccurrences().forEach(x=>{
    if(!(opts.includeOngoing ? x.endMs > now : x.startMs > now)) return;
    if(opts.withinMs != null && x.startMs > now + opts.withinMs) return;
    if(!best || x.startMs < best.startMs) best = x;
  });
  return best;
}
function homeNextLiveTest(withinMs){
  const now = Date.now(), scope = homeScopeSet();
  let best = null;
  (HOME.liveTests || []).forEach(t=>{
    if(!scope.has(t.batchId) || testKind(t) !== 'live') return;
    if(t.active === false) return;   // deactivated tests never show here (same client-side layer the Tests tab already has; Firestore rules cannot filter a query's results)
    const s = tsToMs(t.liveStartAt);
    if(s == null || s <= now) return;
    if(withinMs != null && s > now + withinMs) return;
    if(!best || s < best.startMs) best = { t, startMs:s };
  });
  return best;
}
// Newest first. Unread = not in students/{uid}.readAnnouncementIds (the existing read-state).
function homeUnreadAnnouncements(){
  const read = new Set((CURRENT_PROFILE && CURRENT_PROFILE.readAnnouncementIds) || []);
  return (HOME.ann || []).filter(a=> !read.has(a.id))
    .sort((a,b)=> (tsToMs(b.createdAt)||0) - (tsToMs(a.createdAt)||0));
}
// Last recorded class opened on THIS device (localStorage only), keyed per student AND per batch:
// a student in several batches keeps one independent "Continue Learning" item for each, and the
// Dashboard only ever reads the slot of the batch currently selected (view scope, never authorization).
function learnKey(uid, batchId){ return 'tms:lastLearning:' + uid + ':' + batchId; }

let NOTIF_GEN = 0;   // bumped on every start/stop, so a slow batch-id lookup that resolves after a logout can't attach listeners for a signed-out session
function startAnnouncementNotifications(){
  if(NOTIF_UNSUB) return;
  const gen = ++NOTIF_GEN;
  let seenIds = null; // null = first snapshot not processed yet
  syncAndGetMyBatchIds().then(ids=>{
    if(gen !== NOTIF_GEN || !ids.length || NOTIF_UNSUB) return; // logged out (or already started elsewhere) while this was resolving
    NOTIF_UNSUB = listenContentByBatchIds(COL.announcements, ids, {field:'active', value:true}, items=>{
      HOME.ann = items; homeEmit();   // Dashboard "What's Next" reuses this same listener's data — no second announcement listener
      if(seenIds === null){
        // First delivery after (re)attaching is the existing backlog, not
        // "new" — mark it all seen and never notify for it (Part G).
        seenIds = new Set(items.map(a=>a.id));
        return;
      }
      items.forEach(a=>{
        if(seenIds.has(a.id)) return; // already-known doc re-delivered — reconnect/metadata-only change/etc. (Part F)
        seenIds.add(a.id);
        showAnnouncementNotification(a);
      });
    }, err=>{
      console.error('[notifications] announcement listener failed:', err);
      if(HOME.ann === null){ HOME.ann = []; homeEmit(); }
    });
    startHomeDataListeners(ids);
  }).catch(e=> console.error('[notifications] could not start:', e));
}

function stopAnnouncementNotifications(){
  NOTIF_GEN++;
  if(NOTIF_UNSUB){ try{ NOTIF_UNSUB(); }catch(e){} NOTIF_UNSUB = null; }
  stopHomeDataListeners();
}

/* ================================================================
   7) AUTH STATE LISTENER — decides which screen to show
   ================================================================ */
auth.onAuthStateChanged(async (user) => {
  CURRENT_USER = user;
  if(!user){
    CURRENT_PROFILE = null; CURRENT_ROLE = null;
    CURRENT_SESSION_ID = null;
    STUDENT_SELECTED_BATCH_ID = null; // Phase I: never let one student's view-filter selection leak into the next login on this device
    stopAnnouncementNotifications();
    STATE.screen = 'auth';
    renderScreen();
    return;
  }
  if(LOGIN_IN_PROGRESS){
    // doLogin() is actively validating this exact sign-in and will route
    // to the right screen itself once it finishes — skip here so a
    // not-yet-approved login can never flash the dashboard before being
    // signed back out (see doLogin above).
    return;
  }
  try{
    const adminDoc = await db.collection(COL.admins).doc(user.uid).get();
    if(adminDoc.exists){
      CURRENT_ROLE = 'admin';
      CURRENT_PROFILE = adminDoc.data();
      STATE.screen = 'admin';
      renderScreen();
      return;
    }
    const studentDoc = await db.collection(COL.students).doc(user.uid).get();
    if(studentDoc.exists && studentDoc.data().active !== false){
      const data = studentDoc.data();
      // A resumed session (page load/reload, or the PWA waking back up,
      // not a fresh password login — doLogin already handled that case
      // above). Confirm this device still legitimately holds the active
      // session before letting it back into the dashboard.
      const myDevice = getDeviceId();
      try{
        const sid = await claimStudentSession(user.uid, myDevice);
        CURRENT_SESSION_ID = sid;
        setLocalSessionId(sid);
        CURRENT_ROLE = 'student';
        CURRENT_PROFILE = data;
        STATE.screen = 'student';
        renderScreen();
        startAnnouncementNotifications();
      }catch(sessionErr){
        if(sessionErr && sessionErr.code === 'device-locked'){
          CURRENT_SESSION_ID = null; setLocalSessionId(null);
          toast('Logged out — this account signed in on another device.');
          await auth.signOut();
        }else{
          console.error('[session] resume check failed, allowing session anyway:', sessionErr);
          CURRENT_ROLE = 'student';
          CURRENT_PROFILE = data;
          STATE.screen = 'student';
          renderScreen();
          startAnnouncementNotifications();
        }
      }
      return;
    }
    // Neither admin nor active student — bounce back to login.
    if(!studentDoc.exists){
      // Permanent Delete case: the Firebase Auth account still works, but
      // its students/{uid} profile is gone. Never auto-recreate it —
      // just reject and tell them why, same as a fresh doLogin() attempt
      // against a missing doc already does.
      toast('This student account is no longer registered. Please contact the administrator.');
    }
    await auth.signOut();
  }catch(e){
    console.error(e);
    await auth.signOut();
  }
});

/* ================================================================
   8) LIVE-LISTENER CLEANUP
   ----------------------------------------------------------------
   Every onSnapshot() started while building a screen is registered
   here, and cleared right before the next full re-render — so
   switching tabs never leaves old Firestore listeners running.
   ================================================================ */
STATE.unsubs = [];
function trackUnsub(fn){ STATE.unsubs.push(fn); }
function clearUnsubs(){ STATE.unsubs.forEach(u=>{ try{ u(); }catch(e){} }); STATE.unsubs = []; }

function renderDashContinueLearning(container){
  if(!CURRENT_USER) return;
  // Stable slot so the section can repaint in place (keeps its position between "What's Next" and the
  // banner). Repaints ride the same in-memory homeEmit() the batch selector and the enrollments
  // listener already fire — no new Firestore listener, no extra reads.
  const slot = el(`<div></div>`);
  container.appendChild(slot);
  let shownKey = null;
  function paint(){
    const batchId = STUDENT_SELECTED_BATCH_ID;          // view scope only; null until enrollments resolve -> show nothing yet
    const item = batchId ? tmsLsGet(learnKey(CURRENT_USER.uid, batchId)) : null;
    const valid = !!(item && item.type === 'recordedClass' && item.id && item.title && item.batchId === batchId);
    const key = valid ? (batchId + '|' + item.id) : '';
    if(key === shownKey) return;                          // nothing relevant changed — don't rebuild the card
    shownKey = key;
    slot.innerHTML = '';
    if(!valid) return;                                    // nothing valid for THIS batch -> render nothing at all
    const wrap = el(`<div>
      <div class="card-title" style="margin:4px 2px 8px">▶ Continue Learning</div>
      <div class="card">
        <div style="font-size:15px;font-weight:700">${esc(item.title)}</div>
        ${item.subject?`<div style="font-size:12.5px;color:var(--text-dim);margin-top:2px">${esc(item.subject)}</div>`:''}
        <button class="btn btn-primary" type="button" style="margin-top:12px">Continue →</button>
      </div>
    </div>`);
    const btn = $('button', wrap);
    function gone(){ tmsLsDel(learnKey(CURRENT_USER.uid, batchId)); paint(); toast('That class is no longer available'); }
    btn.addEventListener('click', async ()=>{
      btn.disabled = true;
      try{
        // The card itself is local-only (zero reads). Opening fetches the ONE video document, so
        // firestore.rules — not this stored pointer — decide whether the student may still watch it.
        const snap = await db.collection(COL.videos).doc(item.id).get();
        if(!snap.exists || snap.data().active === false){ gone(); return; } // deactivated by the teacher → same as removed
        openVideoPlayer({ id:snap.id, ...snap.data() });
        btn.disabled = false;
      }catch(err){
        if(err && err.code === 'permission-denied'){ gone(); return; }
        console.error('[continue-learning] could not open:', err);
        toast('Could not open — check your connection');
        btn.disabled = false;
      }
    });
    slot.appendChild(wrap);
  }
  trackUnsub(homeSubscribe(paint));
  paint();
}

/* Google Drive "share" links (drive.google.com/file/d/ID/view) are an
   HTML viewer page, not raw image bytes — a plain <img src> pointing at
   one simply never loads, which is exactly what was happening here even
   though the link itself opens fine in a browser tab. Converts a Drive
   share link (or a bare Drive file ID) to Drive's actual image-serving
   host; anything that isn't a Drive link passes through unchanged, so
   any other already-working direct image URL is untouched. Reuses
   driveIdFromUrl() (already used for Notes' Drive links below) rather
   than a second ID-parsing implementation. Called at render time, not
   save time, so it applies retroactively to banners already saved with
   a raw share link — no need to re-save existing banners. */
function resolveImageUrl(url){
  url = (url||'').trim();
  if(!url) return url;
  if(/drive\.google\.com/i.test(url)){
    const id = driveIdFromUrl(url);
    if(id) return 'https://lh3.googleusercontent.com/d/' + id;
  }
  return url;
}

/* ================================================================
   DASHBOARD PROMOTIONAL BANNER CAROUSEL
   ----------------------------------------------------------------
   Purely decorative — greetings, special-occasion messages, new-batch
   promos, etc. Deliberately kept SEPARATE from the Announcements
   system: no Phase H notification listener, no browser notification,
   no dedup/baseline logic — none of that machinery is touched by or
   even aware of this feature. General/everyone only, no batch
   targeting, so there's no syncAndGetMyBatchIds() dependency here —
   the Firestore Rule's isActiveStudent() check is the entire
   authorization, same shape as every other student-only read.

   Sorting by `order` happens client-side, not via a Firestore
   orderBy() — specifically so this query (a plain
   where('active','==',true)) never needs a composite index, the same
   lesson this project already learned the hard way with classSchedules.
   Auto-advance is a plain client-side setInterval driving scrollTo() —
   not a Firestore poll and not a session heartbeat; nothing here reads
   or writes Firestore on a timer, and the interval is torn down via
   trackUnsub() exactly like every other per-screen resource in this
   app, so it never survives a tab switch. */
function renderBannerCarousel(container){
  const wrap = el(`<div class="banner-carousel-wrap" style="display:none">
    <div class="banner-track"></div>
    <div class="banner-dots"></div>
  </div>`);
  container.appendChild(wrap);
  const track = $('.banner-track', wrap);
  const dotsBox = $('.banner-dots', wrap);

  let autoTimer = null;
  let userInteracting = false;
  let interactionResetTimer = null;
  function clearAuto(){ if(autoTimer){ clearInterval(autoTimer); autoTimer = null; } }
  trackUnsub(clearAuto);

  function slideStep(){
    return track.firstElementChild ? track.firstElementChild.getBoundingClientRect().width + 12 : 0; // +gap
  }
  function goTo(i){ track.scrollTo({left: i*slideStep(), behavior:'smooth'}); }

  const unsub = db.collection(COL.banners).where('active','==',true).onSnapshot(snap=>{
    const items = []; snap.forEach(d=> items.push({id:d.id, ...d.data()}));
    items.sort((a,b)=> (a.order||0) - (b.order||0));
    clearAuto();
    track.innerHTML = ''; dotsBox.innerHTML = '';
    if(!items.length){ wrap.style.display = 'none'; return; } // nothing to show — stay hidden rather than showing an empty frame
    wrap.style.display = '';
    items.forEach(b=>{
      track.appendChild(el(`<div class="banner-slide"><img src="${esc(resolveImageUrl(b.imageUrl))}" alt="" loading="lazy"></div>`));
    });
    if(items.length > 1){
      items.forEach((b,i)=> dotsBox.appendChild(el(`<span class="banner-dot${i===0?' active':''}" data-i="${i}"></span>`)));
      function updateDots(){
        const idx = Math.round(track.scrollLeft / slideStep());
        $all('.banner-dot', dotsBox).forEach((d,i)=> d.classList.toggle('active', i===idx));
      }
      track.addEventListener('scroll', ()=>{
        updateDots();
        clearTimeout(interactionResetTimer);
        userInteracting = true;
        interactionResetTimer = setTimeout(()=>{ userInteracting = false; }, 2500); // resume auto-advance a bit after the swipe settles
      });
      autoTimer = setInterval(()=>{
        if(userInteracting) return;
        const idx = Math.round(track.scrollLeft / slideStep());
        goTo((idx + 1) % items.length);
      }, 4500);
    }
  }, err=> console.error('[banners] listener failed:', err));
  trackUnsub(unsub);
}

/* Renders the "Select Batch" dropdown (only ever called when the
   student has 2+ real active batches — see renderDashboardTab()).
   Purely a view/filter control: changing it only updates
