/* ================================================================
   TEST ENGINE — Phase 1 (attempts · resume · history · Q-by-Q review)

   How the pieces fit:
   - tests/{id}            = the test DEFINITION (source of question content).
                             Questions are read from `questions` when present,
                             otherwise parsed out of the stored htmlContent
                             (see getTestDef()) — so every existing manual
                             test works without migration.
   - testAttempts/{uid}_{testId}_{n} = one small doc per LIVE/REGULAR attempt
                             (state + answers + score only, NO question text).
                             Created once on Start, updated once on Submit.
   - testResults/{attemptId} = compatibility summary row (same fields as
                             before + attemptId/attemptNumber/etc.).
   - Review = test definition + attempt.answers, combined in memory.
   - PRACTICE never touches Firestore; history lives in localStorage.
   - In-progress state (answers, seen, position) lives in localStorage
     ('tms:attempt:<attemptId>'); the timer is derived from the attempt's
     server startedAt, so refresh / reopen never resets it.
   ================================================================ */
const TEST_MAX_ATTEMPTS = 3;
const TEST_ATTEMPT_LABELS = ['Main Attempt', 'Reattempt 1', 'Reattempt 2'];

function tsToMs(ts){
  if(ts == null) return null;
  if(typeof ts === 'number') return ts;
  if(ts.toMillis) return ts.toMillis();
  if(ts.toDate) return ts.toDate().getTime();
  return null;
}
function fmtDateTime(ms){
  if(!ms) return '—';
  return new Date(ms).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function fmtMarks(x){ return String(Math.round((Number(x)||0)*100)/100); }
/* MM:SS / H:MM:SS duration formatter for the admin side (Results row/analytics) — mirrors the
   test player's own fmtDur() exactly, kept as a separate copy since the player runs inside an
   isolated iframe and can't share this scope. */
function fmtDurA(sec){
  sec = Math.max(0, Math.round(Number(sec)||0));
  const hh = Math.floor(sec/3600), mm = Math.floor((sec%3600)/60), ss = sec%60;
  const mmss = String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0');
  return hh>0 ? (hh+':'+mmss) : mmss;
}
/* Sums an attempt's per-question timeSpentSeconds, if present. Returns null (not 0) when no
   question in this attempt has any timing at all, so callers can show "No timing data" instead
   of a fabricated/misleading 00:00 for attempts submitted before this feature existed. */
function attemptTotalTime(a){
  if(!Array.isArray(a.answers)) return null;
  let sum = 0, has = false;
  a.answers.forEach(x=>{ if(x && x.timeSpentSeconds != null){ sum += Number(x.timeSpentSeconds)||0; has = true; } });
  return has ? sum : null;
}
function attemptLabel(n){ return TEST_ATTEMPT_LABELS[n-1] || ('Attempt '+n); }

// LIVE / REGULAR / PRACTICE. Stored value 'selfpaced' is REGULAR.
function testKind(t){
  const ty = t && t.type;
  if(ty === 'live') return 'live';
  if(ty === 'selfpaced' || ty === 'regular') return 'regular';
  return 'practice';
}
const TEST_KIND_META = {
  live:     { icon:'🔴', label:'Live' },
  regular:  { icon:'⏱', label:'Regular' },
  practice: { icon:'📚', label:'Practice' }
};

/* ---------- Tests library — shared filter helpers (Admin Published Tests / Results
   + Student Tests subject filter). Subjects are free-text per test document, so options
   are derived dynamically from whatever tests are already loaded (never a fresh query) and
   normalized case-insensitively so "chemistry" and "Chemistry" collapse into one filter. ---------- */
function normalizeSubjectKey(s){ return (s||'').trim().toLowerCase(); }
function uniqueSubjects(tests){
  const map = new Map(); // key -> first-seen display label
  (tests||[]).forEach(t=>{
    const raw = (t.subject||'').trim();
    if(!raw) return;
    const key = normalizeSubjectKey(raw);
    if(!map.has(key)) map.set(key, raw);
  });
  return Array.from(map.entries()).map(([key,label])=>({key,label})).sort((a,b)=> a.label.localeCompare(b.label));
}
/* Admin-only: batch filter options built from the tests actually published — reuses the
   existing batchId/batchName already stored on each test doc, no second batch system. */
function uniqueBatchesFromTests(tests){
  const map = new Map();
  (tests||[]).forEach(t=>{
    if(!t.batchId) return;
    const name = t.batchId === GENERAL_BATCH_ID ? 'Free Demo' : (t.batchName || t.batch || t.batchId);
    if(!map.has(t.batchId)) map.set(t.batchId, name);
  });
  return Array.from(map.entries()).map(([id,name])=>({id,name})).sort((a,b)=> a.name.localeCompare(b.name));
}
/* Client-side-only status badge for a Live test, derived from liveStartAt/liveEndAt —
   no new scheduling system, no periodic Firestore writes, just a read of already-loaded fields. */
function liveStatusBadge(t){
  if(testKind(t) !== 'live') return '';
  const s = tsToMs(t.liveStartAt), e = tsToMs(t.liveEndAt);
  if(s == null || e == null) return '<span class="badge badge-muted">No schedule set</span>';
  const now = Date.now();
  if(now < s) return '<span class="badge badge-accent">🗓 Scheduled</span>';
  if(now <= e) return '<span class="badge badge-live">🔴 Live Now</span>';
  return '<span class="badge badge-muted">Ended</span>';
}

function tmsErr(code, message, extra){ const e = new Error(message); e.tmsCode = code; e.extra = extra; return e; }

/* -------- localStorage helpers (never throw) -------- */
function tmsLsGet(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function tmsLsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
function tmsLsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
const tmsAttemptKey  = id => 'tms:attempt:' + id;
const tmsPracticeKey = testId => 'tms:practice:' + CURRENT_USER.uid + ':' + testId;

function tmsCleanAnswers(arr, n){
  const out = new Array(n).fill(null);
  if(Array.isArray(arr)) for(let i=0;i<n;i++){ const v = arr[i]; if(Number.isInteger(v) && v>=0 && v<=3) out[i] = v; }
  return out;
}
function tmsCleanSeen(arr, n, answers){
  const out = new Array(n).fill(false);
  for(let i=0;i<n;i++) out[i] = !!(Array.isArray(arr) && arr[i]) || answers[i] != null;
  return out;
}
/* Per-question active time (seconds), local-only until final submission. Same shape/defaulting
   pattern as tmsCleanAnswers/tmsCleanSeen above: an older attempt or a corrupt/missing local
   record just comes back as all-zero, which the Review screen shows as a graceful 00:00 —
   never fabricated or estimated. */
function tmsCleanTimeSpent(arr, n){
  const out = new Array(n).fill(0);
  if(Array.isArray(arr)) for(let i=0;i<n;i++){ const v = Number(arr[i]); if(Number.isFinite(v) && v>=0) out[i] = Math.round(v); }
  return out;
}
/* Bookmark ("Mark for Revision") flags — a navigation aid only, never scored. Same local-only,
   same-shape-as-timeSpent handling: missing/corrupt data just comes back all-unmarked. */
function tmsCleanMarked(arr, n){
  const out = new Array(n).fill(false);
  if(Array.isArray(arr)) for(let i=0;i<n;i++) out[i] = !!arr[i];
  return out;
}

/* -------- test definition (questions + scoring + timing) --------
   Reads structured fields when they exist (questions, marksPerQuestion,
   negativeMarksPerQuestion, totalMarks, durationMinutes, per-question
   marks/negativeMarks). Falls back to what old manual tests carry:
   the QUESTIONS/CORRECT_MARK/WRONG_MARK constants inside htmlContent and
   the `duration` field. Tests whose HTML can't be parsed (pasted HTML)
   come back with engine:false and keep the legacy one-shot player. */
const _testDefCache = new Map();
function getTestDef(t){
  if(!t) return { engine:false };
  const sig = (t.htmlContent ? t.htmlContent.length : 0) + ':' + (Array.isArray(t.questions) ? t.questions.length : 0) +
              ':' + [t.marksPerQuestion, t.negativeMarksPerQuestion, t.totalMarks, t.durationMinutes, t.duration].join(',');
  const hit = _testDefCache.get(t.id);
  if(hit && hit.sig === sig) return hit.def;
  const def = buildTestDef(t);
  _testDefCache.set(t.id, { sig, def });
  return def;
}
function buildTestDef(t){
  let questions = null, parsedCorrect = null, parsedWrong = null;
  if(Array.isArray(t.questions) && t.questions.length){
    questions = t.questions;
  } else if(typeof t.htmlContent === 'string'){
    const m = t.htmlContent.match(/const QUESTIONS = (\[[\s\S]*?\]);\s*const CORRECT_MARK = (-?[\d.]+), WRONG_MARK = (-?[\d.]+);/);
    if(m){
      try{ questions = JSON.parse(m[1]); parsedCorrect = parseFloat(m[2]); parsedWrong = parseFloat(m[3]); }
      catch(e){ questions = null; }
    }
  }
  const valid = Array.isArray(questions) && questions.length > 0 && questions.every(q =>
    q && typeof q === 'object' && Array.isArray(q.options) && Number.isInteger(q.correct) && q.correct >= 0 && q.correct <= 3);
  if(!valid) return { engine:false };

  const perCorrect = typeof t.marksPerQuestion === 'number' ? t.marksPerQuestion : (parsedCorrect != null ? parsedCorrect : 1);
  let perWrong = 0;
  if(typeof t.negativeMarksPerQuestion === 'number') perWrong = -Math.abs(t.negativeMarksPerQuestion);
  else if(parsedWrong != null && typeof t.marksPerQuestion !== 'number') perWrong = parsedWrong;

  const def = {
    engine: true, questions, perCorrect, perWrong,
    durationMin: typeof t.durationMinutes === 'number' ? t.durationMinutes : (parseInt(t.duration, 10) || 0),
    layout: t.answerButtonLayout || 'grid2x2'
  };
  const sum = questions.reduce((s,q)=> s + (typeof q.marks === 'number' ? q.marks : perCorrect), 0);
  def.fullMarks = typeof t.totalMarks === 'number' ? t.totalMarks : Math.round(sum*100)/100;
  return def;
}
function playerMeta(t, def, durationMin){
  return { title: t.title || 'Test', subject: t.subject || '', correctMark: def.perCorrect, wrongMark: def.perWrong,
           duration: durationMin, answerButtonLayout: def.layout };
}

/* Score = marks for correct − deductions for wrong; unanswered = 0.
   Full marks come from the definition and are never reduced by negatives. */
function computeTestResult(def, answers){
  let correct = 0, wrong = 0, skipped = 0, score = 0;
  def.questions.forEach((q, i) => {
    const a = answers[i];
    if(a == null){ skipped++; return; }
    if(a === q.correct){ correct++; score += (typeof q.marks === 'number' ? q.marks : def.perCorrect); }
    else { wrong++; score += (typeof q.negativeMarks === 'number' ? -Math.abs(q.negativeMarks) : def.perWrong); }
  });
  return { score: Math.round(score*100)/100, total: def.fullMarks, correct, wrong, skipped, questionCount: def.questions.length };
}

/* Optional Live window (Phase 2 will add the admin fields liveStartAt /
   liveEndAt on the test doc). Absent = no restriction, so existing Live
   tests keep working. The same check is enforced server-side by
   firestore.rules using request.time when an attempt is created. */
function liveWindowState(t){
  if(testKind(t) !== 'live') return { open:true, configured:false };
  const s = tsToMs(t.liveStartAt), e = tsToMs(t.liveEndAt);
  if(s == null && e == null) return { open:true, configured:false };
  const now = Date.now();
  if(s != null && now < s) return { open:false, configured:true, start:s, end:e, msg:'This live test opens on ' + fmtDateTime(s) + '.' };
  if(e != null && now > e) return { open:false, configured:true, start:s, end:e, msg:'The start window for this live test closed on ' + fmtDateTime(e) + '.' };
  return { open:true, configured:true, start:s, end:e };
}

/* -------- Firestore attempt access -------- */
const attemptDocId = (uid, testId, n) => uid + '_' + testId + '_' + n;

async function fetchMyAttempts(testId){
  let q = db.collection(COL.testAttempts).where('studentId','==',CURRENT_USER.uid);
  if(testId) q = q.where('testId','==',testId);
  const snap = await q.get();
  const out = [];
  snap.forEach(d => out.push({ id:d.id, ...d.data() }));
  out.sort((a,b)=> (a.attemptNumber||0) - (b.attemptNumber||0));
  return out;
}

// Creates the ONE attempt doc for a new attempt. Firestore is authoritative:
// existing attempts are re-read from the server first, and the doc id
// (uid_testId_n) + rules make a duplicate or a 4th attempt impossible.
async function createNewAttempt(t, def){
  const uid = CURRENT_USER.uid;
  const list = await fetchMyAttempts(t.id);
  const inprog = list.find(a => a.status === 'in-progress');
  if(inprog) throw tmsErr('in-progress', 'You already have an unfinished attempt for this test.', inprog);
  if(list.length >= TEST_MAX_ATTEMPTS) throw tmsErr('limit', 'All ' + TEST_MAX_ATTEMPTS + ' attempts have been used.');
  const lw = liveWindowState(t);
  if(!lw.open) throw tmsErr('window', lw.msg);

  const attemptNumber = list.length + 1;
  const id = attemptDocId(uid, t.id, attemptNumber);
  const ref = db.collection(COL.testAttempts).doc(id);
  try{
    await ref.set({
      studentId: uid, testId: t.id, attemptNumber, status: 'in-progress',
      startedAt: firebase.firestore.FieldValue.serverTimestamp(),
      questionCount: def.questions.length
    });
  }catch(e){
    console.error('[test-engine] attempt create failed:', e);
    // Most likely cause is a race (another tab/device just created it) — reconcile.
    try{
      const again = await fetchMyAttempts(t.id);
      const ip = again.find(a => a.status === 'in-progress');
      if(ip) throw tmsErr('in-progress', 'You already have an unfinished attempt for this test.', ip);
    }catch(e2){ if(e2.tmsCode) throw e2; }
    throw tmsErr('denied', 'Could not start this attempt. The test may not be open right now, or you may not have access to it.');
  }
  const snap = await ref.get();
  const data = snap.data() || {};
  const startedMs = tsToMs(data.startedAt) || Date.now();
  return { attempt: { id, ...data, attemptNumber, status:'in-progress' }, startedMs, offset: startedMs - Date.now() };
}

// Completes the attempt exactly once (transaction re-checks status) and
// writes the compatibility summary row testResults/{attemptId}.
async function completeAttempt(t, def, attempt, answerDocs, result, kind){
  const uid = CURRENT_USER.uid;
  const aRef = db.collection(COL.testAttempts).doc(attempt.id);
  const rRef = db.collection(COL.testResults).doc(attempt.id);
  try{
    await db.runTransaction(async tx => {
      const snap = await tx.get(aRef);
      if(!snap.exists) throw tmsErr('missing', 'This attempt no longer exists.');
      const d = snap.data();
      if(d.studentId !== uid || d.testId !== t.id) throw tmsErr('mismatch', 'This attempt does not belong to you.');
      if(d.status !== 'in-progress') throw tmsErr('already-completed', 'This attempt was already submitted.', d);
      tx.update(aRef, {
        status: 'completed',
        submittedAt: firebase.firestore.FieldValue.serverTimestamp(),
        answers: answerDocs,
        score: result.score, correct: result.correct, wrong: result.wrong, skipped: result.skipped, total: result.total
      });
      tx.set(rRef, {
        testId: t.id, testTitle: t.title || '', studentId: uid, studentName: (CURRENT_PROFILE && CURRENT_PROFILE.fullName) || '',
        score: result.score, total: result.total, correct: result.correct, wrong: result.wrong, skipped: result.skipped,
        questionCount: result.questionCount, attemptId: attempt.id, attemptNumber: attempt.attemptNumber, testType: kind,
        submittedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    });
  }catch(e){
    if(e && e.tmsCode === 'already-completed'){
      return attemptToView({ id: attempt.id, ...e.extra }, def, {});
    }
    throw e;
  }
  return attemptToView({
    id: attempt.id, attemptNumber: attempt.attemptNumber, answers: answerDocs, submittedAt: Date.now(),
    score: result.score, total: result.total, correct: result.correct, wrong: result.wrong, skipped: result.skipped,
    questionCount: result.questionCount
  }, def, {});
}

/* -------- normalised "view" objects used by the review screen -------- */
function attemptToView(a, def, extra){
  extra = extra || {};
  return {
    kind: 'attempt', attemptNumber: a.attemptNumber || 0, label: attemptLabel(a.attemptNumber || 1),
    submittedAtMs: tsToMs(a.submittedAt), score: a.score, total: a.total, correct: a.correct, wrong: a.wrong, skipped: a.skipped,
    questionCount: a.questionCount || def.questions.length, answers: Array.isArray(a.answers) ? a.answers : [],
    studentName: extra.studentName || ''
  };
}
function practiceHistory(t){
  const h = tmsLsGet(tmsPracticeKey(t.id));
  return Array.isArray(h) ? h : [];
}
function practiceRecordToView(r, def){
  return { kind:'practice', attemptNumber:0, label:'Practice', submittedAtMs:r.submittedAtMs, score:r.score, total:r.total,
           correct:r.correct, wrong:r.wrong, skipped:r.skipped, questionCount:r.questionCount || def.questions.length,
           answers: r.answers || [], studentName:'' };
}

/* -------- full-screen frame shared by the player and the review -------- */
function openFullscreenFrame(title, subtitle){
  const overlay = el(`
    <div class="overlay open" style="align-items:stretch;justify-content:stretch">
      <div style="background:#0d1117;width:100%;height:100%;min-height:0;display:flex;flex-direction:column;
        padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)">
        <div class="tms-frame-bar" style="padding:10px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border-soft);flex-shrink:0">
          <button class="btn btn-ghost btn-sm" id="closeTest">${icon('close',15)}<span>Close</span></button>
          <div style="flex:1;min-width:0">
            <div style="font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(title||'')}</div>
            ${subtitle ? `<div style="font-size:10px;color:var(--text-dim)">${esc(subtitle)}</div>` : ''}
          </div>
        </div>
        <iframe id="testIframe" style="width:100%;flex:1 1 0;min-height:0;border:none;background:#0d1117"></iframe>
      </div>
    </div>`);
  document.body.appendChild(overlay);
  return { overlay, frame: $('#testIframe', overlay), closeBtn: $('#closeTest', overlay), bar: $('.tms-frame-bar', overlay) };
}

/* -------- review (student history, fresh result, admin) --------
   The answer key must never be reachable while a student has an attempt
   running (Phase 1.1): student callers are refused while TMS_ACTIVE is
   set for that test. Admin callers pass { admin:true }. */
function openAttemptReview(t, def, view, opts){
  opts = opts || {};
  if(!opts.admin && tmsReviewBlocked(t.id)){
    toast('Review is locked while a test attempt is in progress.');
    return;
  }
  const sub = view.studentName ? ('Student: ' + view.studentName + ' · ' + view.label) : view.label;
  const { overlay, frame, closeBtn } = openFullscreenFrame(t.title || 'Test', sub);
  const boot = { mode:'review', review:view, durationMin:0, fullMarks:def.fullMarks, perCorrect:def.perCorrect, perWrong:def.perWrong };
  frame.srcdoc = buildTestHTML(playerMeta(t, def, 0), def.questions, boot);
  closeBtn.addEventListener('click', () => { overlay.remove(); if(opts.onExit) opts.onExit(); });
}

/* Pre-publish preview (Manual Builder, Text Generator, Edit Test) — reuses the exact same
   fullscreen shell + buildTestHTML()/tmsPlayerMain() renderer as the real player and review, just
   with a THIRD boot mode ('preview') that never creates a testAttempts document, never opens the
   Start/Submit transaction path, and never touches launchTestPlayer's violation/fullscreen-lock/
   local-resume machinery at all — it is exactly as inert as opening a review, structurally.
   `draft` = { title, subject, questions, meta:{correctMark,wrongMark,duration,answerButtonLayout} },
   the same shape already collected by the builders before calling publishNormalizedTest(). */
function openTestPreview(draft){
  const meta = { title: draft.title || 'Untitled test', subject: draft.subject || '',
                 correctMark: draft.meta.correctMark, wrongMark: draft.meta.wrongMark,
                 duration: draft.meta.duration || 0, answerButtonLayout: draft.meta.answerButtonLayout };
  const fullMarks = Math.round((draft.questions.length * (draft.meta.correctMark||0)) * 100) / 100;
  const boot = { mode:'preview', durationMin: meta.duration, fullMarks,
                 perCorrect: draft.meta.correctMark, perWrong: -Math.abs(draft.meta.wrongMark||0) };
  const { overlay, frame, closeBtn } = openFullscreenFrame(meta.title, 'Preview \u2014 not a real attempt');
  frame.srcdoc = buildTestHTML(meta, draft.questions, boot);
  closeBtn.addEventListener('click', () => overlay.remove());
}

/* ================================================================
   ACTIVE TEST MODE (Phase 1.1, refined in 1.2) — Live / Regular attempts only
   While an attempt is in progress:
   - the player takes over the whole window (+ Fullscreen API where the
     browser allows it) and the Close bar is hidden;
   - the answer key (Review) is locked for that test — also while the
     student is on the Dashboard with an unfinished attempt;
   - Back / Refresh are intercepted as far as browsers permit;
   - each time the student LEAVES the page and comes back (visible ->
     hidden -> visible) that is ONE violation; a page reload is ONE
     violation (detected on the next load via Navigation Timing
     type === 'reload'). Each shows a RED warning that stays until OK,
     and the MAX_TEST_SCREEN_VIOLATIONS-th one really auto-submits.
   - closing the whole browser / PWA is NOT a violation: a violation is
     only counted when the page comes back, and a fresh (non-reload)
     load lands on the Dashboard with a "Resume Test" card.
   Everything here is local (memory + localStorage). The ONLY Firestore
   writes are still the Phase 1 lifecycle ones (create on Start, update
   on Submit). Practice never enters this mode.
   ================================================================ */
const MAX_TEST_SCREEN_VIOLATIONS = 4;   // detected "left the test screen" events; the 4th one auto-submits

let TMS_ACTIVE = null;                  // { testId, attemptId } while an attempt is running in this page
const TMS_SCREEN_KEY = 'tms:screen';    // { uid, attemptId, testId } while the test screen is showing; consumed by the next page load

// The student's unfinished (in-progress) attempts: feeds the Dashboard "Resume Test" card and the review lock.
let TMS_UNFINISHED = null;              // { uid, loaded, items:[{ attempt, test }] }
function tmsReviewBlocked(testId){
  if(TMS_ACTIVE && TMS_ACTIVE.testId === testId) return true;
  return !!(TMS_UNFINISHED && CURRENT_USER && TMS_UNFINISHED.uid === CURRENT_USER.uid &&
            TMS_UNFINISHED.items.some(i => i.attempt.testId === testId));
}

const TMS_WARN = {
  first: { title:'⚠️ WARNING — TEST IN PROGRESS',
           lines:['You left the test screen.', 'Stay on the test.', 'Repeated violations will AUTO-SUBMIT your test.'] },
  again: { title:'⚠️ WARNING — TEST IN PROGRESS',
           lines:['You left the test screen again.', 'Stay on the test.', 'Repeated violations will AUTO-SUBMIT your test.'] },
  last:  { title:'⚠️ WARNING — TEST IN PROGRESS',
           lines:['You left the test screen again.', MAX_TEST_SCREEN_VIOLATIONS + ' violations will AUTO-SUBMIT your test.'] },
  auto:  { title:'⚠️ TEST AUTO-SUBMITTED',
           lines:['Repeatedly leaving the test screen triggered automatic submission.'] },
  back:  { title:'⚠️ TEST IN PROGRESS',
           lines:['You are currently attempting a test.', 'Leaving this screen may interrupt your test.', 'Please stay on the test screen until you submit.'] }
};
const TMS_WARN_RANK = { back:1, first:2, again:3, last:4, auto:5 };
// violation #1 -> first · #2.. -> again · the one before the limit -> last · the limit itself -> auto-submit
function tmsViolationKind(count){
  if(count >= MAX_TEST_SCREEN_VIOLATIONS) return 'auto';
  if(count <= 1) return 'first';
  if(count === MAX_TEST_SCREEN_VIOLATIONS - 1) return 'last';
  return 'again';
}

// Red modal appended INSIDE the player overlay (so it also shows in fullscreen).
// No timeout, no backdrop-dismiss: it only closes when the student taps OK.
function tmsShowWarning(root, kind, onOk){
  const cfg = TMS_WARN[kind];
  const old = root.querySelector('.tms-warn');
  if(old){
    if((TMS_WARN_RANK[old.dataset.kind] || 0) > (TMS_WARN_RANK[kind] || 0)) return old;   // keep the more severe one
    old.remove();
  }
  const m = el(`<div class="tms-warn" data-kind="${kind}" role="alertdialog" aria-modal="true">
    <div class="tms-warn-card">
      <div class="tms-warn-title">${esc(cfg.title)}</div>
      ${cfg.lines.map(l => `<p>${esc(l)}</p>`).join('')}
      <button class="tms-warn-ok" type="button">OK</button>
    </div></div>`);
  root.appendChild(m);
  $('.tms-warn-ok', m).addEventListener('click', () => { m.remove(); if(onOk) onOk(kind); });
  return m;
}

const tmsFsElement = () => document.fullscreenElement || document.webkitFullscreenElement || null;
function tmsRequestFs(elm){
  /* Phase 2: the browser Fullscreen API is intentionally not used. On Android Chrome it triggers the
     browser's own "drag from the top to exit full screen" toast, which the app cannot control. The
     test stays immersive inside the app: the overlay covers the TMS navigation, and the Back guard,
     refresh handling, Wake Lock and violation counter are unchanged. */
  return false;
}
function tmsExitFs(){
  try{
    if(!tmsFsElement()) return;
    const fn = document.exitFullscreen || document.webkitExitFullscreen;
    if(fn){ const p = fn.call(document); if(p && p.catch) p.catch(() => {}); }
  }catch(e){}
}

/* -------- reload vs. close (what the previous page unload was) --------
   Navigation Timing reports type === 'reload' only for a real refresh /
   pull-to-refresh. Closing the browser or PWA and opening it again is a
   fresh 'navigate' (or 'back_forward' for a restored tab) — so we can tell
   the two apart on the NEXT load and never blame a student for closing the
   app. If the browser can't tell, we do not guess: it is not a reload. */
function tmsNavType(){
  try{
    const nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
    if(nav && nav.type) return nav.type;
    if(performance.navigation) return ['navigate','reload','back_forward','prerender'][performance.navigation.type] || 'unknown';
  }catch(e){}
  return 'unknown';
}
// The screen marker is consumed by every page load; it only turns into a pending
// "reload violation" when that load really is a reload.
let TMS_RELOAD_PENDING = (function(){
  const f = tmsLsGet(TMS_SCREEN_KEY);
  tmsLsDel(TMS_SCREEN_KEY);
  return (f && f.uid && f.attemptId && f.testId && tmsNavType() === 'reload') ? f : null;
})();

/* -------- unfinished attempts (Dashboard "Resume Test" + review lock) -------- */
async function tmsLoadUnfinished(force){
  if(!CURRENT_USER) return [];
  const uid = CURRENT_USER.uid;
  if(!force && TMS_UNFINISHED && TMS_UNFINISHED.uid === uid && TMS_UNFINISHED.loaded) return TMS_UNFINISHED.items;
  const snap = await db.collection(COL.testAttempts).where('studentId','==',uid).where('status','==','in-progress').get();
  const attempts = [];
  snap.forEach(d => attempts.push({ id:d.id, ...d.data() }));
  attempts.sort((a,b) => (a.attemptNumber||0) - (b.attemptNumber||0));
  const items = await Promise.all(attempts.map(async a => {
    let test = null;
    try{ const s = await db.collection(COL.tests).doc(a.testId).get(); if(s.exists) test = { id:s.id, ...s.data() }; }catch(e){}
    return { attempt:a, test };
  }));
  TMS_UNFINISHED = { uid, loaded:true, items };
  tmsPruneLocalAttempts(uid, new Set(attempts.map(a => a.id)));
  return items;
}
function tmsUnfinishedBucket(){
  const uid = CURRENT_USER.uid;
  if(!TMS_UNFINISHED || TMS_UNFINISHED.uid !== uid) TMS_UNFINISHED = { uid, loaded:false, items:[] };
  return TMS_UNFINISHED;
}
function tmsNoteUnfinished(attempt, test){
  const b = tmsUnfinishedBucket();
  b.items = b.items.filter(i => i.attempt.id !== attempt.id).concat([{ attempt, test }]);
}
function tmsDropUnfinished(attemptId){
  if(TMS_UNFINISHED) TMS_UNFINISHED.items = TMS_UNFINISHED.items.filter(i => i.attempt.id !== attemptId);
}
// keep the cache in step with a fresh per-test attempt list (hub / Tests tab)
function tmsSyncUnfinishedFromList(t, list){
  const b = tmsUnfinishedBucket();
  b.items = b.items.filter(i => i.attempt.testId !== t.id)
                   .concat(list.filter(a => a.status === 'in-progress').map(a => ({ attempt:a, test:t })));
}
// A local resume record is only meaningful while its attempt is still in progress on the server.
// Anything else (completed, or deleted by an admin) is dropped so stale state can never come back.
function tmsPruneLocalAttempts(uid, keepIds){
  try{
    const base = 'tms:attempt:', prefix = base + uid + '_', dead = [];
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(!k || k.indexOf(prefix) !== 0) continue;
      const id = k.slice(base.length);
      if(keepIds.has(id) || (TMS_ACTIVE && TMS_ACTIVE.attemptId === id)) continue;
      dead.push(k);
    }
    dead.forEach(k => localStorage.removeItem(k));
  }catch(e){}
}

// Re-opens a specific unfinished attempt (Dashboard "Resume Test" button, or the
// one-time return after a page reload). Firestore decides whether it still exists.
async function tmsResumeAttemptById(attemptId, testId, extra){
  if(!CURRENT_USER || TMS_ACTIVE) return false;
  try{
    const list = await fetchMyAttempts(testId);
    const a = list.find(x => x.id === attemptId && x.status === 'in-progress');
    if(!a){
      tmsDropUnfinished(attemptId); tmsLsDel(tmsAttemptKey(attemptId));
      toast('This attempt is no longer available.');
      if(STATE.screen === 'student') renderScreen();
      return false;
    }
    const tSnap = await db.collection(COL.tests).doc(testId).get();
    if(!tSnap.exists) return false;
    const t = { id: tSnap.id, ...tSnap.data() };
    const def = getTestDef(t);
    if(!def.engine || testKind(t) === 'practice') return false;
    return launchTestPlayer(t, def, Object.assign({
      attempt: a,
      onExit: () => { if(STATE.screen === 'student') renderScreen(); }
    }, extra || {}));
  }catch(e){
    console.error('[test-engine] resume failed:', e);
    // The expired-attempt auto-finish path (tmsPaintResumeCard) retries quietly on its own schedule —
    // a scary toast here would fire with no tap behind it, so it only shows for a real button tap.
    if(!(extra && extra.silentError)) toast('Could not resume — check your connection and try again.');
    return false;
  }
}

// True once an unfinished attempt's timer has already run out. Deliberately ignores the small local
// clock-offset correction the interactive player applies (that's for seconds of drift, not hours) —
// this only needs to be right to within a few seconds, since the player's own tick() is authoritative
// once it opens. Practice and untimed tests never expire this way.
function tmsAttemptExpired(attempt, test){
  if(!test) return false;
  const def = getTestDef(test);
  if(!def.engine || testKind(test) === 'practice' || !(def.durationMin > 0)) return false;
  const startedMs = tsToMs(attempt.startedAt);
  if(startedMs == null) return false;
  return Date.now() > startedMs + def.durationMin*60000;
}

// Silently launching an expired attempt (tmsPaintResumeCard, below) only OPENS the player and lets
// its own tick() do the real submit — it doesn't wait for that submit to land. The submit needs a
// moment (the freshly-opened player has to boot and post back), so checking Firestore again right
// after the launch call returns can still see the attempt as "in-progress" and repaint the same
// card. Poll a few times with a real pause between checks — instead of once, immediately — so the
// Dashboard only clears the card once the attempt is genuinely confirmed gone.
async function tmsConfirmFinished(attemptId, testId){
  for(let i=0; i<6; i++){
    await new Promise(r => setTimeout(r, 1500));
    try{
      const list = await fetchMyAttempts(testId);
      if(!list.some(a => a.id === attemptId && a.status === 'in-progress')) return;
    }catch(e){}
  }
}

// Dashboard card for an unfinished attempt. Reopening the app after closing it lands on the
// Dashboard as normal; a still-timed attempt gets its usual Resume button. One whose timer already
// ran out while the app was closed gets NO resume option at all — Firebase Spark has no server-side
// timer to submit it while the app is closed, but the instant the app runs again (this card painting
// is that moment) it finishes the attempt itself, the same way a 4th violation auto-submits, with no
// tap needed and no chance to keep answering past time.
function tmsPaintResumeCard(slot, onChange){
  const paint = items => {
    if(!slot.isConnected) return;
    slot.innerHTML = '';
    items.forEach(({ attempt, test }) => {
      if(tmsAttemptExpired(attempt, test)){
        slot.appendChild(el(`<div class="card" style="border-color:var(--warning-brd);background:var(--warning-bg)">
          <div style="font-weight:700;font-size:14px;color:var(--warning)">⏰ Time's up</div>
          <div style="font-size:14px;font-weight:600;margin:4px 0 2px">${esc((test && test.title) || 'Your test')}</div>
          <div style="font-size:12px;color:var(--text-muted);line-height:1.5">${esc(attemptLabel(attempt.attemptNumber))} · finishing this automatically\u2026</div>
        </div>`));
        // Same resume mechanism as a normal Resume tap; the player's own timer sees the deadline has
        // passed and submits immediately (showing "Time is up — submitting your test…") instead of
        // ever showing the question screen. tmsConfirmFinished waits for that real submit to land
        // before we re-check — checking right away would just catch it still mid-flight and repaint
        // the same card. A failure (e.g. genuinely offline) stays silent — the repaint below just
        // leaves the "finishing automatically…" card up until the next Dashboard load (app reopen,
        // or navigating back to it) tries again.
        tmsResumeAttemptById(attempt.id, attempt.testId, { autoResumed:true, silentError:true })
          .then(launched => launched ? tmsConfirmFinished(attempt.id, attempt.testId) : null)
          .then(() => { if(slot.isConnected) tmsLoadUnfinished(true).then(paint); });
        return;
      }
      const card = el(`<div class="card" style="border-color:var(--warning-brd);background:var(--warning-bg)">
        <div style="font-weight:700;font-size:14px;color:var(--warning)">⏳ Unfinished test</div>
        <div style="font-size:14px;font-weight:600;margin:4px 0 2px">${esc((test && test.title) || 'Your test')}</div>
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px;line-height:1.5">${esc(attemptLabel(attempt.attemptNumber))} · your answers and timer are kept.</div>
        <button class="btn btn-primary" type="button" data-resume>Resume Test</button></div>`);
      const btn = $('[data-resume]', card);
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        const ok = await tmsResumeAttemptById(attempt.id, attempt.testId, {});
        if(!ok) btn.disabled = false;
      });
      slot.appendChild(card);
    });
    if(onChange) onChange(items);   // lets the Dashboard's "What's Next" know whether this card is showing anything
  };
  tmsLoadUnfinished(false).then(paint).catch(e => { console.error('[test-engine] unfinished lookup failed:', e); if(onChange) onChange([]); });
}

// Runs once per page load after sign-in. Only a genuine RELOAD of an active test goes straight back
// into it (with that reload counted as a violation); a fresh open lands on the Dashboard.
let _tmsAfterLoginUid = null;
async function tmsAfterLogin(){
  if(!CURRENT_USER || _tmsAfterLoginUid === CURRENT_USER.uid) return;
  _tmsAfterLoginUid = CURRENT_USER.uid;
  tmsLsDel('tms:active:' + CURRENT_USER.uid);      // leftover marker from Phase 1.1 (auto-resume) — no longer used
  const p = TMS_RELOAD_PENDING; TMS_RELOAD_PENDING = null;
  if(p && p.uid === CURRENT_USER.uid && !TMS_ACTIVE){
    await tmsResumeAttemptById(p.attemptId, p.testId, { reloadViolation:true, autoResumed:true });
  }
}

/* -------- the attempt player (Live / Regular / Practice) -------- */
function launchTestPlayer(t, def, opts){
  opts = opts || {};
  if(TMS_ACTIVE) return false;                 // never two attempts at once
  const uid = CURRENT_USER.uid;
  const kind = testKind(t);
  const isPractice = kind === 'practice';
  const n = def.questions.length;
  const durationMin = isPractice ? 0 : def.durationMin;   // Practice is untimed (matches the builder's "Practice (no timer)")
  let attempt = opts.attempt || null;   // existing in-progress attempt (resume) or the one created on Start
  let rt = null;                        // { startedMs, offset, violations } — timer basis + local violation counter
  let finished = false, submitting = false, starting = false, finishedView = null;
  let lastState = { cur:0, answers:new Array(n).fill(null), seen:new Array(n).fill(false), timeSpent:new Array(n).fill(0), marked:new Array(n).fill(false) };
  let leftAt = 0;                       // set when the page goes hidden; the violation is counted when it comes back
  let autoModalPending = false;         // show "TEST AUTO-SUBMITTED" once the auto-submit has really completed
  let fsWasIn = false, fsPending = false;
  let guardDepth = 0, wl = null, wlWanted = false;
  const lifeOff = [], activeOff = [];
  const isActive = () => !!attempt && !finished && !isPractice;

  const number = attempt ? attempt.attemptNumber : (opts.attemptNumber || 1);
  const boot = {
    mode: isPractice ? 'practice' : 'attempt',
    attemptNumber: isPractice ? 0 : number,
    attemptLabel: isPractice ? 'Practice' : attemptLabel(number),
    durationMin, fullMarks: def.fullMarks, perCorrect: def.perCorrect, perWrong: def.perWrong, resume: null
  };
  const deadlineFor = () => durationMin > 0 ? (rt.startedMs - rt.offset + durationMin*60000) : 0;

  if(attempt){
    const local = tmsLsGet(tmsAttemptKey(attempt.id));
    const serverStartMs = tsToMs(attempt.startedAt);
    // Local state only belongs to THIS attempt if it was started at the same server time: an attempt an admin
    // deleted and the student later restarted reuses the same document id, so the id alone is not enough.
    const ok = !!(local && local.attemptId === attempt.id && local.studentId === uid && local.testId === t.id &&
                  Array.isArray(local.answers) && local.answers.length === n &&
                  (serverStartMs == null || Math.abs((Number(local.startedAtMs) || 0) - serverStartMs) < 1000));
    const startedMs = serverStartMs || (ok && local.startedAtMs) || Date.now();
    rt = {
      startedMs, offset: (ok && typeof local.clockOffsetMs === 'number') ? local.clockOffsetMs : 0,
      violations: (ok && Number.isInteger(local.violations) && local.violations > 0) ? local.violations : 0
    };
    if(opts.reloadViolation) rt.violations++;      // the page was reloaded while the test was on screen: one violation
    const answers = tmsCleanAnswers(ok ? local.answers : null, n);
    lastState = {
      cur: ok && Number.isInteger(local.cur) ? Math.min(Math.max(local.cur,0), n-1) : 0,
      answers, seen: tmsCleanSeen(ok ? local.seen : null, n, answers),
      // timeSpent doesn't gate `ok` above — an attempt saved before this feature existed still
      // restores its answers/position normally and simply starts every question's time at 0.
      timeSpent: tmsCleanTimeSpent(ok ? local.timeSpent : null, n),
      marked: tmsCleanMarked(ok ? local.marked : null, n)
    };
    boot.resume = { answers, seen: lastState.seen, cur: lastState.cur, deadlineMs: deadlineFor(), restored: ok,
                    timeSpent: lastState.timeSpent, marked: lastState.marked,
                    // violations already reached the limit before the page was reloaded/killed -> finish it now
                    autoSubmit: rt.violations >= MAX_TEST_SCREEN_VIOLATIONS ? 'violations' : '' };
  }

  const { overlay, frame, closeBtn, bar } = openFullscreenFrame(t.title || 'Test', boot.attemptLabel);
  frame.srcdoc = buildTestHTML(playerMeta(t, def, durationMin), def.questions, boot);
  const post = m => { try{ frame.contentWindow.postMessage(Object.assign({ tms:1 }, m), '*'); }catch(e){} };
  const on = (bucket, target, type, fn, o) => { target.addEventListener(type, fn, o); bucket.push(() => target.removeEventListener(type, fn, o)); };

  /* ---- local persistence (answers, seen, position, violation counter) ---- */
  function writeLocal(){
    if(!attempt || finished) return;
    tmsLsSet(tmsAttemptKey(attempt.id), {
      attemptId: attempt.id, studentId: uid, testId: t.id, attemptNumber: attempt.attemptNumber,
      startedAtMs: rt.startedMs, clockOffsetMs: rt.offset, violations: rt.violations,
      cur: lastState.cur, answers: lastState.answers, seen: lastState.seen, timeSpent: lastState.timeSpent, marked: lastState.marked, savedAt: Date.now()
    });
  }
  function saveLocal(m){
    const answers = tmsCleanAnswers(m.answers, n);
    lastState = { cur: Number.isInteger(m.cur) ? m.cur : 0, answers, seen: tmsCleanSeen(m.seen, n, answers),
                  timeSpent: tmsCleanTimeSpent(m.timeSpent, n), marked: tmsCleanMarked(m.marked, n) };
    writeLocal();
  }

  /* ---- warnings ---- */
  const showWarn = kind => tmsShowWarning(overlay, kind, onWarnOk);
  function onWarnOk(){
    // OK is a user gesture: the best moment to re-enter fullscreen if it was dropped
    if(isActive() && !tmsFsElement()) tmsRequestFs(overlay);
  }

  /* ---- Screen Wake Lock (best effort) ---- */
  async function acquireWL(){
    wlWanted = true;
    try{
      if(wl || !navigator.wakeLock) return;
      const s = await navigator.wakeLock.request('screen');
      if(!wlWanted){ try{ s.release(); }catch(e){} return; }
      wl = s;
      if(s.addEventListener) s.addEventListener('release', () => { if(wl === s) wl = null; });
    }catch(e){ wl = null; }
  }
  function releaseWL(){
    wlWanted = false;
    try{ if(wl){ const s = wl; wl = null; s.release(); } }catch(e){}
  }

  /* ---- Back-button guard (History API) ---- */
  function pushGuard(){ try{ history.pushState({ tmsGuard:true }, '', location.href); guardDepth++; }catch(e){} }
  function unwindGuard(){
    try{
      const d = guardDepth; guardDepth = 0;
      if(d > 0 && history.state && history.state.tmsGuard) history.go(-d);
    }catch(e){}
  }
  function onPopState(){
    if(!isActive()) return;
    guardDepth = Math.max(0, guardDepth - 1);
    pushGuard();            // put the guard entry back so the next Back is intercepted too
    showWarn('back');
  }

  /* ---- Refresh / close protection ---- */
  function onBeforeUnload(e){
    if(!isActive()) return;
    e.preventDefault();
    e.returnValue = '';     // native browser confirmation — browsers do not allow custom text here
    return '';
  }

  /* ---- Leaving the test screen (Page Visibility) ----
     One hidden -> visible round trip = ONE violation, counted when the page comes back. A page that is
     hidden and never returns (browser / PWA closed, tab closed) is therefore never counted. */
  function registerViolation(){
    rt.violations++;
    writeLocal();                                   // survives refresh / resume of this attempt
    if(rt.violations >= MAX_TEST_SCREEN_VIOLATIONS) triggerAutoSubmit();
    else showWarn(tmsViolationKind(rt.violations));
  }
  function triggerAutoSubmit(){
    autoModalPending = true;
    post({ type:'autoSubmit', reason:'violations' });   // the player runs its normal submit flow
  }
  function onVisibility(){
    if(document.visibilityState === 'hidden'){
      if(isActive() && !submitting && !leftAt) leftAt = Date.now();
    } else {
      const wasAway = leftAt; leftAt = 0;
      if(!isActive()) return;
      acquireWL();                                  // wake lock is dropped by the browser when hidden
      if(wasAway && !submitting) registerViolation();
    }
  }
  function onFsChange(){
    const inFs = tmsFsElement() === overlay;
    if(inFs){ fsWasIn = true; return; }
    if(fsWasIn){ fsWasIn = false; if(isActive()) showWarn('back'); }   // fullscreen dropped (e.g. Android Back gesture) — not counted as a violation
  }

  /* ---- enter / leave active mode ---- */
  function enterActiveMode(fsMode){          // 'now' = request fullscreen (inside a tap) · 'done' = already requested · 'wait' = request on the first tap
    TMS_ACTIVE = { testId: t.id, attemptId: attempt.id };
    tmsLsSet(TMS_SCREEN_KEY, { uid, attemptId: attempt.id, testId: t.id });   // consumed by the next page load (reload vs. close)
    overlay.classList.add('tms-active');
    bar.style.display = 'none';                     // no Close button while the attempt is running
    on(activeOff, window, 'beforeunload', onBeforeUnload);
    on(activeOff, window, 'popstate', onPopState);
    pushGuard();
    acquireWL();
    if(fsMode === 'now') tmsRequestFs(overlay);
    else if(fsMode === 'wait') fsPending = true;
  }
  function endActiveMode(){
    activeOff.splice(0).forEach(f => f());
    releaseWL();
    tmsExitFs();
    unwindGuard();
    TMS_ACTIVE = null;
    tmsLsDel(TMS_SCREEN_KEY);
    overlay.classList.remove('tms-active');
    bar.style.display = '';                         // Close is available again once the attempt is completed
  }

  on(lifeOff, document, 'visibilitychange', onVisibility);
  on(lifeOff, document, 'fullscreenchange', onFsChange);
  on(lifeOff, document, 'webkitfullscreenchange', onFsChange);

  // true only when the server positively confirms this attempt is not there any more
  async function attemptIsGone(){
    try{
      const list = await fetchMyAttempts(t.id);
      return !list.some(a => a.id === attempt.id && a.status === 'in-progress');
    }catch(e){ return false; }
  }

  /* ---- messages from the player iframe ---- */
  async function handleStart(){
    if(isPractice || attempt || starting) return;
    starting = true;
    tmsRequestFs(overlay);          // must happen synchronously inside the Start tap's user activation
    try{
      const res = await createNewAttempt(t, def);
      attempt = res.attempt; rt = { startedMs: res.startedMs, offset: res.offset, violations: 0 };
      tmsNoteUnfinished(attempt, t);
      writeLocal();
      enterActiveMode('done');
      post({ type:'started', deadlineMs: deadlineFor() });
    }catch(err){
      tmsExitFs();
      const msg = err.tmsCode === 'in-progress'
        ? 'You already have an unfinished attempt for this test. Close this screen and tap RESUME ATTEMPT.'
        : (err.tmsCode ? err.message : 'Could not start the test — check your connection and try again.');
      post({ type:'startFailed', message: msg });
    }finally{
      starting = false;
    }
  }

  async function handleSubmit(m){
    if(finished){ post({ type:'submitted', view: finishedView }); return; }
    if(submitting) return;
    submitting = true;
    try{
      const answers = tmsCleanAnswers(m.answers, n);
      const seen = tmsCleanSeen(m.seen, n, answers);
      const timeSpent = tmsCleanTimeSpent(m.timeSpent, n);
      const marked = tmsCleanMarked(m.marked, n);
      // Per-question timing AND the bookmark flag both ride in the SAME answer entries the
      // existing submission already writes — no separate document, no separate Firestore write.
      const answerDocs = answers.map((a,i)=> ({ questionIndex:i, selectedAnswer:a, seen: !!seen[i], timeSpentSeconds: timeSpent[i], marked: marked[i] }));
      const result = computeTestResult(def, answers);
      let view;
      if(isPractice){
        const rec = { id:'p'+Date.now(), submittedAtMs:Date.now(), score:result.score, total:result.total, correct:result.correct,
                      wrong:result.wrong, skipped:result.skipped, questionCount:n, answers:answerDocs };
        const hist = practiceHistory(t); hist.unshift(rec);
        tmsLsSet(tmsPracticeKey(t.id), hist.slice(0, 20));
        view = practiceRecordToView(rec, def);
      } else {
        if(!attempt) throw tmsErr('missing', 'No active attempt to submit.');
        view = await completeAttempt(t, def, attempt, answerDocs, result, kind);
        tmsLsDel(tmsAttemptKey(attempt.id));
      }
      finished = true; finishedView = view;
      if(!isPractice){ tmsDropUnfinished(attempt.id); endActiveMode(); }   // review unlocks, Close returns, wake lock + fullscreen released
      post({ type:'submitted', view });
      if(autoModalPending){ autoModalPending = false; showWarn('auto'); }
    }catch(err){
      console.error('[test-engine] submit failed:', err);
      if(!isPractice && attempt && err && (err.tmsCode === 'missing' || err.code === 'permission-denied') && await attemptIsGone()){
        // the attempt no longer exists on the server (an admin reset this student's history for the test)
        finished = true; autoModalPending = false;
        tmsLsDel(tmsAttemptKey(attempt.id)); tmsDropUnfinished(attempt.id);
        endActiveMode();
        post({ type:'attemptRemoved', message:'This attempt is no longer available. It may have been reset by your teacher. Tap Close to leave.' });
      } else {
        post({ type:'submitFailed', message: (err && err.tmsCode) ? err.message : 'Could not submit — check your connection and try again. Your answers are safe on this device.' });
      }
    }finally{
      submitting = false;
    }
  }

  function onMsg(e){
    if(e.source !== frame.contentWindow) return;   // only our own player frame
    const m = e.data;
    if(!m || m.tms !== 1) return;
    if(m.type === 'start') handleStart();
    else if(m.type === 'state') { if(attempt && !finished) saveLocal(m); }
    else if(m.type === 'submit') handleSubmit(m);
    else if(m.type === 'gesture'){
      // first tap after an auto-resume (no user activation at load): re-enter fullscreen + re-arm the Back guard
      if(fsPending && isActive()){ fsPending = false; if(!tmsFsElement()) tmsRequestFs(overlay); pushGuard(); }
    }
  }
  on(lifeOff, window, 'message', onMsg);

  closeBtn.addEventListener('click', () => {
    if(isActive()){ showWarn('back'); return; }    // defence in depth: the bar is hidden while active
    lifeOff.splice(0).forEach(f => f());
    overlay.remove();
    if(opts.onExit) opts.onExit();
  });

  // Resuming an attempt: go straight back into active mode.
  if(attempt){
    enterActiveMode(opts.autoResumed ? 'wait' : 'now');   // a tap on RESUME can request fullscreen; a reload-return waits for the first tap
    tmsNoteUnfinished(attempt, t);
    if(opts.reloadViolation) writeLocal();          // persist the +1 for the reload
    if(boot.resume.autoSubmit) autoModalPending = true;   // the player submits by itself (violation limit reached)
    else if(opts.reloadViolation) showWarn(tmsViolationKind(rt.violations));
  }
  return true;
}

/* -------- per-test hub (attempts, history, start / resume / reattempt) -------- */
function openTestHub(t, ctx){
  const def = getTestDef(t);
  const kind = testKind(t);
  const isPractice = kind === 'practice';
  const km = TEST_KIND_META[kind];
  const overlay = el(`<div class="overlay open"><div class="sheet">
    <div class="sheet-handle"></div><button class="sheet-close" id="hubClose" aria-label="Close">${icon('close')}</button><div style="clear:both"></div>
    <div id="hubBody"><div class="spinner"></div></div>
  </div></div>`);
  document.body.appendChild(overlay);
  const body = $('#hubBody', overlay);
  $('#hubClose', overlay).addEventListener('click', () => overlay.remove());

  // The hub is hidden (not just covered) while a player is open, and refreshed when it closes.
  function play(o){
    overlay.style.display = 'none';
    if(!launchTestPlayer(t, def, Object.assign({ onExit: () => { overlay.style.display = ''; refresh(); } }, o))) overlay.style.display = '';
  }

  function histRow(o){
    return `<div style="padding:9px 0;border-bottom:1px solid var(--border-soft)">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <div style="min-width:0"><div style="font-size:13px;font-weight:700">${esc(o.label)}</div>
        <div style="font-size:11px;color:var(--text-dim)">${esc(fmtDateTime(o.ms))}</div></div>
        <div style="font-size:14px;font-weight:700">${esc(fmtMarks(o.score))}/${esc(fmtMarks(o.total))}</div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:8px">
        <div style="font-size:11px;color:var(--text-muted)">✓ ${o.correct} correct · ✗ ${o.wrong} wrong · — ${o.skipped} unanswered</div>
        ${o.rv ? `<button class="btn-sm btn-ghost" data-rv="${esc(o.rv)}">Review</button>` : ''}
      </div></div>`;
  }

  function paint(list){
    const dur = (!isPractice && def.durationMin) ? (' · ' + def.durationMin + ' min') : '';
    const lw = liveWindowState(t);
    let inprogExpired = false;
    let inprog = null;
    let html = `<div class="card">
      <div style="font-size:16px;font-weight:700">${esc(t.title || 'Untitled test')}</div>
      <div class="item-meta">${esc(t.subject || '')}${t.subject ? ' · ' : ''}${def.questions.length} Qs${dur} · Full marks ${esc(fmtMarks(def.fullMarks))}</div>
      <div class="item-badges" style="margin-top:6px"><span class="badge badge-accent">${km.icon} ${km.label}</span></div>
      ${(lw.configured && kind === 'live') ? `<div class="hint" style="margin-top:8px;font-size:12px;color:var(--text-muted)">Start window: ${esc(fmtDateTime(lw.start))}${lw.end ? ' → ' + esc(fmtDateTime(lw.end)) : ''}</div>` : ''}
    </div>`;

    if(isPractice){
      const hist = practiceHistory(t);
      html += `<div class="card-title" style="margin:12px 0 4px">Practice history (this device only)</div>`;
      html += hist.length
        ? hist.map(r => histRow({ label:'Practice', ms:r.submittedAtMs, score:r.score, total:r.total, correct:r.correct, wrong:r.wrong, skipped:r.skipped, rv:r.id })).join('')
        : `<div class="empty-state" style="padding:14px 0">No practice attempts yet.</div>`;
      html += `<button class="btn btn-primary" id="hubStart" style="margin-top:14px">Start Practice</button>
               <div style="font-size:11px;color:var(--text-dim);margin-top:8px;line-height:1.5">Unlimited attempts. No time limits.</div>`;
    } else {
      const done = list.filter(a => a.status === 'completed');
      inprog = list.find(a => a.status === 'in-progress');
      const legacy = ctx.legacy(t.id);
      html += `<div class="card-title" style="margin:12px 0 4px">Attempts: ${list.length}/${TEST_MAX_ATTEMPTS}</div>`;
      inprogExpired = !!(inprog && tmsAttemptExpired(inprog, t));
      if(inprogExpired){
        // Same reasoning as the Dashboard card: no button, no chance to keep answering past time —
        // this fires as soon as the hub is opened, the same way a 4th violation auto-submits.
        html += `<div class="card" style="border-color:var(--warning-brd);background:var(--warning-bg)">
          <div style="font-weight:700;font-size:14px;color:var(--warning)">⏰ Time's up</div>
          <div style="font-size:12px;color:var(--text-muted);margin:4px 0 0;line-height:1.5">${esc(attemptLabel(inprog.attemptNumber))} is finishing automatically\u2026</div></div>`;
      } else if(inprog){
        html += `<div class="card" style="border-color:var(--warning-brd);background:var(--warning-bg)">
          <div style="font-weight:700;font-size:14px;color:var(--warning)">You have an unfinished attempt. Resume?</div>
          <div style="font-size:12px;color:var(--text-muted);margin:4px 0 10px;line-height:1.5">${esc(attemptLabel(inprog.attemptNumber))} (attempt ${inprog.attemptNumber}) is still in progress. Resuming does not use another attempt. Review of earlier attempts stays locked until you submit it.</div>
          <button class="btn btn-primary" id="hubResume">RESUME ATTEMPT</button></div>`;
      }
      html += done.length
        ? done.slice().reverse().map(a => histRow({ label:attemptLabel(a.attemptNumber), ms:tsToMs(a.submittedAt), score:a.score, total:a.total, correct:a.correct, wrong:a.wrong, skipped:a.skipped, rv: inprog ? '' : a.id })).join('')
        : (inprog ? '' : `<div class="empty-state" style="padding:14px 0">You haven\u2019t attempted this test yet.</div>`);
      if(legacy.length){
        html += `<div class="card-title" style="margin:14px 0 4px;font-size:12px">Earlier results (before attempt history)</div>`;
        html += legacy.map(r => histRow({ label:'Earlier result', ms:tsToMs(r.submittedAt), score:r.score, total:r.total, correct:'–', wrong:'–', skipped:'–', rv:'' })).join('');
      }
      if(!inprog){
        if(list.length >= TEST_MAX_ATTEMPTS){
          html += `<div style="font-size:12px;color:var(--text-muted);margin-top:14px">All ${TEST_MAX_ATTEMPTS} attempts used. Your results and reviews stay available here.</div>`;
        } else if(!lw.open){
          html += `<div class="auth-error" style="margin-top:14px;display:block">${esc(lw.msg)}</div>`;
        } else {
          html += `<button class="btn btn-primary" id="hubStart" style="margin-top:14px">${list.length === 0 ? 'Start Test' : 'Reattempt'}</button>
                   <div style="font-size:11px;color:var(--text-dim);margin-top:8px;line-height:1.5">${TEST_MAX_ATTEMPTS} attempts in total. If you leave a started attempt, you can resume it on this device.</div>`;
        }
      }
    }
    body.innerHTML = html;
    // Same fire-immediately, no-button treatment as the Dashboard card (see tmsPaintResumeCard) —
    // launchTestPlayer here has no error toast of its own, so a network hiccup just leaves the
    // "finishing automatically…" card showing until the hub is reopened or the Dashboard picks it up.
    if(!isPractice && inprogExpired) play({ attempt: inprog, autoResumed:true });

    const startBtn = $('#hubStart', body);
    if(startBtn) startBtn.addEventListener('click', () => {
      play({ attemptNumber: isPractice ? 0 : list.length + 1 });
    });
    const resumeBtn = $('#hubResume', body);
    if(resumeBtn) resumeBtn.addEventListener('click', () => {
      const ip = list.find(a => a.status === 'in-progress');
      play({ attempt: ip });
    });
    $all('[data-rv]', body).forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.rv;
      if(isPractice){
        const r = practiceHistory(t).find(x => x.id === id);
        if(r) openAttemptReview(t, def, practiceRecordToView(r, def));
      } else {
        const a = list.find(x => x.id === id);
        if(list.some(x => x.status === 'in-progress')){ toast('Review is locked while a test attempt is in progress.'); return; }
        if(a) openAttemptReview(t, def, attemptToView(a, def, { studentName: (CURRENT_PROFILE && CURRENT_PROFILE.fullName) || '' }));
      }
    }));
  }

  async function refresh(){
    if(isPractice){ paint([]); return; }
    try{
      const list = await fetchMyAttempts(t.id);      // fresh from the server — Firestore is authoritative
      ctx.setAttempts(t.id, list);
      tmsSyncUnfinishedFromList(t, list);
      paint(list);
    }catch(e){
      console.error('[test-engine] hub load failed:', e);
      body.innerHTML = `<div class="empty-state">Could not load your attempts — check your connection.</div><button class="btn btn-ghost" id="hubRetry" style="margin-top:10px">Retry</button>`;
      $('#hubRetry', body).addEventListener('click', refresh);
    }
  }
  refresh();
}

   STUDENT — Tests tab
   ================================================================ */
function renderTestsTab(container){
  container.appendChild(el(`<div class="search-input-wrap"><span class="si">${icon('search',15)}</span><input type="text" id="stSearch" placeholder="Search tests..."></div>`));
  const subjectRow = el(`<div class="tab-filter" id="stSubjectRow"></div>`);
  container.appendChild(subjectRow);
  const filterRow = el(`<div class="tab-filter">
    <button data-f="all">All</button>
    <button data-f="live">🔴 Live</button>
    <button data-f="regular">⏱ Regular</button>
    <button data-f="practice">📚 Practice</button>
  </div>`);
  container.appendChild(filterRow);
  const countLbl = el(`<div class="count" style="margin:-4px 0 8px"></div>`);
  container.appendChild(countLbl);
  const listBox = el(`<div><div class="spinner"></div></div>`);
  container.appendChild(listBox);

  let currentFilter = 'all';
  let currentSubject = '';   // '' = All Subjects
  let currentSearch = '';
  $all('button', filterRow).forEach(b=> b.classList.toggle('active', b.dataset.f===currentFilter));
  filterRow.addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b) return;
    currentFilter = b.dataset.f;
    $all('button',filterRow).forEach(x=>x.classList.toggle('active', x===b));
    applyFilter();
  });
  $('#stSearch', container).addEventListener('input', ()=>{
    currentSearch = $('#stSearch', container).value;
    applyFilter();
  });
  subjectRow.addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b) return;
    currentSubject = b.dataset.subj;
    applyFilter();
  });

  let allTests = [];
  let attemptsByTest = {};   // testId -> [attempt docs] (Live/Regular)
  let legacyByTest = {};     // testId -> [testResults rows from before attempt tracking]

  const ctx = {
    attempts: id => attemptsByTest[id] || [],
    legacy:   id => legacyByTest[id] || [],
    // called by the hub after it re-reads a test's attempts from the server; repaints the card badges
    setAttempts: (id, list) => { attemptsByTest[id] = list; applyFilter(); }
  };

  async function loadHistory(){
    try{
      const uid = CURRENT_USER.uid;
      const [aSnap, rSnap] = await Promise.all([
        db.collection(COL.testAttempts).where('studentId','==',uid).get(),
        db.collection(COL.testResults).where('studentId','==',uid).get()
      ]);
      attemptsByTest = {}; legacyByTest = {};
      aSnap.forEach(d => { const a = { id:d.id, ...d.data() }; (attemptsByTest[a.testId] = attemptsByTest[a.testId] || []).push(a); });
      Object.keys(attemptsByTest).forEach(k => attemptsByTest[k].sort((a,b)=> (a.attemptNumber||0)-(b.attemptNumber||0)));
      rSnap.forEach(d => { const r = d.data(); if(r.attemptId) return; (legacyByTest[r.testId] = legacyByTest[r.testId] || []).push(r); });
    }catch(e){ console.error('[test-engine] history load failed:', e); }
    applyFilter();
  }
  loadHistory();

  syncAndGetMyBatchIds().then(ids=>{
    if(!ids.length){ listBox.innerHTML = '<div class="empty-state">Your batch access isn\u2019t set up yet — ask your teacher.</div>'; return; }
    const unsub = listenContentByBatchIds(COL.tests, selectedContentIds(ids), null, items=>{
      // Test Activate/Deactivate: missing field == active (backward compatible with every
      // published test that predates this feature); explicit false == hidden, same as
      // announcements/banners. The rules' own `list` gate already enforces this server-side —
      // this is a defensive second layer, not a new read.
      allTests = items.filter(t => t.active !== false);
      applyFilter();
    }, ()=>{ listBox.innerHTML = '<div class="empty-state">Could not load — check your connection.</div>'; });
    trackUnsub(unsub);
  });

  function clearFilters(){
    currentFilter = 'all'; currentSubject = ''; currentSearch = '';
    $('#stSearch', container).value = '';
    $all('button', filterRow).forEach(x=> x.classList.toggle('active', x.dataset.f==='all'));
    applyFilter();
  }

  function renderSubjectChips(){
    // Subjects are derived only from `allTests` — the already-authorized, batch-filtered
    // set delivered by listenContentByBatchIds() above — so this is a UI filter over data
    // the student can already see, never a way to discover or reach unauthorized tests.
    const subjects = uniqueSubjects(allTests);
    subjectRow.innerHTML = `<button data-subj="" class="${currentSubject===''?'active':''}">All</button>` +
      subjects.map(s=>`<button data-subj="${esc(s.key)}" class="${currentSubject===s.key?'active':''}">${esc(s.label)}</button>`).join('');
  }

  function applyFilter(){
    let filtered = currentFilter==='all' ? allTests.slice() : allTests.filter(t=>testKind(t)===currentFilter);
    if(currentSubject) filtered = filtered.filter(t=> normalizeSubjectKey(t.subject)===currentSubject);
    const q = currentSearch.trim().toLowerCase();
    if(q) filtered = filtered.filter(t=> (t.title||'').toLowerCase().includes(q));
    renderSubjectChips();
    countLbl.textContent = allTests.length ? (filtered.length + ' of ' + allTests.length + ' test' + (allTests.length===1?'':'s')) : '';
    renderTestList(listBox, filtered, ctx, { totalCount: allTests.length, onClearFilters: clearFilters });
  }
}

function renderTestList(box, tests, ctx, opts){
  opts = opts || {};
  box.innerHTML='';
  if(!tests.length){
    if(!opts.totalCount){
      box.appendChild(el(`<div class="empty-state"><div class="icon">📝</div>No tests here yet.</div>`));
    } else {
      const es = el(`<div class="empty-state"><div class="icon">🔍</div>No tests match your filters.</div>`);
      if(opts.onClearFilters){
        const btn = el(`<button class="btn btn-ghost" style="max-width:200px;margin:12px auto 0">✕ Clear Filters</button>`);
        btn.addEventListener('click', opts.onClearFilters);
        es.appendChild(btn);
      }
      box.appendChild(es);
    }
    return;
  }
  tests.forEach(t=>{
    const kind = testKind(t), km = TEST_KIND_META[kind];
    const def = getTestDef(t);
    let badges = `<span class="badge badge-accent">${km.icon} ${km.label}</span>`;
    if(def.engine && kind !== 'practice'){
      const list = ctx.attempts(t.id);
      const done = list.filter(a => a.status === 'completed');
      const last = done[done.length-1];
      badges += `<span class="badge badge-muted">Attempts ${list.length}/${TEST_MAX_ATTEMPTS}</span>`;
      if(list.some(a => a.status === 'in-progress')) badges += `<span class="badge badge-paid">Unfinished</span>`;
      if(last) badges += `<span class="badge badge-muted">${esc(fmtMarks(last.score))}/${esc(fmtMarks(last.total))}</span>`;
    } else if(!def.engine){
      const lg = ctx.legacy(t.id); const r = lg[lg.length-1];
      if(r) badges += `<span class="badge badge-muted">${esc(r.score)}/${esc(r.total)}</span>`;
    }
    const card = el(`
      <div class="item-card tap-card">
        <div class="item-top">
          <div class="item-icon">${km.icon}</div>
          <div class="item-info">
            <div class="item-title">${esc(t.title||'Untitled test')}</div>
            <div class="item-meta">${esc(t.subject||'')}${t.duration?(' · '+t.duration+' min'):''}${t.questionCount?(' · '+t.questionCount+' Qs'):''}</div>
            <div class="item-badges">${badges}</div>
          </div>
        </div>
      </div>`);
    card.addEventListener('click', ()=> def.engine ? openTestHub(t, ctx) : openLegacyTestPlayer(t));
    box.appendChild(card);
  });
}

/* Legacy path — only for tests whose HTML has no readable question data
   (pasted HTML). Same one-shot behaviour as before, except Practice no
   longer writes to Firestore and only messages from this frame count. */
function openLegacyTestPlayer(t){
  const { overlay, frame, closeBtn } = openFullscreenFrame(t.title || '', '');
  frame.srcdoc = t.htmlContent || '<p style="font-family:sans-serif;padding:20px;color:#888">No content in this test yet.</p>';
  function onMsg(e){
    if(e.source !== frame.contentWindow) return;
    if(e.data && e.data.type === 'submit_test'){
      if(testKind(t) !== 'practice' && Number.isFinite(Number(e.data.score)) && Number.isFinite(Number(e.data.total))){
        saveTestResult(t, Number(e.data.score), Number(e.data.total));
      }
      window.removeEventListener('message', onMsg);
    }
  }
  window.addEventListener('message', onMsg);
  closeBtn.addEventListener('click', ()=>{ window.removeEventListener('message', onMsg); overlay.remove(); });
}

async function saveTestResult(t, score, total){
  try{
    await db.collection(COL.testResults).add({
      testId: t.id, testTitle: t.title||'', studentId: CURRENT_USER.uid,
      studentName: CURRENT_PROFILE.fullName||'', score, total,
      submittedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    toast(`Score saved: ${score}/${total}`);
  }catch(e){
    console.error(e);
    toast('Could not save result — check your connection.');
  }
}

  items.forEach(n=>{

      </div>`);
    card.addEventListener('click', ()=>{
      if(!n.driveId){ toast('File link not set yet.'); return; }
      if(n.downloadable){ window.open(n.driveLink || ('https://drive.google.com/file/d/'+n.driveId+'/view'), '_blank'); }
      else { openPdfViewer(n); }
    });
    box.appendChild(card);
  });
}

/* Pulls the file ID out of any common Google Drive share-link format:
   .../file/d/ID/view   or   ...?id=ID   or   .../open?id=ID */
function driveIdFromUrl(url){
  url = (url||'').trim();
  let m = url.match(/\/file\/d\/([A-Za-z0-9_-]+)/);
  if(m) return m[1];
  m = url.match(/[?&]id=([A-Za-z0-9_-]+)/);
  if(m) return m[1];
  return url; // maybe they already pasted just the raw ID
}

/* Populates a <select> with a "visible to every student" option plus
   every currently-active batch, used by every admin content-creation
   form (recorded classes, live classes, both test builders, notes/
   assignments) so the admin picks a real batch — or deliberately marks
   content as general — instead of typing a free-text name. The general
   option's value is GENERAL_BATCH_ID, the same sentinel every active
   student's activeBatchIds always includes (see firestore.rules), so
   content saved with it is immediately, securely visible to everyone
   without needing a batch/enrollment at all. One-time fetch (matches the
   same pattern already used for the student-enrollment batch search
   above) rather than a live listener — the dropdown doesn't need to be
   real-time. */
function loadActiveBatchesInto(selectEl){
  selectEl.appendChild(el(`<option value="${esc(GENERAL_BATCH_ID)}">🎁 Free Demo</option>`));
  return db.collection(COL.batches).where('status','==','active').get().then(snap=>{
    const batches = []; snap.forEach(d=> batches.push({id:d.id, name:d.data().name||'(unnamed batch)'}));
    batches.sort((a,b)=> a.name.localeCompare(b.name));
    batches.forEach(b=> selectEl.appendChild(el(`<option value="${esc(b.id)}">${esc(b.name)}</option>`)));
  }).catch(e=>{ console.error('[batches] could not load batch list:', e); });
}

/* ================================================================
   ANNOUNCEMENTS (Phase E)
   ----------------------------------------------------------------
   Same batch-authorization model as Classes/Tests/Notes: the query is
   constrained to the student's own activeBatchIds (which always
   includes GENERAL_BATCH_ID), and firestore.rules independently
   re-verifies that server-side — see listenContentByBatchIds() and
   firestore.rules' announcements section. Read state is a lightweight,
   self-only array on the student's own document (students/{uid}.
   readAnnouncementIds) — already permitted by the existing self-update
   rule, since it isn't one of the three locked fields (membership,
   active, activeBatchIds), so no rules change was needed for it.
   ================================================================ */
function renderAnnouncementsTab(container){
  const listBox = el(`<div><div class="spinner"></div></div>`);
  container.appendChild(listBox);
  syncAndGetMyBatchIds().then(ids=>{
    if(!ids.length){ listBox.innerHTML = '<div class="empty-state">Your batch access isn\u2019t set up yet — ask your teacher.</div>'; return; }
    let lastItems = [];
    const unsub = listenContentByBatchIds(COL.announcements, ids, {field:'active', value:true}, items=>{
      items.sort((a,b)=>{
        const at = (a.createdAt && a.createdAt.toDate) ? a.createdAt.toDate().getTime() : 0;
        const bt = (b.createdAt && b.createdAt.toDate) ? b.createdAt.toDate().getTime() : 0;
        return bt - at; // newest first
      });
      lastItems = items;
      renderAnnouncementsList(listBox, items);
    }, ()=>{ listBox.innerHTML = '<div class="empty-state">Could not load — check your connection.</div>'; });
    trackUnsub(unsub);
    // "Got it" repaints just this list from the items already loaded — no re-render of the whole screen, no re-read.
    trackUnsub(annReadSubscribe(()=> renderAnnouncementsList(listBox, lastItems)));
  });
}

function renderAnnouncementsList(box, items){
  box.innerHTML='';
  if(!items.length){ box.appendChild(el(`<div class="empty-state"><div class="icon">📢</div>No announcements yet.</div>`)); return; }
  const readIds = new Set((CURRENT_PROFILE && CURRENT_PROFILE.readAnnouncementIds) || []);
  items.forEach(a=>{
    const isUnread = !readIds.has(a.id);
    const card = el(`<div class="item-card">
      <div class="item-top"><div class="item-icon">📢</div><div class="item-info">
        <div class="item-title">${esc(a.title)}</div>
        <div class="item-meta" style="white-space:pre-wrap">${esc(a.message)}</div>
        <div class="item-badges">
          ${isUnread ? '<span class="badge badge-paid">🆕 New</span>' : ''}
          <span class="badge badge-muted">${esc(a.batchName||'')}</span>
          <span class="badge badge-muted">${fmtDate(a.createdAt)}</span>
        </div>
        ${isUnread ? '<button class="btn btn-primary" type="button" data-got style="width:auto;padding:8px 16px;font-size:13px;margin-top:10px">Got it ✓</button>' : ''}
      </div></div>
    </div>`);
    // Only this explicit button marks an announcement read — rendering or opening the page never does.
    if(isUnread){
      const gotBtn = $('[data-got]', card);
      gotBtn.addEventListener('click', ()=>{ gotBtn.disabled = true; markAnnouncementRead(a.id); });
    }
    box.appendChild(card);
  });
}

function markAnnouncementRead(id){
  if(!CURRENT_USER || !CURRENT_PROFILE || !id) return;
  const cur = CURRENT_PROFILE.readAnnouncementIds || [];
  if(cur.includes(id)) return;                       // already read — never write twice
  CURRENT_PROFILE.readAnnouncementIds = cur.concat([id]);
  annReadEmit();                                     // instant local UI update (Announcements list + Dashboard), no screen re-render
  db.collection(COL.students).doc(CURRENT_USER.uid).update({
    readAnnouncementIds: firebase.firestore.FieldValue.arrayUnion(id)   // existing read-state field, existing self-update rule
  }).catch(e=>{
    console.error('[announcements] could not mark read:', e);
    if(CURRENT_PROFILE) CURRENT_PROFILE.readAnnouncementIds = (CURRENT_PROFILE.readAnnouncementIds||[]).filter(x=> x !== id);
    annReadEmit();
    toast('Could not save — try again');
  });
}
